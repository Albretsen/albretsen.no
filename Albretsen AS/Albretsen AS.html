<!doctype html>
<html lang="nb" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Albretsen AS · Programvare fra Bergen</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <meta name="description" content="Albretsen AS er et lite programvarestudio i Bergen. Konsulentarbeid, egne produkter og praktisk AI." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       Albretsen AS — tokens (copied from design system)
       ============================================================ */
    :root {
      --bg:        #F4F0E6;
      --bg-2:      #ECE7D9;
      --bg-3:      #E0DAC8;
      --surface:   #FAF7EE;

      --fg:        #1A1714;
      --fg-2:      #4F4940;
      --fg-3:      #847C6E;
      --fg-inv:    #F4F0E6;

      --border:    #D5CFBE;
      --border-2:  #B8B19E;

      --clay:        #A03E2A;
      --clay-soft:   #F0DDD5;
      --moss:        #4A6B3B;
      --moss-soft:   #E0E7D6;
      --ochre:       #B0822C;
      --ochre-soft:  #EFE3C8;
      --fjord:       #3D5C6E;
      --fjord-soft:  #DCE5EB;

      --accent:        var(--moss);
      --accent-hover:  #38522D;
      --accent-soft:   var(--moss-soft);
      --accent-fg:     #F4F0E6;

      --success:       var(--moss);
      --warn:          var(--ochre);
      --danger:        #7E2F1F;

      --focus:     var(--moss);
      --focus-ring: 0 0 0 3px rgba(74, 107, 59, 0.22);

      --shadow-1: 0 1px 0 rgba(20, 19, 15, 0.04), 0 1px 2px rgba(20, 19, 15, 0.04);
      --shadow-2: 0 1px 0 rgba(20, 19, 15, 0.04), 0 4px 12px rgba(20, 19, 15, 0.06);

      --font-sans:    "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --font-display: "Instrument Serif", "Iowan Old Style", "Palatino", "Georgia", serif;
      --font-mono:    "Geist Mono", ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;

      --fs-12: 0.75rem;
      --fs-13: 0.8125rem;
      --fs-14: 0.875rem;
      --fs-16: 1rem;
      --fs-18: 1.125rem;
      --fs-20: 1.25rem;
      --fs-24: 1.5rem;
      --fs-30: 1.875rem;
      --fs-38: 2.375rem;
      --fs-48: 3rem;
      --fs-64: 4rem;
      --fs-88: 5.5rem;

      --lh-tight:  1.05;
      --lh-snug:   1.2;
      --lh-normal: 1.5;
      --lh-loose:  1.65;

      --ls-tight:   -0.02em;
      --ls-snug:    -0.01em;
      --ls-normal:   0;
      --ls-wide:     0.04em;
      --ls-wider:    0.12em;

      --space-1:  4px;  --space-2:  8px;  --space-3:  12px;
      --space-4:  16px; --space-5:  24px; --space-6:  32px;
      --space-7:  48px; --space-8:  64px; --space-9:  96px;
      --space-10: 128px; --space-11: 160px;

      --radius-1: 2px; --radius-2: 4px; --radius-3: 8px; --radius-4: 12px;
      --radius-full: 999px;

      --ease-out:    cubic-bezier(0.22, 0.61, 0.36, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --dur-fast:    140ms;
      --dur-base:    220ms;
      --dur-slow:    480ms;

      --measure:     64ch;
      --container:   1180px;
      --container-narrow: 760px;

      --nav-h: 64px;
      --gutter: clamp(20px, 4vw, 40px);
    }

    [data-theme="dark"] {
      --bg:        #1A1410;
      --bg-2:      #251D16;
      --bg-3:      #322822;
      --surface:   #251D16;

      --fg:        #EFE5CD;
      --fg-2:      #B0A48C;
      --fg-3:      #786C5A;
      --fg-inv:    #1A1410;

      --border:    #3A2F25;
      --border-2:  #503F31;

      --clay:        #D87158;
      --clay-soft:   #2A1813;
      --moss:        #86A372;
      --moss-soft:   #1E2A17;
      --ochre:       #D6A656;
      --ochre-soft:  #2A1F0E;
      --fjord:       #7BA0B5;
      --fjord-soft:  #162028;

      --accent:        var(--moss);
      --accent-hover:  #A2BC8E;
      --accent-soft:   var(--moss-soft);
      --accent-fg:     #16110D;

      --shadow-1: 0 1px 0 rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.5);
      --shadow-2: 0 1px 0 rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.55);
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; scroll-behavior: smooth; }
    [data-theme="dark"] { color-scheme: dark; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: var(--fs-16);
      line-height: var(--lh-normal);
      font-feature-settings: "ss01", "cv11";
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      transition: background 280ms var(--ease-out), color 280ms var(--ease-out);
    }

    ::selection { background: var(--accent); color: var(--accent-fg); }
    :focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-2); }

    a { color: var(--accent); text-decoration: none; text-underline-offset: 3px; text-decoration-thickness: 1px; transition: color var(--dur-fast) var(--ease-out); }
    a:hover { text-decoration: underline; color: var(--accent-hover); }

    h1, h2, h3, h4, p { margin: 0; }

    /* ============================================================
       Nav
       ============================================================ */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      height: var(--nav-h);
      padding: 0 var(--gutter);
      background: color-mix(in oklab, var(--bg) 88%, transparent);
      border-bottom: 1px solid transparent;
      backdrop-filter: saturate(140%) blur(10px);
      -webkit-backdrop-filter: saturate(140%) blur(10px);
      transition: border-color var(--dur-base) var(--ease-out), background var(--dur-base) var(--ease-out);
    }
    .nav.is-scrolled { border-bottom-color: var(--border); }

    .nav-brand {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      font-family: var(--font-sans);
      font-weight: 500;
      font-size: 15px;
      letter-spacing: -0.014em;
      color: var(--fg);
      text-decoration: none;
    }
    .nav-brand:hover { text-decoration: none; color: var(--fg); }
    .nav-brand-suffix {
      color: var(--fg-3);
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: var(--space-6);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: var(--space-6);
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .nav-link {
      font-family: var(--font-sans);
      font-size: 13.5px;
      color: var(--fg-2);
      text-decoration: none;
      letter-spacing: -0.005em;
      transition: color var(--dur-fast) var(--ease-out);
      cursor: pointer;
      background: none;
      border: 0;
      padding: 4px 0;
      font-weight: 400;
    }
    .nav-link:hover { color: var(--fg); text-decoration: none; }

    .nav-theme {
      width: 30px; height: 30px;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      padding: 0;
      color: var(--fg);
      transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
    }
    .nav-theme:hover { border-color: var(--border-2); background: var(--bg-2); }
    .th-glyph {
      width: 14px; height: 14px;
      border-radius: 999px;
      overflow: hidden;
      display: inline-flex;
      position: relative;
      border: 1px solid var(--fg);
    }
    .th-half { flex: 1; height: 100%; }
    .th-half--l { background: var(--fg); }
    .th-half--r { background: transparent; }
    .th-glyph.is-dark .th-half--l { background: transparent; }
    .th-glyph.is-dark .th-half--r { background: var(--fg); }

    @media (max-width: 640px) {
      .nav-links { gap: var(--space-4); }
      .nav-link { font-size: 13px; }
      .nav-brand-suffix { display: none; }
    }

    /* ============================================================
       Page shell + section frame
       ============================================================ */
    main {
      padding-top: var(--nav-h);
      max-width: var(--container);
      margin: 0 auto;
      padding-left: var(--gutter);
      padding-right: var(--gutter);
    }

    section { scroll-margin-top: calc(var(--nav-h) + 24px); }

    .ed-head {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 24px;
      align-items: baseline;
      margin-bottom: var(--space-8);
    }
    .ed-head-n {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg-3);
    }
    .ed-head-title {
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: clamp(34px, 4.6vw, 52px);
      line-height: 1.04;
      letter-spacing: -0.03em;
      margin: 0;
      color: var(--fg);
      text-wrap: balance;
    }
    .ed-head-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg-3);
      margin-top: 14px;
    }

    @media (max-width: 720px) {
      .ed-head { grid-template-columns: 40px 1fr; gap: 14px; }
    }

    /* ============================================================
       Hero
       ============================================================ */
    .hero {
      padding-top: clamp(48px, 9vw, 120px);
      padding-bottom: clamp(64px, 9vw, 128px);
      border-bottom: 1px solid var(--border);
    }
    .hero-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--fg-3);
      margin-bottom: var(--space-7);
      flex-wrap: wrap;
    }
    .hero-meta-rule { flex: 0 0 24px; height: 1px; background: var(--border); }
    .hero-meta-status {
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .hero-status-dot {
      width: 7px; height: 7px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 22%, transparent);
      animation: pulse 2.4s var(--ease-in-out) infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 22%, transparent); }
      50%      { box-shadow: 0 0 0 6px color-mix(in oklab, var(--accent) 8%, transparent); }
    }

    .hero-display {
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: clamp(56px, 10vw, 132px);
      line-height: 0.95;
      letter-spacing: -0.045em;
      color: var(--fg);
      margin: 0 0 var(--space-7);
      text-wrap: balance;
    }
    .hero-display em {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--fg);
    }

    .hero-byline {
      font-family: var(--font-sans);
      font-size: clamp(17px, 1.6vw, 19px);
      line-height: 1.55;
      color: var(--fg-2);
      margin: 0 0 var(--space-8);
      max-width: 54ch;
    }

    .hero-ctas {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      margin-bottom: var(--space-9);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 44px;
      padding: 0 22px;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.005em;
      line-height: 1;
      color: var(--accent-fg);
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: var(--radius-2);
      cursor: pointer;
      transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-fg); text-decoration: none; }
    .btn:active { transform: translateY(0.5px); }

    .btn--secondary {
      background: transparent;
      color: var(--fg);
      border-color: var(--border-2);
    }
    .btn--secondary:hover { background: var(--bg-2); color: var(--fg); border-color: var(--fg-2); }

    .btn-arrow {
      font-family: var(--font-mono);
      font-size: 13px;
      transition: transform var(--dur-base) var(--ease-out);
    }
    .btn:hover .btn-arrow { transform: translateX(3px); }

    /* Hero index list — a quick contents preview */
    .hero-index {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
    }
    .hero-index-row {
      display: grid;
      grid-template-columns: 56px 1fr 1.4fr 24px;
      gap: 24px;
      align-items: baseline;
      padding: 20px 4px;
      border-bottom: 1px solid var(--border);
      color: var(--fg);
      text-decoration: none;
      transition: background 200ms var(--ease-out), padding 200ms var(--ease-out);
      cursor: pointer;
    }
    .hero-index-row:hover {
      background: var(--bg-2);
      padding-left: 14px;
      text-decoration: none;
    }
    .hero-index-row:hover .hero-index-arrow { color: var(--accent); transform: translateX(4px); }
    .hero-index-n {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--fg-3);
      letter-spacing: 0.06em;
    }
    .hero-index-t {
      font-family: var(--font-sans);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.018em;
      color: var(--fg);
      line-height: 1;
    }
    .hero-index-d {
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--fg-2);
    }
    .hero-index-arrow {
      font-family: var(--font-mono);
      color: var(--fg-3);
      transition: color 140ms var(--ease-out), transform 200ms var(--ease-out);
      text-align: right;
    }
    @media (max-width: 720px) {
      .hero-index-row { grid-template-columns: 40px 1fr 24px; }
      .hero-index-d { display: none; }
    }

    /* ============================================================
       Services
       ============================================================ */
    .section {
      padding: clamp(72px, 10vw, 128px) 0;
      border-bottom: 1px solid var(--border);
    }

    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-8) var(--space-7);
    }
    .service {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-top: var(--space-5);
      border-top: 1px solid var(--border);
    }
    .service-icon {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius-2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--fg);
      background: var(--bg);
      margin-bottom: 8px;
      transition: border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
    }
    .service:hover .service-icon {
      border-color: var(--fg-2);
      color: var(--accent);
    }
    .service-icon svg { width: 22px; height: 22px; stroke-width: 1.5; }
    .service-n {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg-3);
    }
    .service-title {
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: clamp(22px, 2.2vw, 28px);
      line-height: 1.18;
      letter-spacing: -0.022em;
      color: var(--fg);
      margin: 0 0 4px;
    }
    .service-body {
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.6;
      color: var(--fg-2);
      max-width: 52ch;
      margin: 0;
    }
    @media (max-width: 720px) {
      .services { grid-template-columns: 1fr; gap: var(--space-6); }
    }

    /* ============================================================
       Clients
       ============================================================ */
    .clients-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-8);
      align-items: start;
    }
    .clients-note {
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.65;
      color: var(--fg-2);
      max-width: 44ch;
    }
    .clients-list {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
    }
    .client-row {
      display: grid;
      grid-template-columns: 220px 1fr auto;
      gap: 32px;
      align-items: center;
      padding: 28px 4px;
      border-bottom: 1px solid var(--border);
    }
    .client-logo {
      height: 32px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--fg);
    }
    .client-logo-mark {
      flex: 0 0 32px;
      width: 32px; height: 32px;
      border: 1px solid var(--border-2);
      border-radius: var(--radius-2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--fg);
      background: var(--surface);
    }
    .client-logo-mark svg { width: 18px; height: 18px; }
    .client-logo-text {
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.024em;
      color: var(--fg);
      line-height: 1;
    }
    .client-logo-text-suffix {
      color: var(--fg-3);
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .client-name {
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: clamp(22px, 2.4vw, 30px);
      letter-spacing: -0.026em;
      line-height: 1;
      color: var(--fg);
    }
    .client-kind {
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--fg-2);
    }
    .client-meta {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg-3);
      text-align: right;
    }
    @media (max-width: 720px) {
      .clients-wrap { grid-template-columns: 1fr; gap: var(--space-5); }
      .client-row { grid-template-columns: 1fr; gap: 6px; }
      .client-meta { text-align: left; }
    }

    /* ============================================================
       Projects
       ============================================================ */
    .proj-list { display: flex; flex-direction: column; }
    .proj {
      display: grid;
      grid-template-columns: 64px 1fr 1fr;
      gap: 28px 40px;
      padding: 56px 0 64px;
      border-top: 1px solid var(--border);
    }
    .proj-image-wrap {
      grid-column: 2 / -1;
      height: clamp(220px, 28vw, 340px);
      width: 100%;
      max-width: 760px;
      border-radius: var(--radius-3);
      overflow: hidden;
      background: var(--bg-2);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      position: relative;
    }
    .proj-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 600ms var(--ease-out);
    }
    .proj:hover .proj-image { transform: scale(1.015); }
    .proj-image-caption {
      position: absolute;
      bottom: 12px; left: 12px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg);
      background: color-mix(in oklab, var(--bg) 92%, transparent);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 5px 8px;
      border-radius: var(--radius-1);
      border: 1px solid var(--border);
    }
    .proj:last-child { border-bottom: 1px solid var(--border); }
    .proj-head {
      grid-column: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .proj-n {
      font-family: var(--font-mono);
      font-size: 32px;
      font-weight: 400;
      color: var(--fg);
      line-height: 1;
    }
    .proj-kind {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--fg-3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .proj-title {
      grid-column: 2 / -1;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: clamp(26px, 3vw, 38px);
      line-height: 1.1;

      background: #ECE7D9;

      display: inline-flex;

      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;

    .harbor-card-eyebrow {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #847C6E;

      align-items: center;

    .textarea {

      resize: vertical;
      line-height: 1.55;

    .input::placeholder, .textarea::placeholder { color: var(--fg-3); }
    .input:hover, .textarea:hover { border-color: var(--border-2); }

      border-color: var(--accent);

      margin-top: var(--space-2);

      font-size: 10.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg-3);

       Footer
       ============================================================ */
    .footer {

      border-top: 1px solid var(--border);

    .footer-grid {

      grid-template-columns: 1.4fr 1fr 1fr auto;
      gap: var(--space-7);
      align-items: start;

      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--fg-3);

    .footer-col a { color: var(--fg); }
    .footer-col a:hover { color: var(--accent); text-decoration: none; }

    .lang-toggle {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
      gap: 0;
      background: var(--bg);

      font-size: 11px;

      text-transform: uppercase;
      color: var(--fg-3);

      background: var(--bg-2);

      padding-top: var(--space-5);

      align-items: center;

      flex-wrap: wrap;
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--fg-3);
    }

      .footer-grid { grid-template-columns: 1fr 1fr; gap: var(--space-5); }
      .footer-col--toggle { grid-column: 1 / -1; }
    }

    /* ============================================================
       Fade-in
       ============================================================ */
    .fade-in {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity var(--dur-slow) var(--ease-out), transform var(--dur-slow) var(--ease-out);
    }
    .fade-in.is-visible { opacity: 1; transform: none; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      html { scroll-behavior: auto; }
    }

    /* ---------- Hook: theme ---------- */
    function useTheme() {
      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem("alb-theme") || "light"; } catch { return "light"; }
      });
      useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
        try { localStorage.setItem("alb-theme", theme); } catch {}
      }, [theme]);
      return [theme, () => setTheme(t => t === "light" ? "dark" : "light")];
    }

    /* ---------- Hook: lang ---------- */
    function useLang() {
      const [lang, setLang] = useState(() => {
        try { return localStorage.getItem("alb-lang") || "no"; } catch { return "no"; }
      });
      useEffect(() => {
        document.documentElement.setAttribute("lang", COPY[lang].htmlLang);
        try { localStorage.setItem("alb-lang", lang); } catch {}
      }, [lang]);
      return [lang, setLang];
    }

    /* ---------- Hook: scroll fade-in ----------
       Reveal above-fold elements immediately, and use IO for the rest.
       Belt + braces: also force-reveal anything still hidden after 1.2s
       so screenshots/headless contexts that throttle IO still render.
    */
    function revealVisibleAndObserve() {
      const els = document.querySelectorAll(".fade-in:not(.is-visible)");
      if (!els.length) return null;
      const vh = window.innerHeight || 800;
      els.forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.top < vh * 1.05) {
          // Above-fold: reveal instantly (no transition) so screenshots,
          // throttled tabs, and headless contexts always paint.
          el.style.transition = "none";
          el.style.opacity = "1";
          el.style.transform = "none";
          el.classList.add("is-visible");
        }
      });
      const io = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.classList.add("is-visible");
            io.unobserve(e.target);
          }
        });
      }, { rootMargin: "-10% 0px -8% 0px", threshold: 0.01 });
      document.querySelectorAll(".fade-in:not(.is-visible)").forEach(el => io.observe(el));
      // Safety: force-reveal anything still hidden after a beat (with no transition,
      // in case rAF is throttled and the CSS transition would never advance).
      const timer = setTimeout(() => {
        document.querySelectorAll(".fade-in:not(.is-visible)").forEach(el => {
          el.style.transition = "none";
          el.style.opacity = "1";
          el.style.transform = "none";
          el.classList.add("is-visible");
        });
      }, 1500);
      return () => { io.disconnect(); clearTimeout(timer); };
    }
    function useFadeIn() {
      useEffect(() => revealVisibleAndObserve(), []);
    }

    /* ---------- Hook: scrolled nav ---------- */
    function useScrolledNav() {
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 8);
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);
      return scrolled;
    }

    /* ---------- Nav ---------- */
    function Nav({ t, theme, onToggleTheme }) {
      const scrolled = useScrolledNav();
      const scrollTo = (id) => (e) => {
        e.preventDefault();
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      };
      return (
        <nav className={"nav" + (scrolled ? " is-scrolled" : "")} role="navigation">
          <a className="nav-brand" href="#top" onClick={scrollTo("top")}>
            <span>Albretsen</span>

                </h3>
                <p className="proj-body">{p.body}</p>
                <div className="proj-foot">
                  <div className="proj-stack">
                    {p.tags.map(tag => <span key={tag} className="proj-tag">{tag}</span>)}
                  </div>
                  <div className="proj-links">
                    {p.links.map(link => (
                      <a key={link.k} className="proj-link" href={link.href} target={link.href.startsWith("http") ? "_blank" : undefined} rel="noopener noreferrer">
                        <span className="proj-link-k">{link.k}</span>
                        <span>{link.text}</span>
                        <span className="proj-link-arrow">↗</span>
                      </a>
                    ))}
                  </div>
                  <div className="proj-link-k" style={{ color: "var(--fg-3)" }}>{p.role}</div>
                </div>
              </article>
            ))}
          </div>
        </section>
      );
    }

    /* ---------- Contact form ---------- */
    function ContactForm({ t }) {
      const [name, setName] = useState("");
      const [email, setEmail] = useState("");
      const [message, setMessage] = useState("");
      const [status, setStatus] = useState("idle"); // idle | sending | sent

      const onSubmit = (e) => {
        e.preventDefault();
        if (!name || !email || !message) return;
        setStatus("sending");
        setTimeout(() => {
          setStatus("sent");
          setName(""); setEmail(""); setMessage("");
          setTimeout(() => setStatus("idle"), 4000);
        }, 900);
      };

      const f = t.contact.form;
      return (
        <form className="form" onSubmit={onSubmit}>
          <div className="field">
            <label className="field-label" htmlFor="cf-name">{f.name}</label>
            <input id="cf-name" className="input" type="text" value={name} onChange={e => setName(e.target.value)} placeholder={f.namePh} required />
          </div>
          <div className="field">
            <label className="field-label" htmlFor="cf-email">{f.email}</label>
            <input id="cf-email" className="input" type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder={f.emailPh} required />
          </div>
          <div className="field">
            <label className="field-label" htmlFor="cf-msg">{f.message}</label>
            <textarea id="cf-msg" className="textarea" value={message} onChange={e => setMessage(e.target.value)} placeholder={f.messagePh} required />
          </div>
          <div className="form-actions">
            <span className={"form-note" + (status === "sent" ? " is-sent" : "")}>
              {status === "sent" ? f.sent : f.note}
            </span>
            <button className="btn" type="submit" disabled={status === "sending"}>
              {status === "sending" ? f.sending : f.send}<span className="btn-arrow">→</span>
            </button>
          </div>
        </form>
      );
    }

    /* ---------- Contact ---------- */
    function Contact({ t }) {
      const [copied, setCopied] = useState(false);
      const mail = "asgeir@albretsen.no";
      const copy = (e) => {
        e.preventDefault();
        navigator.clipboard?.writeText(mail).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 1800);
        });
      };
      return (
        <section className="section" id="contact">
          <SectionHead n={t.contact.n} label={t.contact.label} title={t.contact.title} tag={t.contact.tag} />
          <div className="contact-wrap">
            <div className="fade-in">
              <div className="contact-id">
                <img className="contact-id-avatar" src="assets/profile.jpg" alt={t.contact.profileName} />
                <div className="contact-id-meta">
                  <span className="contact-id-name">{t.contact.profileName}</span>
                  <span className="contact-id-role">{t.contact.profileRole}</span>
                </div>
              </div>
              <p className="contact-lead">{t.contact.lead}</p>

              <a className="contact-mail" href={"mailto:" + mail} onClick={copy}>
                <span className="contact-mail-state">{copied ? t.contact.mailCopied : t.contact.mailState}</span>
                <span className="contact-mail-text">{mail}</span>
              </a>

              <ul className="contact-channels">
                {t.contact.channels.map(c => (
                  <li key={c.k}>
                    <span className="contact-channel-k">{c.k}</span>
                    {c.href ? (
                      <a className="contact-channel-v" href={c.href} target="_blank" rel="noopener noreferrer">{c.v}</a>
                    ) : (
                      <span className="contact-channel-v">{c.v}</span>
                    )}
                  </li>
                ))}
              </ul>
            </div>

            <div className="fade-in">
              <ContactForm t={t} />
            </div>
          </div>
        </section>
      );
    }

    /* ---------- Footer ---------- */
    function Footer({ t, lang, setLang }) {
      return (
        <footer className="footer">
          <div className="footer-grid">
            <div>
              <div className="footer-mark">
                {t.footer.mark} <span className="footer-mark-suffix">{t.footer.markSuffix}</span>
              </div>
              <div className="footer-meta" style={{ marginTop: 8, maxWidth: "36ch" }}>
                {t.footer.tagline}
              </div>
            </div>
            <div className="footer-col">
              <div className="footer-k">{t.footer.colA.k}</div>
              {t.footer.colA.lines.map((line, i) => <span key={i}>{line}</span>)}
            </div>
            <div className="footer-col">
              <div className="footer-k">{t.footer.colB.k}</div>
              {t.footer.colB.lines.map((line, i) => (
                line.kind === "mail" ? (
                  <a key={i} href={"mailto:" + line.text}>{line.text}</a>
                ) : (
                  <a key={i} href={line.href} target="_blank" rel="noopener noreferrer">{line.text}</a>
                )
              ))}
            </div>
            <div className="footer-col footer-col--toggle">
              <div className="footer-k">{t.footer.colC.k}</div>
              <div className="lang-toggle" role="group" aria-label="Language">
                <button
                  className={"lang-btn" + (lang === "no" ? " is-active" : "")}
                  onClick={() => setLang("no")}
                  aria-pressed={lang === "no"}
                >NO</button>
                <button
                  className={"lang-btn" + (lang === "en" ? " is-active" : "")}
                  onClick={() => setLang("en")}
                  aria-pressed={lang === "en"}
                >EN</button>
              </div>
            </div>
          </div>
          <div className="footer-fine">
            <span>{t.footer.fineLeft}</span>
            <span>{t.footer.fineRight}</span>
          </div>
        </footer>
      );
    }

    /* ---------- App ---------- */
    function App() {
      const [theme, toggleTheme] = useTheme();
      const [lang, setLang] = useLang();
      const t = COPY[lang];
      useFadeIn();

      // Re-run fade-in observer when lang changes (new DOM nodes for some fragments)
      useEffect(() => {
        return revealVisibleAndObserve();
      }, [lang]);

      return (
        <React.Fragment>
          <Nav t={t} theme={theme} onToggleTheme={toggleTheme} />
          <main>
            <Hero t={t} />
            <Services t={t} />
            <Clients t={t} />
            <Projects t={t} />
            <Contact t={t} />
            <Footer t={t} lang={lang} setLang={setLang} />
          </main>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("app")).render(<App />);
  </script>
</body>
</html>
