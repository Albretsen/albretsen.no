<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Deck render rig</title>
<!-- Bake rig: renders stills and the hero image sequence from 3d/deck-scene.js in headless Chrome.
     ?shot=hero&p=0.9&mood=dusk      -> full-window still (screenshot it)
     ?shot=card&i=0                  -> one product card close-up
     ?frames=60                      -> renders every frame, writes webp data URLs into #out (use --dump-dom) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Martian+Mono:wght@500;600&display=block" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#10081d}canvas{display:block;width:100vw;height:100vh}#out{display:none}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head><body>
<canvas id="c"></canvas><textarea id="out"></textarea>
<script type="module">
import { createDeck, CARDS, MOODS } from '../3d/deck-scene.js';
const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const W = innerWidth, H = innerHeight;
const shot = q.get('shot');
let opts = { preserve: true, pixelRatio: 1, mood: q.get('mood') || 'dusk', tall: innerWidth < innerHeight, transparent: shot === 'orb' };

if (shot === 'card') {
  const i = +q.get('i');
  const card = { ...CARDS[i], n: i }; const rr = (q.get('rot') || '-0.12,-0.34,0.07').split(',').map(Number);
  opts = { ...opts, cards: [card], mood: q.get('mood') || 'candy', fov: 26,
    echoPos: [-1.3, 1.25, -2.6], echoScale: 0.95,
    layout: () => ({ pos: new (await_three()).Vector3(0.18, 0.42, 0), rot: new (await_three()).Euler(...rr) }),
    camera: () => ({ pos: [0.2, 0.62, 3.0], look: [0.12, 0.5, 0] }) };
}
if (q.get('cam')) { const v = q.get('cam').split(',').map(Number); opts.camera = () => ({ pos: v.slice(0, 3), look: v.slice(3, 6) }); }
if (q.get('fov')) opts.fov = +q.get('fov');
let THREEref;
function await_three(){ return THREEref; }
const mod = await import('three'); THREEref = mod;

const deck = await createDeck(canvas, opts);
deck.resize(W, H);
if (shot === 'card') { deck.candies.forEach((m,i)=>{ m.position.x *= 0.55; m.position.z = -2 - i*0.4; m.userData.base = [m.position.x, m.position.y*0.8, m.position.z]; }); }

if (shot === 'orb' || shot === 'cardobj') {
  // transparent object stills: the chrome Echo orb, or a single floating card
  deck.sky.visible = deck.floor.visible = deck.pad.visible = false;
  deck.scene.fog = null;
  deck.candies.forEach((m) => (m.visible = false));
  deck.cards.forEach((c) => { c.visible = shot === 'cardobj'; c.userData.shadow.visible = false; });
  if (shot === 'orb') { deck.echo.position.set(0, 0, 0); deck.rings.position.set(0, 0, 0); deck.echo.scale.setScalar(1.6); deck.rings.scale.setScalar(1); }
  else { deck.echo.visible = deck.rings.visible = false; }
  const cam = shot === 'orb' ? { pos: [0, 0.6, 7.4], look: [0, 0, 0] } : { pos: [0.2, 0.62, 3.0], look: [0.18, 0.42, 0] };
  deck.setProgress(1, 0.5);
  deck.camera.position.set(...cam.pos); deck.camera.lookAt(...cam.look);
  deck.renderer.setClearColor(0x000000, 0);
  deck.render();
  document.getElementById('out').textContent = JSON.stringify([canvas.toDataURL('image/png')]);
  document.title = 'done';
} else if (q.get('frames')) {
  const n = +q.get('frames');
  const out = [];
  for (let f = 0; f < n; f++) {
    const p = f / (n - 1);
    deck.setProgress(p, p * 3);
    deck.render();
    out.push(canvas.toDataURL('image/webp', +(q.get('qual') || 0.8)));
  }
  document.getElementById('out').textContent = JSON.stringify(out);
  document.title = 'done';
} else {
  const p = +(q.get('p') ?? 1);
  deck.setProgress(p, +(q.get('t') ?? 0));
  deck.render();
  document.title = 'done';
}
</script>
</body></html>
