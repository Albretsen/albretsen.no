<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uranographia chart demo</title>
<link rel="icon" href="identity/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="motion.css">
<style>
  html, body { margin: 0; background: var(--u-night); color: var(--u-vellum); font-family: var(--u-sans); }
  .stage { position: relative; min-height: 100vh; overflow: hidden; display: grid; place-items: center; }
  .stage picture, .stage picture img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 50%; }
  .stage::after { content: ''; position: absolute; inset: 0; background: radial-gradient(80% 70% at 55% 50%, transparent 20%, var(--u-night) 95%); pointer-events: none; }
  #sky { position: relative; z-index: 1; width: min(1200px, 100vw); padding: 0 16px; box-sizing: border-box; }
  .bar { position: absolute; z-index: 2; left: 16px; right: 16px; bottom: 24px; display: flex; justify-content: center; gap: 10px; }
  .still .bar { display: none; }
</style>
</head>
<body>
<main class="stage">
  <picture>
    <source type="image/avif" srcset="hero/orion-wide-1200.avif 1200w, hero/orion-wide-2400.avif 2400w">
    <img src="hero/orion-wide-2400.webp" srcset="hero/orion-wide-1200.webp 1200w, hero/orion-wide-2400.webp 2400w" sizes="100vw" alt="" style="opacity:.55">
  </picture>
  <div id="sky"></div>
  <div class="bar">
    <div class="u-reading" role="group" aria-label="Reading">
      <button aria-pressed="true" data-r="sky">Sky</button><button aria-pressed="false" data-r="ledger">Ledger</button>
    </div>
  </div>
</main>
<script type="module">
  import { mountChart } from './js/uranographia.js';
  const still = new URLSearchParams(location.search).has('still');
  if (still) document.body.classList.add('still');
  await document.fonts.ready;
  const chart = mountChart(document.getElementById('sky'));
  const buttons = document.querySelectorAll('.u-reading button');
  buttons.forEach((b) => b.addEventListener('click', () => {
    chart.setReading(b.dataset.r);
    buttons.forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  }));
  const r = new URLSearchParams(location.search).get('reading');
  if (r) chart.setReading(r);
</script>
</body>
</html>
