<!doctype html><meta charset="utf-8">
<body style="margin:0;background:#222;display:flex;gap:20px;padding:20px">
<script>
const q = new URLSearchParams(location.search);
const src = q.get('src') || '../assets/preview.html?still';
const ys = (q.get('y') || '0').split(',');
for (const y of ys) {
  const f = document.createElement('iframe');
  f.src = src; f.style.cssText = `width:${q.get('w') || 390}px;height:${q.get('h') || 844}px;border:0;background:#000;flex:none`;
  f.onload = () => setTimeout(() => f.contentWindow.scrollTo(0, +y), 2500);
  document.body.append(f);
}
</script>
