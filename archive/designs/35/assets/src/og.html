<!doctype html>
<html><head><meta charset="utf-8"><title>og</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }

  .copy { position: absolute; left: 64px; top: 64px; bottom: 56px; display: flex; flex-direction: column; justify-content: space-between; }

  h1 { font-weight: 400; font-size: 76px; line-height: .92; margin: 0; letter-spacing: -0.01em; }

  .meta { font: 500 14px/1.6 "Geist Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: #614735; display: flex; gap: 10px; align-items: center; }
  .meta i { width: 8px; height: 8px; border-radius: 50%; background: #357e9c; display: inline-block; }

<body>
  <div class="room"></div>
  <div class="copy">
    <img src="../identity/wordmark.svg" alt="">
