<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>OG bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=block" rel="stylesheet">
<style>
  html,body{margin:0}
  .og{width:1200px;height:630px;position:relative;overflow:hidden;background:#0e0409 url(../hero/hero-fracture-1440.webp) 62% 40%/1500px auto no-repeat;font-family:Geist,sans-serif;color:#fceaf3}
  .og::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,4,9,.92) 0%,rgba(14,4,9,.55) 42%,rgba(14,4,9,0) 70%)}
  .tracks{position:absolute;inset:0;background:url(../extras/tracks-dark-1200.webp) center/cover;mix-blend-mode:screen;opacity:.35}
  .in{position:absolute;left:72px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:28px;width:620px}
  .wm{width:520px}
  p{margin:0;font-size:34px;line-height:1.2;letter-spacing:-.01em;font-weight:500;color:#fff8fb}
  .meta{font-family:"Geist Mono",monospace;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:#e781b7;display:flex;gap:28px}
  .rule{position:absolute;left:72px;right:72px;bottom:46px;height:1px;background:linear-gradient(90deg,#892361,transparent)}
</style></head>
<body><div class="og"><div class="tracks"></div>
  <div class="in"><img class="wm" src="../identity/wordmark-chrome.svg" alt="Albretsen">
    <p>I build software that pays for itself.</p>
    <div class="meta"><span>Albretsen AS</span><span>Norway</span><span>albretsen.no</span></div></div>
  <div class="rule"></div></div></body></html>
