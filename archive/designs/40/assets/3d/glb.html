<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Specimen GLB</title>
<style>html,body{margin:0;height:100%;background:#f6f0e0}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// Loads specimen.glb with the stock GLTFLoader, proving the export is standard glTF 2.0.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.toneMapping = THREE.NeutralToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf6f0e0);
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.DirectionalLight(0xffffff, 2).translateX(-3).translateY(5).translateZ(4));
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100); cam.position.set(0, 1, 9); cam.lookAt(0, 0, 0);
const gltf = await new GLTFLoader().loadAsync('./specimen.glb');
scene.add(gltf.scene); gltf.scene.rotation.set(0.4, 0.6, 0.18);
const size = () => { r.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); };
addEventListener('resize', size); size();
r.setAnimationLoop(t => { gltf.scene.rotation.y = 0.6 + t / 4000; r.render(scene, cam); });
</script>
</body>
</html>
