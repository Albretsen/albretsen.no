<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG source</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Geist+Mono:wght@500&display=block" rel="stylesheet">
<style>
  /* Source for og-image.png. Screenshot at 1200x630. */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f3ead6; }
  .bg { position: absolute; inset: 0; background: url(../hero/specimen-day.webp) 96% 52% / 1180px auto no-repeat; }
  .bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, #f3ead6 0%, #f3eadbe0 34%, #f3ead600 58%); }
  .copy { position: absolute; left: 64px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; padding: 58px 0 52px; }
  img.wm { height: 58px; }
  h1 { font: 600 66px/1.0 Fraunces, serif; letter-spacing: -0.025em; color: #082014; margin: 0 0 20px; width: 560px; }
  h1 em { font-style: italic; font-weight: 400; color: #17482f; }
  .meta { font: 500 15px 'Geist Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: #17482f; display: flex; gap: 28px; }
  .meta b { color: #c444ac; font-weight: 500; }
  .label { position: absolute; right: 52px; bottom: 46px; font: 500 13px 'Geist Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: #17482f; text-align: right; line-height: 1.7; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="copy">
  <img class="wm" src="logo-wordmark.svg" alt="Albretsen AS">
  <div>
    <h1>Software that <em>pays for itself.</em></h1>
    <div class="meta"><span><b>●</b> albretsen.no</span><span>Norway</span><span>Since 2016</span></div>
  </div>
</div>
<div class="label">Specimen No. 1<br>Brass lattice, glass core</div>
</body>
</html>
