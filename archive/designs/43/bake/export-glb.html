<!doctype html>
<meta charset="utf-8">
<title>glb export</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<pre id="out"></pre>
<script type="module">
// Builds a low-poly object with lowpoly-kit and prints it as base64 GLB into #out.
// Bake with: chrome --headless --dump-dom "<this page>?o=crystal"  then base64-decode the <pre>.
import * as K from '../assets/interactive/lowpoly-kit.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
const { THREE } = K;
const o = new URLSearchParams(location.search).get('o') || 'crystal';
const scene = new THREE.Scene();
let obj;
if (o === 'crystal') { obj = K.crystalA({ depth: 0.55, scale: 0.065 }); obj.name = 'AlbretsenFacetA'; }
else { obj = K.planet({ radius: 1.55, detail: 3, seed: 5, rough: 0.08 }); obj.name = 'DawnPlanet'; }
// GLTF stores vertex colours linear; MeshStandardMaterial with vertexColors exports as COLOR_0
scene.add(obj);
const buf = await new GLTFExporter().parseAsync(scene, { binary: true });
const bytes = new Uint8Array(buf); let s = '';
for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
document.getElementById('out').textContent = 'GLB:' + btoa(s) + ':END';
</script>
