<!doctype html>
<meta charset="utf-8">
<title>scene bake</title>
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=block" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as K from '../assets/interactive/lowpoly-kit.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
const { THREE, C } = K;
const q = new URLSearchParams(location.search);
const which = q.get('s') || 'hero-a';
const transparent = q.get('alpha') === '1';
await document.fonts.load('170px "Instrument Serif"').catch(() => {});

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: transparent, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(+(q.get('fov') || 28), innerWidth / innerHeight, 0.1, 200);
if (!transparent) {
  scene.background = K.skyTexture(['#f6fbfc', '#e7f3f7', '#dcd8f1', '#f4d3dc', '#fbd6bf']);
  scene.fog = new THREE.Fog(0xf3e4ea, 16, 42);
}
// Poly Haven "Bell Park Dawn" (CC0) as a soft image-based fill
try {
  const hdr = await new RGBELoader().loadAsync('src/polyhaven-bell_park_dawn_1k.hdr');
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromEquirectangular(hdr).texture;
  scene.environmentIntensity = 0.35;
} catch (e) {}
const L = K.dawnLights(scene, { key: 2.4, dir: [7, 6, 5] });

const img = src => K.loadImage(src);
const P = '../../_shared/products/';
function ground(opts) { const t = K.terrain(opts); scene.add(t); return t; }
function contactShadow(size = 6, y = 0, opacity = 0.16) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.ShadowMaterial({ opacity, color: 0x32728a }));
  m.rotation.x = -Math.PI / 2; m.position.y = y; m.receiveShadow = true; scene.add(m); return m;
}
function clouds(list) { list.forEach(([x, y, z, s, seed]) => { const c = K.cloud({ seed, scale: s }); c.position.set(x, y, z); scene.add(c); }); }
function sparks(list) { list.forEach(([x, y, z, s]) => { const m = K.spark(s); m.position.set(x, y, z); m.rotation.y = 0.6; scene.add(m); }); }
function orbitRing(radius, tilt, color = 0x32728a, opacity = 0.35, dashed = false, y = 0) {
  const pts = []; for (let i = 0; i <= 128; i++) { const a = i / 128 * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius)); }
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const m = dashed ? new THREE.LineDashedMaterial({ color, transparent: true, opacity, dashSize: 0.12, gapSize: 0.12 }) : new THREE.LineBasicMaterial({ color, transparent: true, opacity });
  const line = new THREE.Line(g, m); if (dashed) line.computeLineDistances();
  line.rotation.set(tilt[0], tilt[1], tilt[2]); line.position.y = y; scene.add(line); return line;
}

const scenes = {
  async 'hero-a'() {
    ground({ seed: 4, amp: 1.0 });
    const A = K.crystalA({ depth: 0.55, scale: 0.06 });
    A.position.set(0, 2.25, 0); A.rotation.set(0.05, -0.42, 0.02); scene.add(A);
    orbitRing(2.7, [0.26, 0, 0.16], 0x32728a, 0.45, false, 2.1);
    orbitRing(3.4, [0.3, 0, -0.08], 0x6ab9c7, 0.55, true, 2.1);
    const moon = K.gem('ico', 0.32, C.lilac, 3); moon.position.set(-2.7, 2.1, 1.0); scene.add(moon);
    const moon2 = K.gem('oct', 0.2, C.dawn, 5); moon2.position.set(2.75, 3.25, -0.6); scene.add(moon2);
    sparks([[1.7, 4.4, 0.6, 0.13], [-1.9, 4.1, -0.5, 0.09], [3.4, 2.0, 1.2, 0.08]]);
    clouds([[-5.5, 3.6, -6, 1.2, 2], [6, 4.4, -8, 1.5, 7], [4.2, 1.3, 2.5, 0.6, 9]]);
    contactShadow(10, 0.02, 0.12);
    camera.position.set(0, 3.6, 13.5); camera.lookAt(0, 2.1, 0);
    L.sun.target.position.set(0, 1.5, 0); scene.add(L.sun.target);
  },
  async mcp() {
    ground({ seed: 11, amp: 0.8 });
    const slab = K.logoSlab(await img(P + 'mcp-emails/icon.png'), { side: '#2547E5', radius: 0.44 });
    slab.position.set(0, 2.1, 0); slab.rotation.set(-0.08, -0.5, 0.06); scene.add(slab);
    // planes on an arc, an inbox at dawn
    const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(-4.2, 0.9, 1.8), new THREE.Vector3(-2.4, 3.2, 1.6), new THREE.Vector3(0.4, 3.7, 1.4), new THREE.Vector3(2.8, 3.0, 1.2), new THREE.Vector3(4.2, 1.2, 0.2)]);
    const trail = new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(120)), new THREE.LineDashedMaterial({ color: 0x32728a, dashSize: 0.1, gapSize: 0.12, transparent: true, opacity: 0.45 }));
    trail.computeLineDistances(); scene.add(trail);
    [0.16, 0.5, 0.86].forEach((t, i) => {
      const p = K.paperPlane(0.62 - i * 0.06, [0xffffff, 0xf6fbfc, 0xfdf3ea][i]);
      const at = curve.getPointAt(t), ahead = curve.getPointAt(Math.min(1, t + 0.01));
      p.position.copy(at); p.lookAt(ahead); p.rotateZ(i % 2 ? 0.7 : -0.6); p.rotateX(-0.25); scene.add(p);
    });
    sparks([[1.5, 3.5, 0.6, 0.1], [-1.6, 0.9, 1.6, 0.08]]);
    clouds([[-5, 3.8, -6, 1.3, 3], [5.5, 4.2, -7, 1.1, 12]]);
    contactShadow(8, 0.02, 0.14);
    camera.position.set(0.3, 3.0, 11); camera.lookAt(0, 2.1, 0);
  },
  async funlibs() {
    ground({ seed: 21, amp: 0.7 });
    const slab = K.logoSlab(await img(P + 'fun-libs/icon.png'), { side: '#FFE066', radius: 0.44 });
    slab.position.set(-0.35, 1.58, 0); slab.rotation.set(-0.12, 0.38, 0.0); scene.add(slab);
    const tiles = [['F', -2.2, 0.36, 1.4, 0.3, '#fbd1b6'], ['U', -1.45, 0.36, 1.85, -0.12, '#d0cded'], ['N', -0.6, 0.36, 2.05, 0.18, '#b5e5ea'],
      ['_', 1.65, 0.36, 1.5, -0.4, '#f6cbd0'], ['?', 2.35, 0.36, 0.55, 0.5, '#f8e18a'], ['a', 2.0, 1.1, 0.75, 0.2, '#e2f4f6']];
    tiles.forEach(([ch, x, y, z, ry, bg]) => { const t = K.letterTile(ch, { bg }); t.position.set(x, y, z); t.rotation.set(-Math.PI / 2 + 0.0001, 0, ry); if (ch === 'a') t.rotation.set(-0.3, 0.6, 0.1); scene.add(t); });
    // tiles lie flat (face up), except one that tumbles in mid-air
    sparks([[1.2, 3.4, 0.4, 0.12], [-2.4, 2.6, -0.5, 0.08], [2.8, 2.1, 0.9, 0.07]]);
    clouds([[-6, 4, -7, 1.4, 4], [5, 3.6, -6, 1.0, 14]]);
    contactShadow(9, 0.02, 0.14);
    camera.position.set(0, 4.6, 10.5); camera.lookAt(0, 1.4, 0.4);
  },
  async toolrails() {
    ground({ seed: 31, amp: 0.85 });
    const slab = K.logoSlab(await img('src/toolrails-icon.png'), { side: '#141413', radius: 0.38 });
    slab.position.set(0, 2.2, 0); slab.rotation.set(-0.05, -0.32, 0.0); scene.add(slab);
    const R = 2.75, tilt = new THREE.Euler(1.22, 0, -0.16);
    orbitRing(R, [tilt.x, tilt.y, tilt.z], 0x32728a, 0.35, false, 2.2);
    const kinds = ['ico', 'oct', 'dod', 'tet', 'box'], cols = [C.lilac, C.dawn, C.sky, C.blush, C.spark, C.mist, C.lagoon];
    for (let i = 0; i < 11; i++) {
      const a = i / 11 * Math.PI * 2 + 0.3;
      const v = new THREE.Vector3(Math.cos(a) * R, 0, Math.sin(a) * R).applyEuler(tilt);
      const g = K.gem(kinds[i % 5], 0.17 + (i % 3) * 0.05, cols[i % 7], i + 2);
      g.position.set(v.x, v.y + 2.2, v.z); g.rotation.set(i, i * 2, 0); scene.add(g);
    }
    sparks([[-2.6, 4.2, 0.2, 0.09]]);
    clouds([[-5.8, 3.4, -7, 1.2, 5], [6, 4.6, -8, 1.4, 15]]);
    contactShadow(8, 0.02, 0.14);
    camera.position.set(0, 3.2, 11); camera.lookAt(0, 2.15, 0);
  },
  async harbor() {
    ground({ seed: 41, amp: 0.75 });
    const slab = K.logoSlab(await img('src/harbor-tile.png'), { side: '#1A1A1A', radius: 0.4 });
    slab.position.set(0.1, 1.48, 0.4); slab.rotation.set(-0.06, -0.22, 0); scene.add(slab);
    // two sheltering hills of crystal and a pale cove of light between them
    const hillL = K.gem('dod', 1.9, 0xc9e7ec, 3); hillL.scale.set(1.0, 0.7, 0.8); hillL.position.set(-4.4, 0.35, -3.2); scene.add(hillL);
    const hillR = K.gem('ico', 2.2, 0xd0cded, 8); hillR.scale.set(0.95, 0.65, 0.9); hillR.position.set(4.8, 0.3, -3.8); scene.add(hillR);
    const small = K.gem('oct', 0.5, C.blush, 6); small.position.set(-1.7, 0.4, 1.6); scene.add(small);
    const s2 = K.gem('tet', 0.38, C.dawn, 4); s2.position.set(1.9, 0.3, 1.8); s2.rotation.set(0.4, 0.3, 0); scene.add(s2);
    sparks([[0.9, 3.3, 0.4, 0.1]]);
    clouds([[-2.0, 4.2, -5, 1.2, 6], [4.6, 3.8, -6, 0.9, 16]]);
    contactShadow(8, 0.02, 0.14);
    camera.position.set(0, 2.7, 10.5); camera.lookAt(0, 1.55, 0);
  },
  // ---- retired products: small specimens on transparent ground ----
  async luma() {
    const slab = K.logoSlab(await img(P + 'luma/logo.png'), { w: 3.0, h: 1.3, side: '#F4EFE6', radius: 0.3, depth: 0.22, pad: 0.16 });
    slab.position.set(0, 0.9, 0); slab.rotation.set(-0.2, -0.38, 0); scene.add(slab);
    contactShadow(7, 0, 0.16); camera.position.set(0.6, 2.6, 9.5); camera.lookAt(-0.35, 0.75, 0);
  },
  async polyglot() {
    [['ico', 0.55, C.lilac, -0.45, 0.6, 0], ['oct', 0.42, C.sky, 0.55, 0.45, 0.4], ['dod', 0.36, C.dawn, 0.1, 1.25, -0.3], ['tet', 0.28, C.blush, -0.9, 1.35, 0.3]]
      .forEach(([k, s, c, x, y, z], i) => { const g = K.gem(k, s, c, i + 1); g.position.set(x, y, z); g.rotation.set(i, i * 1.3, 0); scene.add(g); });
    contactShadow(7, 0, 0.16); camera.position.set(0.6, 2.4, 9.5); camera.lookAt(-0.35, 0.80, 0);
  },
  async pinpoint() {
    const g = new THREE.Group();
    const cone = K.gem('oct', 0.5, C.blush, 2); cone.scale.set(0.8, 1.6, 0.8); cone.position.y = 0.8; g.add(cone);
    const head = K.gem('ico', 0.55, 0xf4b8c2, 4); head.position.y = 1.65; g.add(head);
    const dot = K.gem('ico', 0.2, 0xffffff, 6); dot.position.set(0, 1.72, 0.45); g.add(dot);
    g.rotation.z = 0.12; scene.add(g);
    contactShadow(7, 0, 0.16); camera.position.set(0.6, 2.6, 9.5); camera.lookAt(-0.35, 1.05, 0);
  },
  async webvakt() {
    const lens = K.gem('oct', 1.0, C.sky, 3); lens.scale.set(1.25, 0.6, 0.45); lens.position.y = 1.0; scene.add(lens);
    const pupil = K.gem('ico', 0.32, C.deep, 7); pupil.position.set(0, 1.0, 0.36); scene.add(pupil);
    const glint = K.spark(0.08, 0xffffff); glint.position.set(0.14, 1.14, 0.62); scene.add(glint);
    contactShadow(7, 0, 0.16); camera.position.set(0.6, 2.0, 9.5); camera.lookAt(-0.35, 1.00, 0);
  },
  async jokes() {
    const d = K.gem('dod', 0.75, C.spark, 3); d.position.y = 0.9; d.rotation.set(0.3, 0.5, 0); scene.add(d);
    [[-1.0, 1.7, 0.2, C.blush], [0.95, 1.9, -0.2, C.lilac], [1.05, 0.5, 0.6, C.sky]].forEach(([x, y, z, c], i) => { const t = K.gem('tet', 0.17, c, i + 9); t.position.set(x, y, z); t.rotation.set(i, i * 2, 1); scene.add(t); });
    contactShadow(7, 0, 0.16); camera.position.set(0.6, 2.4, 9.5); camera.lookAt(-0.35, 0.95, 0);
  },
  async tryggere() {
    const s = new THREE.Shape(); s.moveTo(0, 1.2); s.lineTo(0.95, 0.85); s.lineTo(0.85, -0.1); s.lineTo(0, -1.05); s.lineTo(-0.85, -0.1); s.lineTo(-0.95, 0.85); s.closePath();
    const geo = new THREE.ExtrudeGeometry(s, { depth: 0.28, bevelEnabled: true, bevelThickness: 0.16, bevelSize: 0.14, bevelSegments: 2 });
    const rr = K.rng(4); const pg = K.paintFaces(geo, () => new THREE.Color(0xa9dde5).offsetHSL(0, 0, (rr() - 0.5) * 0.08));
    const m = new THREE.Mesh(pg, K.flatMat({ roughness: 0.55 }));
    m.castShadow = true; m.position.set(0, 1.15, 0); m.rotation.set(-0.1, -0.4, 0); scene.add(m);
    const tick = K.gem('oct', 0.22, 0xffffff, 3); tick.position.set(0.12, 1.25, 0.45); scene.add(tick);
    contactShadow(7, 0, 0.16); camera.position.set(0.6, 2.2, 9.5); camera.lookAt(-0.35, 1.05, 0);
  },
  async early() {
    const a = K.letterTile('%', { size: 1.0, bg: '#e2f4f6' }); a.position.set(-0.55, 0.62, 0); a.rotation.set(-0.1, 0.35, 0); scene.add(a);
    const b = K.letterTile('=', { size: 0.7, bg: '#fbd1b6' }); b.position.set(0.75, 0.42, 0.5); b.rotation.set(-0.1, -0.4, 0); scene.add(b);
    const c = K.letterTile('+', { size: 0.6, bg: '#d0cded' }); c.position.set(0.55, 1.22, -0.3); c.rotation.set(0.3, -0.2, 0.2); scene.add(c);
    contactShadow(7, 0, 0.16); camera.position.set(0.6, 2.3, 9.5); camera.lookAt(-0.35, 0.75, 0);
  },
  // ---- extras: free-floating stickers ----
  async cloud() { const c = K.cloud({ seed: 12, puffs: 6, scale: 1.1 }); scene.add(c); camera.position.set(0, 0.6, 7); camera.lookAt(0, 0, 0); },
  async planet() {
    const p = K.planet({ radius: 1.6, detail: 3, seed: 5, rough: 0.08 }); p.rotation.set(0.3, 0.8, 0.1); scene.add(p);
    orbitRing(2.35, [1.3, 0, 0.25], 0x32728a, 0.45);
    const m = K.gem('ico', 0.18, C.lilac, 2); m.position.set(2.1, 0.55, 0.6); scene.add(m);
    camera.position.set(0, 0.4, 8.4); camera.lookAt(0, 0, 0);
  },
  async crystal() {
    const A = K.crystalA({ depth: 0.55, scale: 0.075 }); A.rotation.set(0.05, -0.5, 0.02); scene.add(A);
    camera.position.set(0, 0.3, 11); camera.lookAt(0, 0, 0);
  },
};

await scenes[which]();
function draw() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.render(scene, camera); }
draw(); addEventListener('resize', draw); setTimeout(draw, 300);
document.title = 'ready';
</script>
