<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon rock specimen</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
  html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 40%,#211a12,#14100a 55%,#0b0805);overflow:hidden}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas:active{cursor:grabbing}
  p{position:fixed;left:16px;bottom:12px;margin:0;font:11px/1.4 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:#735836}
</style>
</head>
<body>
<canvas id="c" aria-label="Moon rock 03, drag to turn"></canvas>
<p>moon_rock_03 · Poly Haven · CC0 · drag to turn</p>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50); camera.position.set(0, 0.9, 4.6);
  // darkfield lighting: no front light, two raking rims in the brand's ochre and light
  scene.add(new THREE.HemisphereLight(0x3b3124, 0x0b0805, 0.6));
  const rimA = new THREE.DirectionalLight(0xf0b871, 2.6); rimA.position.set(-3, 2, -2); scene.add(rimA);
  const rimB = new THREE.DirectionalLight(0xfae0c1, 1.6); rimB.position.set(3, 1.5, -1.5); scene.add(rimB);
  const key = new THREE.DirectionalLight(0xfae0c1, 0.45); key.position.set(0.5, 3, 2); scene.add(key);
  const controls = new OrbitControls(camera, canvas); controls.enableDamping = true; controls.enablePan = false; controls.minDistance = 2.6; controls.maxDistance = 7; controls.autoRotate = true; controls.autoRotateSpeed = 0.6;
  new GLTFLoader().load('./moon-rock.glb', (g) => {
    g.scene.traverse((o) => { if (o.isMesh) o.material = new THREE.MeshStandardMaterial({ color: 0x6e6152, roughness: 0.95, metalness: 0, flatShading: false }); });
    g.scene.rotation.x = -0.4;
    scene.add(g.scene);
  });
  function resize() { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  new ResizeObserver(resize).observe(canvas);
  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
