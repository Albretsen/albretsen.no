<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Albretsen AS mark: Blink, a clay camera whose aperture forms an A">
  <defs>
    <radialGradient id="mBody" cx="0.32" cy="0.26" r="0.9">
      <stop offset="0" stop-color="#FFF8C8"/><stop offset="0.45" stop-color="#FFE97E"/><stop offset="1" stop-color="#F7C455"/>
    </radialGradient>
    <radialGradient id="mHump" cx="0.3" cy="0.2" r="1"><stop offset="0" stop-color="#C9FBE4"/><stop offset="1" stop-color="#5FD8A6"/></radialGradient>
    <radialGradient id="mRing" cx="0.35" cy="0.25" r="0.85"><stop offset="0" stop-color="#FFD3E5"/><stop offset="0.6" stop-color="#FF99C2"/><stop offset="1" stop-color="#F27AAB"/></radialGradient>
    <radialGradient id="mGlass" cx="0.38" cy="0.3" r="0.8"><stop offset="0" stop-color="#5A3A66"/><stop offset="0.55" stop-color="#2A1530"/><stop offset="1" stop-color="#140910"/></radialGradient>
    <linearGradient id="mA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4B8"/><stop offset="1" stop-color="#FC9E47"/></linearGradient>
