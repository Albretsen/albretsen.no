<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit crystal</title>
<link rel="icon" href="../identity/favicon.svg">
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script>
<style>
  :root { --paper: #f2f5f6; --ink: #1c2427; --graphite: #646e70; }
  :root[data-theme="dark"] { --paper: #131819; --ink: #e6eaec; --graphite: #9fa6a8; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 14px/1.4 ui-monospace, "Geist Mono", monospace; }
  #stage { position: absolute; inset: 0; }
  .meta { position: absolute; left: 16px; bottom: 16px; color: var(--graphite); }
  .meta b { color: var(--ink); font-weight: 500; }
  button { position: absolute; right: 16px; top: 16px; font: inherit; color: var(--ink); background: none; border: 1px solid currentColor; border-radius: 99px; padding: 6px 12px; cursor: pointer; }
</style>
<div id="stage"></div>
<p class="meta"><b id="name">—</b> · <span id="facts"></span> · drag to turn, tap to redraw</p>
<button id="t">Lights</button>
<script type="module">
  import { mountCrystal } from './crystal.js';
  const $ = id => document.getElementById(id);
  const c = await mountCrystal($('stage'), {
    theme: 'light',
    onHabit: h => { $('name').textContent = h.label; $('facts').textContent = `${h.faces} faces, ${h.edges} edges`; },
  });
  $('t').onclick = () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next; c.setTheme(next);
  };
</script>
</html>
