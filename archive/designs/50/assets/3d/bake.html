<!doctype html>
<html><head><meta charset="utf-8"><title>bake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#0d031e;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
import { build } from './sticker-scene.js';
const q = new URLSearchParams(location.search);
const s = await build({ canvas: document.getElementById('c'), width: innerWidth, height: innerHeight, dpr: +(q.get('dpr') || 1),
  mode: q.get('mode') || 'sheet', product: q.get('product') || 'mcp-emails', label: q.get('label') || '', });
s.setPeel(+(q.get('p') || 0), { curlOnly: q.get('curl') === '1' });
s.render();
document.title = 'done';
</script></body></html>
