<!doctype html>
<html><head><meta charset="utf-8"><title>render product lamp</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#020513;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Bakes one "lamp" product visual: the REAL product logo (untouched) on a glass
// plinth tile, lit from behind by a sodium halo, orbited by a molten particle arc,
// over a graded NASA ISS night photograph. Usage: ?p=fun-libs&w=1600&h=1000
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1600), H = +(q.get('h') || 1000);
const P = {
  'mcp-emails': { logo: '../../../_shared/products/mcp-emails/icon.png', bg: '../extras/coastal-network-1800.webp', bgPos: [0.62, 0.45], tile: null, tag: 'LAMP 01 — MCP EMAILS', status: 'LIT · SINCE 2026', seed: 3, tilt: -0.22 },
  'fun-libs': { logo: '../../../_shared/products/fun-libs/icon.png', bg: '../hero/earth-grid-2880.webp', bgPos: [0.45, 0.35], tag: 'LAMP 02 — FUN LIBS', status: 'LIT · SINCE 2019', seed: 7, tilt: 0.18 },
  'toolrails': { logo: '../../../_shared/products/toolrails/icon.svg', bg: '../extras/manhattan-night-1800.webp', bgPos: [0.4, 0.55], tag: 'LAMP 03 — TOOLRAILS', status: 'STRIKING · BUILDING', seed: 11, tilt: -0.1 },
  'harbor': { logo: 'harbor-tile.svg', bg: '../hero/earth-limb-2880.webp', bgPos: [0.25, 0.2], tag: 'LAMP 04 — HARBOR', status: 'DIMMED · PAUSED', seed: 19, tilt: 0.26, cool: true },
}[q.get('p') || 'fun-libs'];

const c = document.getElementById('c'); c.width = W; c.height = H; c.style.width = W + 'px';
const g = c.getContext('2d');
let s = P.seed * 9301 + 49297; const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
const load = (src) => new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = j; i.src = src; });
await document.fonts.load('500 20px "JetBrains Mono"');
const [bg, logo] = await Promise.all([load(P.bg), load(P.logo)]);

// 1. photo, cover-cropped around bgPos, zoomed, darkened toward the edges
const sc = Math.max(W / bg.width, H / bg.height) * 1.35;
const bw = bg.width * sc, bh = bg.height * sc;
g.filter = 'saturate(1.0) brightness(0.42) contrast(1.15) blur(2px)';
g.drawImage(bg, -(bw - W) * P.bgPos[0], -(bh - H) * P.bgPos[1], bw, bh);
g.filter = 'none';
let grd = g.createRadialGradient(W * 0.5, H * 0.5, H * 0.1, W * 0.5, H * 0.5, W * 0.62);
grd.addColorStop(0, 'rgba(2,5,19,0.25)'); grd.addColorStop(1, 'rgba(2,5,19,0.92)');
g.fillStyle = grd; g.fillRect(0, 0, W, H);

const cx = W * 0.5, cy = H * 0.5, T = Math.min(W, H) * 0.3; // tile size
const glowCol = P.cool ? [82, 181, 244] : [251, 148, 42];
const rgba = (a, col = glowCol) => `rgba(${col[0]},${col[1]},${col[2]},${a})`;

// 2. sodium halo behind the plinth
g.globalCompositeOperation = 'lighter';
grd = g.createRadialGradient(cx, cy, 0, cx, cy, T * 1.9);
grd.addColorStop(0, rgba(0.75)); grd.addColorStop(0.3, rgba(0.26)); grd.addColorStop(1, rgba(0));
g.fillStyle = grd; g.fillRect(0, 0, W, H);

// 3. molten orbit: an inclined ellipse of particles, hot at the head, cooling along the tail
const sprite = (col, n = 32) => { const o = document.createElement('canvas'); o.width = o.height = n; const x = o.getContext('2d'); const r = x.createRadialGradient(n / 2, n / 2, 0, n / 2, n / 2, n / 2); r.addColorStop(0, '#fff'); r.addColorStop(0.2, col); r.addColorStop(1, col + '00'); x.fillStyle = r; x.fillRect(0, 0, n, n); return o; };
const ramp = ['#fff4d6', '#ffe196', '#fb942a', '#ef5b36', '#e63281', '#4a3f9a', '#234877'].map((c2) => sprite(c2));
const coolRamp = ['#f1f6fa', '#bed4eb', '#52b5f4', '#234877'].map((c2) => sprite(c2));
const R = P.cool ? coolRamp : ramp;
const rx = T * 1.45, ry = T * 0.42, head = rnd() * Math.PI * 2;
function orbit(front) {
  for (let i = 0; i < 5200; i++) {
    const u = i / 5200; // 0 = head, 1 = end of tail
    const a = head - u * Math.PI * 1.85;
    const sinA = Math.sin(a);
    if ((sinA > 0) !== front) continue; // front half drawn over the tile
    const jitter = (1 - u) * 0.4 + 0.6;
    let x = Math.cos(a) * rx + (rnd() - 0.5) * 10 * u, y = sinA * ry + (rnd() - 0.5) * 10 * u;
    const xr = x * Math.cos(P.tilt) - y * Math.sin(P.tilt), yr = x * Math.sin(P.tilt) + y * Math.cos(P.tilt);
    const k = Math.min(R.length - 1, Math.floor(u * R.length * 1.05));
    const size = (1 - u) ** 2 * 7 + 1.4 + rnd() * 1.8;
    g.globalAlpha = Math.min(0.85, (1 - u) * 1.2) * (0.3 + rnd() * 0.7) * jitter;
    g.drawImage(R[k], cx + xr - size / 2, cy + yr - size / 2, size, size);
  }
  if (front) { // comet head
    const x = Math.cos(head) * rx, y = Math.sin(head) * ry;
    const xr = x * Math.cos(P.tilt) - y * Math.sin(P.tilt), yr = x * Math.sin(P.tilt) + y * Math.cos(P.tilt);
    g.globalAlpha = 1; g.drawImage(R[1], cx + xr - 30, cy + yr - 30, 60, 60); g.drawImage(R[0], cx + xr - 9, cy + yr - 9, 18, 18);
  }
  g.globalAlpha = 1;
}
if (Math.sin(head) <= 0 || true) orbit(false);

// 4. glass plinth tile with the untouched product logo
g.globalCompositeOperation = 'source-over';
const r = T * 0.22;
const rr = (x, y, w, h, rad) => { g.beginPath(); g.roundRect(x, y, w, h, rad); };
g.save();
g.shadowColor = 'rgba(0,0,0,0.65)'; g.shadowBlur = 80; g.shadowOffsetY = 40;
rr(cx - T / 2 - 18, cy - T / 2 - 18, T + 36, T + 36, r + 14);
g.fillStyle = 'rgba(12,35,72,0.35)'; g.fill();
g.restore();
// glass rim
g.save();
rr(cx - T / 2 - 18, cy - T / 2 - 18, T + 36, T + 36, r + 14);
const rim = g.createLinearGradient(cx - T, cy - T, cx + T, cy + T);
rim.addColorStop(0, 'rgba(241,246,250,0.55)'); rim.addColorStop(0.45, 'rgba(241,246,250,0.06)'); rim.addColorStop(1, rgba(0.7));
g.strokeStyle = rim; g.lineWidth = 1.5; g.stroke();
g.restore();
// logo itself (clipped to a rounded square only where the logo is already a square app icon)
g.save();
rr(cx - T / 2, cy - T / 2, T, T, r); g.clip();
g.drawImage(logo, cx - T / 2, cy - T / 2, T, T);
// subtle specular sweep on the glass, not on the logo colours
const sp = g.createLinearGradient(cx - T / 2, cy - T / 2, cx + T / 2, cy + T / 2);
sp.addColorStop(0, 'rgba(255,255,255,0.10)'); sp.addColorStop(0.38, 'rgba(255,255,255,0)'); sp.addColorStop(1, 'rgba(255,255,255,0)');
g.fillStyle = sp; g.fillRect(cx - T / 2, cy - T / 2, T, T);
g.restore();
// rim light from the halo on the lower edge
g.save(); g.globalCompositeOperation = 'lighter';
rr(cx - T / 2 - 18, cy - T / 2 - 18, T + 36, T + 36, r + 14); g.clip();
const bl = g.createLinearGradient(0, cy + T / 2 - 10, 0, cy + T / 2 + 18);
bl.addColorStop(0, rgba(0)); bl.addColorStop(1, rgba(0.35));
g.fillStyle = bl; g.fillRect(cx - T, cy, T * 2, T);
g.restore();

// 5. front half of the orbit
g.globalCompositeOperation = 'lighter';
orbit(true);
g.globalCompositeOperation = 'source-over';

// 6. dust: tiny cold specks
for (let i = 0; i < 220; i++) { g.globalAlpha = rnd() * 0.5; g.fillStyle = rnd() > 0.85 ? '#ffe196' : '#bed4eb'; g.fillRect(rnd() * W, rnd() * H, 1.4, 1.4); }
g.globalAlpha = 1;

// 7. HUD annotations (mono, minimal)
const m = Math.round(W * 0.04);
g.font = `500 ${Math.round(W * 0.0105)}px "JetBrains Mono"`; g.textBaseline = 'top';
g.fillStyle = 'rgba(190,212,235,0.85)'; g.letterSpacing = '3px';
g.fillText(P.tag, m, m);
g.textAlign = 'right'; g.fillStyle = P.cool ? 'rgba(82,181,244,0.95)' : 'rgba(251,148,42,0.95)';
g.fillText(P.status, W - m, m);
g.textAlign = 'left'; g.textBaseline = 'bottom'; g.fillStyle = 'rgba(190,212,235,0.5)';
g.fillText('ALBRETSEN AS', m, H - m);
g.textAlign = 'right'; g.fillText('IMAGE: NASA / ISS CREW EARTH OBSERVATIONS', W - m, H - m);
// corner ticks
g.strokeStyle = 'rgba(190,212,235,0.35)'; g.lineWidth = 1;
for (const [x, y, dx, dy] of [[m, m * 1.9, 1, 1], [W - m, m * 1.9, -1, 1], [m, H - m * 1.9, 1, -1], [W - m, H - m * 1.9, -1, -1]]) {
  g.beginPath(); g.moveTo(x, y + dy * 18); g.lineTo(x, y); g.lineTo(x + dx * 18, y); g.stroke();
}
document.title = 'ready';
</script></body></html>
