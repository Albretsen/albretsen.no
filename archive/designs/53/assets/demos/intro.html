<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halflight intro</title>
<link rel="icon" href="../identity/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&family=Geist:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../motion.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--hl-umber); color: var(--hl-vellum); }
  .hero { position: fixed; inset: 0; overflow: hidden; }
  .hero img, .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(22,13,6,0) 50%, rgba(22,13,6,.85) 100%); }
  .copy { position: absolute; left: clamp(16px, 6vw, 96px); right: clamp(16px, 6vw, 96px); bottom: clamp(56px, 11vh, 120px); z-index: 2; pointer-events: none; }
  .copy h1 { margin: 0; font: 400 clamp(64px, 13vw, 220px)/.86 'Instrument Serif', serif; }
  .copy p { margin: 18px 0 0; font: italic 400 clamp(22px, 2.6vw, 38px)/1.2 'Instrument Serif', serif; color: var(--hl-spark);
    opacity: 0; transform: translateY(8px); transition: opacity 1.2s var(--hl-ease-film) 1.1s, transform 1.2s var(--hl-ease-film) 1.1s; }
  .copy h1.is-in + p { opacity: 1; transform: none; }
  .meta { position: absolute; left: clamp(16px, 6vw, 96px); right: clamp(16px, 6vw, 96px); top: 24px; z-index: 2; display: flex; justify-content: space-between; align-items: center;
    font: 500 11px/1 'Geist Mono', monospace; letter-spacing: .24em; text-transform: uppercase; color: rgba(246,238,221,.75); }
  .meta img { height: 28px; }
  .sun { display: inline-flex; align-items: center; gap: 10px; }
  .sun i { width: 7px; height: 7px; border-radius: 50%; background: var(--hl-spark); box-shadow: 0 0 10px var(--hl-spark); }
  .replay { position: fixed; right: 16px; bottom: 16px; z-index: 5; font: 500 11px 'Geist Mono', monospace; letter-spacing: .2em; text-transform: uppercase;
    background: none; color: var(--hl-ochre); border: 1px solid rgba(222,172,55,.4); border-radius: 99px; padding: 8px 14px; cursor: pointer; }
</style>
</head>
<body class="hl-grain">
<section class="hero">
  <img id="still" src="../hero/hero-dawn.webp" srcset="../hero/hero-dawn.webp 1440w, ../hero/hero-dawn@2x.webp 2880w" sizes="100vw" alt="">
  <canvas id="c"></canvas>
</section>
<header class="meta"><img src="../identity/lockup.svg" alt="Albretsen AS"><span class="sun"><i></i><span id="phase"></span></span></header>
<div class="copy">
  <h1 class="hl-title" id="t">Albretsen</h1>
  <p>I build software that pays for itself.</p>
</div>
<button class="replay" onclick="location.reload()">Replay</button>
<script type="module">
  import { createHalflight, PLATES } from '../js/halflight.js';
  import { applyPhase } from '../js/timeofday.js';
  import { splitTitle, runIntro } from '../motion.js';
  const p = applyPhase();
  document.getElementById('phase').textContent = `${p.label} · ${p.time}`;
  document.getElementById('still').src = PLATES[p.plate].still;
  document.getElementById('still').removeAttribute('srcset');
  const hl = createHalflight(document.getElementById('c'), { plate: p.plate, phase: p.name });
  if (hl) document.getElementById('still').style.visibility = 'hidden';
  const t = splitTitle(document.getElementById('t'));
  runIntro(hl, { title: t });
</script>
</body>
</html>
