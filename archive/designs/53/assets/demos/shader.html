<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halflight shader demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #160d06; color: #f6eedd; font: 13px/1.4 ui-monospace, monospace; }
  .stage { position: fixed; inset: 0; }
  .stage img, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .ui { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; color: inherit; background: #160d06cc; border: 1px solid #deac3766; border-radius: 99px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: #fad86f; }
  .clean .ui, .clean .tag { display: none; }
  .tag { position: fixed; right: 16px; bottom: 16px; color: #deac37; }
</style>
</head>
<body>
<div class="stage">
  <img id="still" alt="" src="../hero/hero-dawn.webp">
  <canvas id="c"></canvas>
</div>
<div class="ui">
  <button data-plate="dawn">dawn</button><button data-plate="dusk">dusk</button><button data-plate="night">night</button>
  <button data-phase="day">day ink</button><button id="replay">replay intro</button>
</div>
<div class="tag" id="tag"></div>
<script type="module">
  import { createHalflight } from '../js/halflight.js';
  import { applyPhase } from '../js/timeofday.js';
  const q = new URLSearchParams(location.search);
  const p = applyPhase();
  document.getElementById('tag').textContent = `${p.label} · ${p.time} · sun ${p.alt.toFixed(1)}°`;
  if (q.has('clean')) document.body.classList.add('clean');
  const hl = createHalflight(document.getElementById('c'), { plate: q.get('plate') || p.plate, phase: p.name, intro: q.get('intro') !== '0', freeze: q.has('freeze') ? +q.get('freeze') : null });
  if (hl) document.getElementById('still').style.opacity = 0;
  document.querySelectorAll('[data-plate]').forEach(b => b.onclick = () => { hl.setPhase(b.dataset.plate); hl.setPlate(b.dataset.plate); hl.play(); });
  document.querySelector('[data-phase]').onclick = () => hl.setPhase('day');
  document.getElementById('replay').onclick = () => hl.play();
</script>
</body>
</html>
