<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One-sheet source</title>
<!-- Source for products/*.webp. Render: scripts/shot.sh ".../src/one-sheet.html?p=mcp-emails" out.png 1200 1600 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&family=Geist:wght@400;600&display=block" rel="stylesheet">
<style>
  :root { --umber:#160d06; --peat:#3c2514; --clay:#a75932; --ember:#de6f11; --ochre:#deac37; --spark:#fad86f; --vellum:#f6eedd; }
  html, body { margin: 0; width: 1200px; height: 1600px; background: var(--umber); overflow: hidden; }
  .sheet { position: relative; width: 1200px; height: 1600px; color: var(--vellum); font-family: 'Geist', sans-serif; }
  .art { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .art::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(22,13,6,.55) 0%, rgba(22,13,6,0) 18%, rgba(22,13,6,0) 42%, rgba(22,13,6,.82) 66%, #160d06 84%); }
  .grain { position: absolute; inset: 0; opacity: .18; mix-blend-mode: overlay; background-image: url(../texture/grain.webp); }
  .top { position: absolute; left: 72px; right: 72px; top: 64px; display: flex; justify-content: space-between; align-items: center;
    font: 500 19px/1 'Geist Mono', monospace; letter-spacing: .22em; text-transform: uppercase; color: var(--vellum); }
  .top .chip { border: 1.5px solid var(--ochre); color: var(--spark); padding: 10px 16px 9px; border-radius: 99px; }
  .top .chip i { display:inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--spark); margin-right: 10px; vertical-align: 1px; box-shadow: 0 0 12px var(--spark); }
  .logo { position: absolute; left: 50%; top: 540px; transform: translate(-50%, -50%); display: grid; place-items: center; }
  .logo::before { content: ''; position: absolute; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(250,216,111,.55) 0%, rgba(222,111,17,.28) 28%, rgba(22,13,6,0) 62%); }
  .logo img { position: relative; display: block; filter: drop-shadow(0 30px 50px rgba(0,0,0,.55)); }
  .title { position: absolute; left: 72px; right: 72px; top: 870px; text-align: center; }
  .kicker { font: 500 18px/1 'Geist Mono', monospace; letter-spacing: .3em; text-transform: uppercase; color: var(--ochre); }
  h1 { margin: 26px 0 0; font: 400 168px/0.9 'Instrument Serif', serif; letter-spacing: -.02em; }
  .line { margin: 30px auto 0; font: italic 400 46px/1.15 'Instrument Serif', serif; color: var(--spark); max-width: 960px; }
  .figure { position: absolute; left: 72px; right: 72px; top: 1290px; display: flex; justify-content: center; align-items: baseline; gap: 22px; }
  .figure b { font: 400 96px/1 'Instrument Serif', serif; color: var(--vellum); }
  .figure span { font: 500 20px/1 'Geist Mono', monospace; letter-spacing: .24em; text-transform: uppercase; color: var(--ochre); }
  .billing { position: absolute; left: 72px; right: 72px; bottom: 120px; text-align: center; border-top: 1px solid rgba(222,172,55,.35); padding-top: 30px;
    font: 400 19px/1.6 'Geist Mono', monospace; letter-spacing: .2em; text-transform: uppercase; color: rgba(246,238,221,.78); }
  .billing em { font-style: normal; color: var(--ochre); padding: 0 .6em; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 56px; display: flex; justify-content: space-between; align-items: center;
    font: 500 16px/1 'Geist Mono', monospace; letter-spacing: .26em; text-transform: uppercase; color: rgba(246,238,221,.6); }
  .foot img { height: 34px; }
  .frame { position: absolute; inset: 28px; border: 1px solid rgba(222,172,55,.28); border-radius: 6px; pointer-events: none; }
</style>
</head>
<body>
<div class="sheet" id="s">
  <div class="art" id="art"></div>
  <div class="grain"></div>
  <div class="frame"></div>
  <div class="top"><span id="since"></span><span class="chip" id="status"></span></div>
  <div class="logo" id="logo"></div>
  <div class="title"><div class="kicker" id="kicker"></div><h1 id="name"></h1><p class="line" id="line"></p></div>
  <div class="figure" id="figure"></div>
  <div class="billing" id="billing"></div>
  <div class="foot"><img src="../identity/lockup.svg" alt=""><span>albretsen.no</span></div>
</div>
<script type="module">
  import { content } from '../../../_shared/content.js';
  const P = '../../../_shared/products/';
  const ART = {
    'mcp-emails': { art: '../illustration/meteors.webp', logo: `<img src="${P}mcp-emails/icon.png" width="300" height="300" style="border-radius:66px">`, kicker: 'Plate I · The November meteors' },
    'fun-libs':   { art: '../illustration/aurora.webp', pos: '50% 30%', logo: `<img src="${P}fun-libs/splash-icon.png" width="320" height="320">`, kicker: 'Plate II · Aurora borealis' },
    'toolrails':  { art: '../illustration/eclipse.webp', pos: '50% 40%', logo: `<img src="${P}toolrails/icon.svg" width="300" height="300" style="border-radius:56px">`, kicker: 'Plate III · Total eclipse' },
    'harbor':     { art: '../illustration/comet.webp', logo: `<img src="${P}harbor/harbor-wordmark.svg" width="560" style="color:#FBF9F4" id="hw">`, kicker: 'Plate IV · The great comet' },
  };
  const id = new URLSearchParams(location.search).get('p') || 'mcp-emails';
  const p = content.products.find(x => x.id === id), a = ART[id];
  document.getElementById('art').style.backgroundImage = `url(${a.art})`;
  if (a.pos) document.getElementById('art').style.backgroundPosition = a.pos;
  document.getElementById('since').textContent = `Albretsen AS · since ${p.since}`;
  document.getElementById('status').innerHTML = `<i></i>${p.status}`;
  document.getElementById('kicker').textContent = a.kicker;
  document.getElementById('name').textContent = p.name;
  document.getElementById('line').textContent = p.line;
  if (p.figure) document.getElementById('figure').innerHTML = `<b>${p.figure.value}</b><span>${p.figure.label}</span>`;
  document.getElementById('billing').innerHTML = (p.facts || []).join('<em>·</em>') + (p.url ? `<br>${p.url.replace('https://', '')}` : '');
  // Harbor's wordmark uses currentColor: inline it so it takes Harbor's own paper colour (#FBF9F4)
  if (id === 'harbor') {
    const svg = await (await fetch(`${P}harbor/harbor-wordmark.svg`)).text();
    document.getElementById('logo').innerHTML = `<div style="color:#FBF9F4;width:600px;position:relative">${svg.replace('width="320" height="80"', 'width="600" height="150"')}</div>`;
  } else document.getElementById('logo').innerHTML = a.logo;
</script>
</body>
</html>
