<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Germination loader</title>
<link rel="icon" href="../identity/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,50;1,9..144,300..500,100&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../motion.css">
<style>
  /* Demo of the signature loading moment. ?frame=N freezes the Lottie at a frame (for stills). */
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: Fraunces, Georgia, serif; overflow: hidden; }
  .behind { position: fixed; inset: 0; display: grid; place-items: center; background: url(../hero/terrarium-hero@1x.webp) center/cover; }
  .behind p { position: absolute; left: 6vw; top: 40%; max-width: 22ch; font-size: clamp(32px, 4vw, 60px); line-height: 1.05; font-weight: 340; letter-spacing: -0.02em; }
</style>
<script src="https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie_light.min.js"></script>
</head>
<body>
<div class="behind"><p>I build software that pays for itself.</p></div>

<div class="germinate-loader" data-loader>
  <div class="germinate-loader__jar" data-lottie></div>
  <p class="germinate-loader__label"><span>Albretsen AS</span><span class="germinate-loader__count" data-count>000</span></p>
</div>

<script type="module">
  import { germinate } from '../motion.js';
  const q = new URLSearchParams(location.search);
  germinate(document.querySelector('[data-loader]'), {
    src: './sprout-loader.json',
    frame: q.has('frame') ? +q.get('frame') : null,
    minDuration: 2400,
    ready: new Promise(r => setTimeout(r, 1800)), // stands in for "page assets loaded"
  });
</script>
</body>
</html>
