<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Graph (composition source)</title>
<!-- Composition source for identity/og-image.png (1200x630). -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,50;1,9..144,300..500,100&family=Spline+Sans+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root { --paper:#f8f4ea; --deep:#ede5d6; --ink:#162118; --soft:#525e54; --moss:#408742; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; color: var(--ink); font-family: Fraunces, Georgia, serif; background: var(--paper); }
  .art { position: absolute; inset: 0; background: url(../hero/terrarium-hero@2x.webp) 40% 64% / 1300px auto no-repeat; }
  .txt { position: absolute; left: 64px; top: 64px; bottom: 60px; display: flex; flex-direction: column; justify-content: space-between; width: 520px; }
  .lock { width: 290px; }
  h1 { margin: 0; font-weight: 330; font-size: 64px; line-height: 1.02; letter-spacing: -.025em; font-variation-settings: "SOFT" 50, "opsz" 144; }
  h1 em { font-style: italic; color: var(--moss); font-variation-settings: "SOFT" 100, "opsz" 144; }
  .mono { font-family: "Spline Sans Mono", monospace; font-size: 14px; letter-spacing: .2em; text-transform: uppercase; color: var(--soft); }
</style>
</head>
<body>
<div class="art"></div>
<div class="txt">
  <img class="lock" src="../identity/lockup.svg" alt="">
  <h1>I build software that <em>pays for itself.</em></h1>
  <div class="mono">albretsen.no</div>
</div>
<script>addEventListener('load', () => document.title = 'ready');</script>
</body>
</html>
