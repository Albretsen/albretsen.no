<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payload composer</title>
<!-- Source page for the product "payload" stills. Render with:
     scripts/shot.sh "http://127.0.0.1:6057/designs/57/assets/src/payload.html?p=fun-libs" out.png 1600 1000
     then convert to webp. Kept so the builder can re-bake or animate them live. -->

<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{--ink:#070707;--paper:#f9f6f5;--burn:#f34046;--fog:#747070}
*{box-sizing:border-box;margin:0}
html,body{width:1600px;height:1000px;overflow:hidden;background:var(--ink);color:#fff}
.stage{position:relative;width:1600px;height:1000px;overflow:hidden;perspective:1800px}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 70% 40%,transparent 30%,rgba(7,7,7,.75) 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:80px 80px;mask-image:linear-gradient(90deg,#000 0%,transparent 70%)}
svg.vec{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tile{position:absolute;width:300px;height:300px;transform-style:preserve-3d;display:grid;place-items:center}
.tile .face{width:100%;height:100%;border-radius:44px;background:#fff;display:grid;place-items:center;box-shadow:0 60px 120px -30px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.3) inset;overflow:hidden}
.tile .face img{width:62%;height:62%;object-fit:contain}
.tile .face.full img{width:100%;height:100%;object-fit:cover}
.tile .shadow{position:absolute;left:10%;right:10%;bottom:-120px;height:40px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent);filter:blur(6px)}
.label{position:absolute;left:72px;bottom:68px;font-family:"Martian Mono",ui-monospace,monospace;font-size:15px;letter-spacing:.06em;text-transform:uppercase;line-height:1.9;color:rgba(255,255,255,.75);font-variation-settings:"wdth" 87}
.label b{color:#fff;font-weight:600}
.label .st{display:inline-block;background:var(--burn);color:var(--ink);padding:0 8px;margin-right:10px;font-weight:700}
.name{position:absolute;left:66px;top:56px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:132px;letter-spacing:-.045em;line-height:.86;font-variation-settings:"wdth" 78,"opsz" 96;color:#fff;mix-blend-mode:difference}
.big{position:absolute;right:72px;bottom:60px;text-align:right;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:96px;letter-spacing:-.04em;line-height:1;font-variation-settings:"wdth" 75}
.big small{display:block;font-family:"Martian Mono",monospace;font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--burn);margin-top:6px}
.reg{position:absolute;width:26px;height:26px}
.reg::before,.reg::after{content:"";position:absolute;background:#fff}
.reg::before{left:12px;top:0;width:2px;height:26px}.reg::after{top:12px;left:0;height:2px;width:26px}
</style></head>
<body><div class="stage" id="s"></div>
<script type="module">
const P = {
  'mcp-emails': { title:'MCP Emails', name:'MCP<br>Emails', bg:'../img/hero-earthrise.webp', pos:'center 30%', logo:'../../../_shared/products/mcp-emails/logo-mark.svg',
    st:'Live', since:2026, fig:'$782', figl:'MRR', facts:['17 tools','about 100 email providers','open source (AGPL)'], tile:[1080,330,-14,22,6], down:true },
  'fun-libs': { title:'Fun Libs', name:'Fun<br>Libs', bg:'../img/plate-saturn.webp', pos:'center 60%', logo:'../../../_shared/products/fun-libs/icon.png', full:true,
    st:'Live', since:2019, fig:'113,000+', figl:'installs', facts:['built at 17','no marketing','v5 shipped 2026'], tile:[1150,560,10,-24,-8] },
  'toolrails': { title:'Toolrails', name:'Tool<br>rails', bg:'../img/horizon-apollo17.webp', pos:'38% 50%', logo:'../../../_shared/products/toolrails/icon.svg', full:true,
    st:'Building', since:2026, fig:'4', figl:'connectors', facts:['tool search','injection guard'], tile:[1040,280,-18,-16,4], r:56 },
  'harbor': { title:'Harbor', name:'Harbor', bg:'../img/plate-zodiacal.webp', pos:'center 40%', logo:'../../../_shared/products/harbor/harbor-mark.svg',
    st:'Paused', since:2026, fig:'549', figl:'commits', facts:['self-hostable','AI edits held for approval'], tile:[1060,520,8,26,-5] },
}
const id = new URLSearchParams(location.search).get('p') || 'mcp-emails'
const p = P[id]
const [tx,ty,rx,ry,rz] = p.tile
const s = document.getElementById('s')
const cx = tx+150, cy = ty+150, D = p.down ? 1 : -1
s.innerHTML = `
 <div class="bg" style="background-image:url(${p.bg});background-position:${p.pos}"></div>
 <div class="grid"></div>
 <svg class="vec" viewBox="0 0 1600 1000">
   <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#f34046" stroke-width="2"/></marker></defs>
   <ellipse cx="${cx}" cy="${cy+40}" rx="330" ry="96" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5" stroke-dasharray="2 8" transform="rotate(-12 ${cx} ${cy})"/>
   <path d="M${cx-520} ${cy+330} C ${cx-380} ${cy+160}, ${cx-250} ${cy+40}, ${cx-205} ${cy-10}" fill="none" stroke="#f34046" stroke-width="3" marker-end="url(#ah)"/>
   <circle cx="${cx-520}" cy="${cy+330}" r="6" fill="#f34046"/>
   <line x1="${cx-170}" y1="${cy+D*170}" x2="${cx-250}" y2="${cy+D*250}" stroke="#fff" stroke-width="1.5"/>
   <line x1="${cx-250}" y1="${cy+D*250}" x2="${cx-430}" y2="${cy+D*250}" stroke="#fff" stroke-width="1.5"/>
   <text x="${cx-430}" y="${cy+D*250-12}" fill="#fff" font-family="Martian Mono, monospace" font-size="13" letter-spacing="1.5">PAYLOAD / ${id.toUpperCase()}</text>
   <text x="${cx-500}" y="${cy+336}" fill="#f34046" font-family="Martian Mono, monospace" font-size="13" letter-spacing="1.5">T0 ${p.since}</text>
 </svg>
 <div class="reg" style="left:40px;top:40px"></div><div class="reg" style="right:40px;top:40px"></div>
 <div class="reg" style="left:40px;bottom:40px"></div><div class="reg" style="right:40px;bottom:40px"></div>
 <div class="tile" style="left:${tx}px;top:${ty}px;transform:rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)">
   <div class="face${p.full?' full':''}" style="${p.r?`border-radius:${p.r}px;background:transparent`:''}"><img src="${p.logo}" alt=""></div><div class="shadow"></div></div>
 <div class="label"><span class="st">${p.st}</span><b>${p.title}</b> &nbsp;/&nbsp; T0 ${p.since}</div>`
if (id==='harbor') s.querySelector('.face').style.color = '#070707'
</script>
</body></html>
