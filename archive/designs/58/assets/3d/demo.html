<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lapis Geode</title>
<link rel="icon" href="../identity/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --lapis:#073fe3; --ink:#061457; --night:#040b2d; --frost:#cadbfd; --vellum:#faf3e3; }
  html,body { margin:0; height:100%; background:var(--lapis); color:var(--vellum); font-family:'Instrument Sans',system-ui,sans-serif; overflow:hidden }
  body { background: radial-gradient(120% 90% at 50% 30%, #1a52ef 0%, var(--lapis) 55%, #0533c0 100%); }
  #stage { position:absolute; inset:0 }
  .tag { position:absolute; left:0; top:0; pointer-events:none; transform:translate(-50%,-120%); background:var(--vellum); color:var(--ink);
    padding:8px 12px 9px; border-radius:3px; box-shadow:0 10px 30px -10px rgba(4,11,45,.6); font:500 13px/1.2 'Instrument Sans'; opacity:0; transition:opacity .2s; white-space:nowrap }
  .tag em { display:block; font:italic 400 17px/1.1 'Fraunces',serif; font-variation-settings:'SOFT' 100,'WONK' 1 }
  .tag small { font:400 10px/1 'Martian Mono',monospace; letter-spacing:.06em; text-transform:uppercase; opacity:.6 }
  .hint { position:absolute; left:24px; bottom:22px; font:400 11px/1.5 'Martian Mono',monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--frost) }
  .hint b { color:var(--vellum); font-weight:500 }
  button { position:absolute; right:24px; bottom:18px; background:none; border:1px solid rgba(250,243,227,.5); color:var(--vellum); font:500 12px 'Instrument Sans'; padding:8px 14px; border-radius:99px; cursor:pointer }
  button:hover { background:var(--vellum); color:var(--lapis) }
</style>
</head>
<body>
<div id="stage"></div>
<div class="tag" id="tag"><small id="tagNo">No. 01</small><em id="tagName">MCP Emails</em></div>
<p class="hint"><b>Drag the stone</b> to turn it · <b>drag a crystal</b> to re-seat it</p>
<button id="shuffle">Shake the cabinet</button>
<script type="module">
  import { mountGeode, DEFAULT_PRODUCTS } from './crystals.js';
  const q = new URLSearchParams(location.search);
  const still = q.has('still');
  if (q.has('clear')) { document.documentElement.style.background = 'transparent'; document.body.style.background = 'transparent'; }
  const geode = await mountGeode(document.getElementById('stage'), {
    still, shadow: !q.has('clear'), background: q.get('bg') ? '#' + q.get('bg') : null,
    yaw: parseFloat(q.get('yaw') || '-0.5'), pitch: parseFloat(q.get('pitch') || '0.32'), zoom: parseFloat(q.get('zoom') || '1'),
    onHover(p) {
      const tag = document.getElementById('tag');
      if (!p) { tag.style.opacity = 0; return; }
      const i = DEFAULT_PRODUCTS.findIndex((d) => d.id === p.id);
      document.getElementById('tagNo').textContent = 'Specimen No. ' + String(i + 1).padStart(2, '0');
      document.getElementById('tagName').textContent = p.name;
      const xy = geode.project(p.id); tag.style.left = xy.x + 'px'; tag.style.top = xy.y + 'px'; tag.style.opacity = 1;
    },
  });
  document.getElementById('shuffle').onclick = () => geode.shuffle();
  if (still) document.querySelectorAll('.hint,button').forEach((n) => n.remove());
  window.geode = geode;
</script>
</body>
</html>
