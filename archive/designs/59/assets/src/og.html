<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG master</title>
<!-- Source for identity/og.jpg, 1200x630. -->
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
  :root { --ink:#0f0b22; --paper:#f3f2fb; --violet:#6c35ec; --glow:#bab0ff; --lime:#cefd3e; }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  .og { position:relative; width:1200px; height:630px; background:var(--ink) url(../textures/spiral-violet-1800.webp) center/cover; color:var(--paper); overflow:hidden; }
  .og::before { content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(15,11,34,.94) 0 46%, rgba(15,11,34,.35)); }
  .cover { position:absolute; right:96px; top:58px; width:390px; transform:rotate(5deg); box-shadow:0 0 0 4px var(--ink), 16px 16px 0 4px var(--ink); }
  .cover img { display:block; width:100%; }
  .word { position:absolute; left:64px; top:62px; height:62px; }
  .hed { position:absolute; left:64px; top:200px; width:600px; font:400 104px/.86 'Instrument Serif', serif; letter-spacing:-.03em; }
  .hed i { color:var(--glow); }
  .foot { position:absolute; left:66px; bottom:56px; font:700 16px/1 'JetBrains Mono', monospace; letter-spacing:.24em; text-transform:uppercase; color:var(--lime); }
  .st { position:absolute; }
</style>
</head>
<body>
<div class="og">
  <div class="cover"><img src="../hero/cover-bare-1600.webp" alt=""></div>
  <img class="word" src="../identity/logo-wordmark-on-dark.svg" alt="">
  <h1 class="hed">Software that <i>pays</i> for itself.</h1>
  <p class="foot">albretsen.no · Norway</p>
  <img class="st" src="../stickers/burst-installs.svg" style="left:640px; top:380px; width:200px; transform:rotate(-12deg)">
  <img class="st" src="../stickers/seal-mrr.svg" style="left:1010px; top:400px; width:170px; transform:rotate(10deg)">
</div>
</body>
</html>
