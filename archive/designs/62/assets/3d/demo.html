<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facade, live</title>
<link rel="icon" href="../identity/favicon.svg">
<style>
@font-face{font-family:Italiana;src:url(../fonts/italiana.woff2) format('woff2');font-display:swap}
@font-face{font-family:Jost;src:url(../fonts/jost-var.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{--ink:#2b2d3a;--cream:#f7f1e6;--peach:#f2b98f;--paleblue:#b9cfe3}
html,body{margin:0;background:#efe3d6;color:var(--ink);font-family:Jost,system-ui,sans-serif}
.stage{position:relative;height:100svh;min-height:560px;overflow:hidden;background:#e9d8c9 url(../img/backdrop-sky-mountains-1920.webp) center 38%/cover}
.stage picture,.stage img,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage canvas{opacity:0;transition:opacity 1.2s ease}
.stage.live canvas{opacity:1}
.stage.live picture{opacity:0;transition:opacity 1.2s ease 0.2s}
.ui{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;
  background:rgb(247 241 230 / .78);backdrop-filter:blur(10px);border:1px solid rgb(43 45 58 / .12);border-radius:999px;padding:10px 16px;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.track{width:min(52vw,360px);height:28px;position:relative;cursor:ew-resize;touch-action:none}
.track::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px dashed rgb(43 45 58 / .4)}
.knob{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fffaf0,#f6c56b);box-shadow:0 0 0 6px rgb(246 197 107 / .25)}
button{font:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:1px solid rgb(43 45 58 / .3);border-radius:999px;padding:6px 12px;color:inherit;cursor:pointer}
button[aria-pressed=true]{background:var(--ink);color:var(--cream)}
.note{position:absolute;top:20px;left:24px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
@media (max-width:600px){.ui{left:16px;right:16px;transform:none;flex-wrap:wrap;justify-content:center}.track{width:100%}}
</style>
</head>
<body>
<section class="stage" id="stage">
  <picture>
    <source media="(max-aspect-ratio: 1/1)" type="image/avif" srcset="../img/hero-facade-dawn-tall-800.avif 800w, ../img/hero-facade-dawn-tall-1200.avif 1200w">
    <source media="(max-aspect-ratio: 1/1)" type="image/webp" srcset="../img/hero-facade-dawn-tall-800.webp 800w, ../img/hero-facade-dawn-tall-1200.webp 1200w">
    <source type="image/avif" srcset="../img/hero-facade-dawn-1024.avif 1024w, ../img/hero-facade-dawn-1600.avif 1600w, ../img/hero-facade-dawn-2400.avif 2400w">
    <source type="image/webp" srcset="../img/hero-facade-dawn-1024.webp 1024w, ../img/hero-facade-dawn-1600.webp 1600w, ../img/hero-facade-dawn-2400.webp 2400w">
    <img src="../img/hero-facade-dawn-1600.jpg" width="1600" height="900" alt="A symmetrical peach wooden house at sunrise, products lit in its ground-floor windows, mountains behind" fetchpriority="high">
  </picture>
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="note">Live · drag the sun</div>
  <div class="ui">
    <span>Dawn</span>
    <div class="track" id="track"><div class="knob" id="knob"></div></div>
    <span>Dusk</span>
    <button id="snd" aria-pressed="false">Sound</button>
  </div>
</section>
<script type="module">
import { initMotion, sunScrubber } from '../motion.js'
import { Ambience } from '../audio/ambient.js'
const stage = document.getElementById('stage'), knob = document.getElementById('knob')
const motion = initMotion({ source: 'none' })
sunScrubber(document.getElementById('track'), motion)
motion.onChange((t) => { knob.style.left = (t * 100) + '%' })
motion.set(0.16)

const amb = new Ambience()
const snd = document.getElementById('snd')
snd.onclick = () => snd.setAttribute('aria-pressed', amb.toggle())
motion.onChange((t) => amb.setTimeOfDay(t))

// Lazy 3D: after first paint and idle, only if WebGL exists.
const boot = async () => {
  const gl = document.createElement('canvas').getContext('webgl2')
  if (!gl) return
  const { createFacade } = await import('./facade.js')
  const canvas = document.getElementById('c')
  const r = stage.getBoundingClientRect()
  const f = await createFacade({ canvas, base: '../', sun: motion.get(), width: r.width, height: r.height,
    pixelRatio: Math.min(devicePixelRatio, 1.75), skyUrl: '../3d/tex/sky-env.jpg' })
  let pending = false
  const draw = () => { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; f.render() }) }
  motion.onChange((t) => { f.setSun(t); draw() })
  addEventListener('resize', () => { const b = stage.getBoundingClientRect(); f.resize(b.width, b.height); draw() })
  f.render(); stage.classList.add('live')
}
;(window.requestIdleCallback || setTimeout)(boot, { timeout: 1500 })
</script>
</body>
</html>
