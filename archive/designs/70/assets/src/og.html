<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG composer</title>
<style>
  @font-face{font-family:"EB Garamond";src:url(../fonts/eb-garamond-latin.woff2) format("woff2");font-weight:400 800}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#cdbba0}
  .og{position:relative;width:1200px;height:630px;background:url(../hero/facade-morning-1600.jpg) 50% 0/1200px auto no-repeat;font-family:"EB Garamond",Georgia,serif}
  .og::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,60,80,.18),transparent 45%)}
  .name{position:absolute;left:0;right:0;top:18px;text-align:center;font-size:112px;font-weight:440;line-height:1;color:#FBF7EF;letter-spacing:-.005em;text-shadow:0 2px 30px rgba(30,40,60,.18)}
  .line{position:absolute;left:0;right:0;top:136px;text-align:center;font-size:18px;letter-spacing:.26em;text-transform:uppercase;color:#FBF7EF;opacity:.95}
  .mark{position:absolute;left:36px;bottom:30px;width:54px;height:54px;background:#F6F1E8;border-radius:12px;display:grid;place-items:center}
  .dom{position:absolute;right:38px;bottom:40px;font-size:22px;letter-spacing:.14em;color:#2A2420;background:rgba(246,241,232,.85);padding:6px 16px;border-radius:999px}
</style>
</head>
<body>
<div class="og">
  <div class="name">Albretsen</div>
  <div class="line">Software that pays for itself</div>
  <div class="mark"><img src="../identity/mark.svg" width="44" height="44" alt=""></div>
  <div class="dom">albretsen.no</div>
</div>
</body>
</html>
