<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Dial demo</title>
<link rel="icon" href="../identity/favicon.svg">
<style>
  @font-face { font-family: Jost; src: url(../fonts/jost-var-latin.woff2) format('woff2'); font-weight: 300 700; font-display: swap; }
  @font-face { font-family: 'IBM Plex Mono'; src: url(../fonts/ibm-plex-mono-400-latin.woff2) format('woff2'); font-display: swap; }
  :root { --ink: #22304F; --snow: #FBF7F2; --flamingo: #EE8FA6; }
  html, body { margin: 0; height: 100%; background: #F3D3D3; color: var(--snow); font-family: Jost, system-ui, sans-serif; }
  .stage { position: relative; height: 100svh; min-height: 520px; overflow: hidden; }
  .stage picture img, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; display: block; }
  .stage picture img { transform: scale(1.031); transform-origin: 50% 60%; } /* matches the canvas 3% overscan */
  @media (max-aspect-ratio: 41/50) { .stage picture img { object-position: 50% 100%; transform: none; } }
  .stage canvas { opacity: 0; transition: opacity 900ms ease; }
  .stage canvas.ready { opacity: 1; }
  .hint { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); font: 500 11px/1 'IBM Plex Mono', monospace; letter-spacing: .24em; text-transform: uppercase; opacity: .85; pointer-events: none; text-shadow: 0 1px 8px rgba(34,48,79,.4); }
  .toggle { position: absolute; top: 20px; right: 20px; font: 500 12px/1 Jost, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: var(--ink); background: rgba(251,247,242,.86); border: 0; border-radius: 99px; padding: 12px 18px; cursor: pointer; }
  .toggle:focus-visible, canvas:focus-visible { outline: 2px solid var(--flamingo); outline-offset: 3px; }
  .readout { position: absolute; top: 24px; left: 24px; font: 400 11px/1.6 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; opacity: .9; }
</style>
</head>
<body>
<section class="stage">
  <picture>
    <source type="image/avif" media="(max-aspect-ratio: 41/50)" srcset="../img/hero-pinkhour-phone-720.avif 720w, ../img/hero-pinkhour-phone-1152.avif 1152w" sizes="100vw">
    <source type="image/webp" media="(max-aspect-ratio: 41/50)" srcset="../img/hero-pinkhour-phone-720.webp 720w, ../img/hero-pinkhour-phone-1152.webp 1152w" sizes="100vw">
    <source type="image/avif" srcset="../img/hero-pinkhour-640.avif 640w, ../img/hero-pinkhour-1280.avif 1280w, ../img/hero-pinkhour-1920.avif 1920w, ../img/hero-pinkhour-2560.avif 2560w" sizes="100vw">
    <source type="image/webp" srcset="../img/hero-pinkhour-640.webp 640w, ../img/hero-pinkhour-1280.webp 1280w, ../img/hero-pinkhour-1920.webp 1920w, ../img/hero-pinkhour-2560.webp 2560w" sizes="100vw">
    <img src="../img/hero-pinkhour-1280.jpg" srcset="../img/hero-pinkhour-640.jpg 640w, ../img/hero-pinkhour-1280.jpg 1280w, ../img/hero-pinkhour-1920.jpg 1920w" sizes="100vw" width="2560" height="1440" alt="A pink deco pavilion with a rooftop sign reading ALBRETSEN stands in a snowfield at the pink hour, golden cliffs behind." fetchpriority="high">
  </picture>
  <canvas id="sky"></canvas>
  <div class="readout" id="readout">Pink hour</div>
  <button class="toggle" id="toggle" type="button" aria-pressed="false">Night</button>
  <div class="hint">Drag the sun</div>
</section>
<script type="module">
  import { createSkyDial } from './sky-dial.js';
  const q = new URLSearchParams(location.search);
  const canvas = document.getElementById('sky');
  const btn = document.getElementById('toggle'), readout = document.getElementById('readout');
  const start = q.has('h') ? +q.get('h') : -0.06;
  try {
    const dial = await createSkyDial(canvas, { base: './layers/', scene: q.get('scene') || 'pavilion', h: start });
    requestAnimationFrame(() => canvas.classList.add('ready'));
    canvas.addEventListener('skydial:change', e => {
      readout.textContent = e.detail.theme === 'night' ? 'Night' : e.detail.h < 0.05 ? 'Pink hour' : 'Low winter sun';
      document.documentElement.dataset.theme = e.detail.theme;
      btn.textContent = e.detail.theme === 'night' ? 'Day' : 'Night';
      btn.setAttribute('aria-pressed', String(e.detail.theme === 'night'));
    });
    dial.set(start);
    btn.onclick = () => dial.set(dial.h < -0.08 ? -0.06 : -0.6, { animate: true });
    addEventListener('scroll', () => dial.parallax(scrollY / innerHeight), { passive: true });
  } catch (err) { console.warn('Sky Dial fell back to the still', err); }
</script>
</body>
</html>
