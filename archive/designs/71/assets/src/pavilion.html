<!doctype html>
<!--
  Build page (not shipped to visitors). Renders the pastel pavilions with three.js
  so they can be composited into the photographed snowfield.
  Params:
    b      = main | mcp-emails | fun-libs | toolrails | harbor
    mode   = day | glow  (glow = only emissive windows/sign on black, for the night pass)
    bg     = black | white  (two passes -> exact alpha with shadows, see src/build.py)
    w,h    = pixel size
-->
<html><head><meta charset="utf-8">
<style>@font-face{font-family:Jost;src:url(../fonts/jost-var-latin.woff2) format('woff2');font-weight:300 700}html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/geometries/RoundedBoxGeometry.js';

const q = new URLSearchParams(location.search);
const B = q.get('b') || 'main', MODE = q.get('mode') || 'day', BG = q.get('bg') || 'black';
const W = +q.get('w') || innerWidth, H = +q.get('h') || innerHeight;
const GLOW = MODE === 'glow';

const C = {
  flamingo: 0xF0A0B4, shell: 0xF7D3DA, mint: 0xA6DCC6, sky: 0x9CC8EA, white: 0xFBF7F2,
  ink: 0x22304F, cream: 0xF4EADB, glass: 0x34476E, warm: 0xFFC98F, snow: 0xFAF7F8,
};

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(BG === 'white' ? 0xffffff : 0x000000, 1);
renderer.shadowMap.enabled = !GLOW;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = GLOW ? THREE.ACESFilmicToneMapping : THREE.NoToneMapping; // composer path: linear so alpha recovery is exact
renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const isMain = B === 'main' || B === 'dish';
const camera = new THREE.PerspectiveCamera(isMain ? 17 : 22, W / H, 1, 600);
if (B === 'dish') { camera.position.set(0, 7.5, 78); camera.lookAt(0, 5.0, 0); camera.setViewOffset(W, H, 0, -H * 0.12, W, H); }
else if (isMain) { camera.position.set(0, 8.5, 82); camera.lookAt(0, 4.4, 0); camera.setViewOffset(W, H, 0, -H * 0.10, W, H); }
else { camera.position.set(0, 5.6, 36); camera.lookAt(0, 3.0, 0); }

// ---------- light: low winter sun from the right, slightly in front ----------
const sunDir = (B === 'dish' ? new THREE.Vector3(-1.0, 0.22, 0.35) : new THREE.Vector3(1.0, 0.19, 0.42)).normalize();
if (!GLOW) {
  const sun = new THREE.DirectionalLight(0xFFCFA6, 2.6);
  sun.position.copy(sunDir).multiplyScalar(120);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  const s = sun.shadow.camera; s.left = -130; s.right = 130; s.top = 60; s.bottom = -60; s.near = 1; s.far = 400;
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; sun.shadow.radius = 3;
  scene.add(sun);
  scene.add(new THREE.HemisphereLight(0xB4CBEE, 0xF3DCE4, 0.6));
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.12;
}
// procedural stucco: fine noise used as bump + subtle colour variation
const stucco = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
  const id = x.createImageData(512, 512);
  let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 512 * 512; i++) { const v = 200 + (r() + r() + r() - 1.5) * 40; id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; }
  x.putImageData(id, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6, 6); return t;
})();

const mats = {};
function M(color, opts = {}) {
  if (GLOW) return new THREE.MeshBasicMaterial({ color: 0x000000, ...('map' in opts ? { map: null } : {}) });
  return new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0, bumpMap: stucco, bumpScale: 0.6, ...opts });
}
const interior = (() => {
  const c = document.createElement('canvas'); c.width = 256; c.height = 448; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 448); g.addColorStop(0, '#2E3B63'); g.addColorStop(0.6, '#4A4F78'); g.addColorStop(1, '#6B5C7E');
  x.fillStyle = g; x.fillRect(0, 0, 256, 448);
  const lg = x.createRadialGradient(128, 150, 4, 128, 150, 120); lg.addColorStop(0, 'rgba(255,214,160,0.95)'); lg.addColorStop(1, 'rgba(255,214,160,0)');
  x.fillStyle = lg; x.fillRect(0, 0, 256, 448);
  x.fillStyle = '#F7E3C8'; x.beginPath(); x.ellipse(128, 120, 26, 14, 0, 0, Math.PI * 2); x.fill(); // lamp shade
  x.fillRect(127, 0, 2, 110);
  for (const side of [0, 1]) { // pleated curtains
    for (let i = 0; i < 9; i++) { x.fillStyle = i % 2 ? '#E79FB1' : '#D98CA0'; const cx = side ? 256 - 70 + i * 8 : i * 8; x.fillRect(cx, 0, 8, 448); }
  }
  x.fillStyle = '#E79FB1'; x.fillRect(0, 0, 256, 34); x.fillStyle = '#FBF7F2'; for (let i = 0; i < 16; i++) { x.beginPath(); x.arc(8 + i * 16, 34, 7, 0, Math.PI); x.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
function E(color, intensity = 1) { // emissive things (windows, sign) - glow pass shows them, day pass shows them dim
  if (GLOW) return new THREE.MeshBasicMaterial({ map: interior, color: new THREE.Color(0xFFE2C0).multiplyScalar(intensity * 1.1) });
  return new THREE.MeshStandardMaterial({ map: interior, color: 0xB8C2DA, roughness: 0.18, metalness: 0.0, envMapIntensity: 2.5 });
}
function add(geo, mat, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
const box = (w, h, d, r = 0.04) => new RoundedBoxGeometry(w, h, d, 3, r);

// shadow catcher ground
if (!GLOW) {
  const g = new THREE.Mesh(new THREE.PlaneGeometry(260, 90), new THREE.ShadowMaterial({ color: 0x3A4A86, opacity: 0.42 }));
  g.rotation.x = -Math.PI / 2; g.position.z = 15; g.receiveShadow = true; scene.add(g);
}

// soft snow drift along a footprint (flattened spheres)
function drift(x0, x1, z, depth = 1.2) {
  const mat = M(C.snow, { roughness: 1 });
  const len = x1 - x0;
  const m = add(new THREE.CapsuleGeometry(1, len, 8, 32), mat, (x0 + x1) / 2, 0, z);
  m.rotation.z = Math.PI / 2; m.scale.set(0.22, 1, depth * 0.7);
}

function textTexture(text, { font = '500 200px Jost', color = '#22304F', spacing = 0.32, pad = 40, bg = null, glow = false } = {}) {
  const c = document.createElement('canvas'); const x = c.getContext('2d');
  x.font = font; const size = parseInt(font.match(/(\d+)px/)[1]);
  const chars = [...text]; const sp = size * spacing;
  const widths = chars.map(ch => x.measureText(ch).width);
  const tw = widths.reduce((a, b) => a + b, 0) + sp * (chars.length - 1);
  c.width = Math.ceil(tw + pad * 2); c.height = Math.ceil(size * 1.25 + pad * 2);
  if (bg) { x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height); }
  x.font = font; x.textBaseline = 'middle'; x.fillStyle = color;
  if (glow) { x.shadowColor = color; x.shadowBlur = size * 0.12; }
  let cx = pad; chars.forEach((ch, i) => { x.fillText(ch, cx, c.height / 2 + size * 0.04); cx += widths[i] + sp; });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return { tex: t, aspect: c.width / c.height };
}
async function imageTexture(url, size = 1024, bg = null, padFrac = 0) {
  const img = new Image(); img.src = url; await img.decode();
  const c = document.createElement('canvas'); const ar = (img.naturalWidth || size) / (img.naturalHeight || size);
  c.width = size; c.height = Math.round(size / ar);
  const x = c.getContext('2d'); if (bg) { x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height); }
  const p = padFrac * c.width; x.drawImage(img, p, p * c.height / c.width, c.width - 2 * p, c.height - 2 * p * c.height / c.width);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return { tex: t, aspect: c.width / c.height };
}
function signPlane(texInfo, height, x, y, z, { emissive = 0, glowColor = 0xffffff, layers = 1, parent = scene } = {}) {
  const w = height * texInfo.aspect;
  for (let i = 0; i < layers; i++) {
    let mat;
    if (GLOW) mat = emissive ? new THREE.MeshBasicMaterial({ map: texInfo.tex, transparent: true, color: new THREE.Color(glowColor).multiplyScalar(emissive), alphaTest: 0.4 })
                          : new THREE.MeshBasicMaterial({ color: 0, map: texInfo.tex, alphaTest: 0.4, transparent: true });
    else mat = new THREE.MeshStandardMaterial({ map: texInfo.tex, transparent: true, alphaTest: 0.4, roughness: 0.6,
      color: i === layers - 1 ? 0xffffff : 0xb9a6ad, side: THREE.DoubleSide });
    const m = add(new THREE.PlaneGeometry(w, height), mat, x, y, z - (layers - 1 - i) * 0.05, parent);
    m.castShadow = i === 0; m.receiveShadow = false;
  }
}

// window: frame + glass (+ glow)
function windowAt(x, y, z, w, h, frame = C.sky, arch = false, parent = scene) {
  add(box(w + 0.36, h + 0.36, 0.22, 0.06), M(frame), x, y, z, parent);
  add(new THREE.PlaneGeometry(w, h), E(C.warm, 1.15), x, y, z + 0.12, parent);
  add(box(w + 0.2, 0.12, 0.08, 0.02), M(frame), x, y, z + 0.16, parent); // transom
  add(box(0.08, h, 0.08, 0.02), M(frame), x, y, z + 0.16, parent);
  add(box(w + 0.6, 0.16, 0.5, 0.05), M(C.white), x, y - h / 2 - 0.26, z + 0.2, parent); // sill
}

async function buildMain() {
  const L = 11, Hh = 3.8, D = 7, R = 3.5;
  const pink = M(C.flamingo), white = M(C.white), mint = M(C.mint);
  // body with rounded (streamline) ends
  add(box(2 * L - 2 * R + 0.02, Hh, D, 0.05), pink, 0, Hh / 2, 0);
  for (const s of [-1, 1]) {
    const cyl = add(new THREE.CylinderGeometry(R, R, Hh, 64, 1, false, s < 0 ? Math.PI : 0, Math.PI), pink, s * (L - R), Hh / 2, 0);
    cyl.scale.z = D / (2 * R);
    // speed lines on the round ends
    for (let k = 0; k < 3; k++) {
      const t = add(new THREE.TorusGeometry(R + 0.02, 0.07, 8, 64, Math.PI), white, s * (L - R), 1.2 + k * 0.42, 0);
      t.rotation.x = Math.PI / 2; t.rotation.z = s < 0 ? Math.PI / 2 : -Math.PI / 2; t.scale.y = D / (2 * R);
    }
  }
  // plinth
  add(box(2 * L + 0.6, 0.38, D + 0.6, 0.06), white, 0, 0.19, 0);
  // roof slab with overhang + snow cap
  const roof = add(box(2 * L + 1.8, 0.42, D + 2.2, 0.12), white, 0, Hh + 0.21, 0.3);
  const snowCap = add(box(2 * L + 1.5, 0.36, D + 1.9, 0.18), M(C.snow, { roughness: 1 }), 0, Hh + 0.55, 0.3);
  // pink band under the roof
  add(box(2 * L - 2 * R, 0.18, 0.1, 0.02), white, 0, Hh - 0.35, D / 2 + 0.05);

  // central entrance tower (mint), taller, with stepped deco top
  const tw = 5.2, th = 6.2;
  add(box(tw, th, D * 0.7, 0.06), mint, 0, th / 2, D * 0.18);
  add(box(tw - 0.9, 0.5, D * 0.7 + 0.2, 0.06), mint, 0, th + 0.25, D * 0.18);
  add(box(tw - 1.9, 0.5, D * 0.7 + 0.1, 0.06), mint, 0, th + 0.75, D * 0.18);
  add(box(tw - 0.6, 0.2, D * 0.72, 0.06), M(C.snow), 0, th + 0.12, D * 0.18 + 0.02);
  // three vertical fins
  for (const fx of [-1.25, 0, 1.25]) add(box(0.22, 2.4, 0.3, 0.06), white, fx, th - 1.6, D * 0.18 + D * 0.35 + 0.1);
  // eyebrow canopy
  add(box(tw + 1.4, 0.24, 1.7, 0.08), white, 0, 3.15, D * 0.18 + D * 0.35 + 0.8);
  // door (white double door with fanlight)
  const zf = D * 0.18 + D * 0.35 + 0.02;
  add(box(2.3, 2.9, 0.16, 0.04), white, 0, 0.38 + 1.45, zf + 0.05);
  add(box(0.06, 2.6, 0.06, 0.02), M(C.ink), 0, 0.38 + 1.4, zf + 0.16);
  for (const dx of [-0.55, 0.55]) add(new THREE.CircleGeometry(0.06, 16), M(0xD9B26A, { metalness: 0.6, roughness: 0.3 }), dx * 0.25, 1.75, zf + 0.15);
  // round deco window above the canopy
  add(new THREE.TorusGeometry(0.85, 0.12, 12, 48), white, 0, 4.35, zf + 0.06);
  add(new THREE.CircleGeometry(0.8, 48), E(C.warm, 1.25), 0, 4.35, zf + 0.04);
  // steps
  for (let i = 0; i < 3; i++) add(box(3.2 + i * 0.8, 0.18, 0.7 + i * 0.6, 0.04), white, 0, 0.09 + (2 - i) * 0.18, zf + 0.45 + i * 0.3);

  // façade windows, perfectly symmetric
  for (const s of [-1, 1]) for (let i = 0; i < 3; i++) windowAt(s * (3.7 + i * 1.75), 2.05, D / 2 + 0.02, 1.05, 1.9, C.sky);
  // rooftop sign: ALBRETSEN in spaced capitals on slender posts
  await document.fonts.load('500 200px Jost');
  const t = textTexture('ALBRETSEN', { font: '500 200px Jost', color: GLOW ? '#FFFFFF' : '#22304F', spacing: 0.34, pad: 30 });
  const signH = 1.15, signY = th + 1.0 + 0.2 + signH / 2 + 0.55;
  signPlane(t, signH, 0, signY, D * 0.18 + 0.4, { emissive: 2.4, glowColor: 0xFF9DB8, layers: 4 });
  const signW = signH * t.aspect;
  for (const px of [-signW * 0.38, -signW * 0.13, signW * 0.13, signW * 0.38]) add(new THREE.CylinderGeometry(0.05, 0.05, signY - th - 0.4, 8), M(C.ink), px, (signY + th + 0.4) / 2 - 0.3, D * 0.18 + 0.2);

  // two clipped conifers in round pots, symmetric
  for (const s of [-1, 1]) {
    add(new THREE.CylinderGeometry(0.6, 0.48, 0.8, 32), white, s * 9.3, 0.4, D / 2 + 2.2);
    add(new THREE.ConeGeometry(0.75, 2.8, 32), M(0x2F5D4E, { roughness: 1 }), s * 9.3, 0.8 + 1.4, D / 2 + 2.2);
    add(new THREE.ConeGeometry(0.42, 0.5, 32), M(C.snow), s * 9.3, 3.05, D / 2 + 2.2);
  }
  // lamp posts (globe), symmetric
  for (const s of [-1, 1]) {
    add(new THREE.CylinderGeometry(0.06, 0.08, 2.6, 12), M(C.ink), s * 2.4, 1.3, D / 2 + 3.6);
    add(new THREE.SphereGeometry(0.28, 24, 16), GLOW ? new THREE.MeshBasicMaterial({ color: new THREE.Color(C.warm).multiplyScalar(1.6) }) : M(0xFFF4E6, { roughness: 0.3 }), s * 2.4, 2.75, D / 2 + 3.6);
  }
  drift(-L - 0.5, L + 0.5, D / 2 + 0.5, 1.0);
  drift(-L, L, -D / 2 - 0.4, 1.0);
}

async function buildDish() {
  // a pastel ground station: parabolic dish on a stepped deco plinth, perfectly centred
  const pink = M(C.flamingo), white = M(C.white), mint = M(C.mint), ink = M(C.ink);
  add(box(9, 0.5, 9, 0.08), white, 0, 0.25, 0);
  add(box(7, 0.6, 7, 0.08), mint, 0, 0.8, 0);
  add(box(5, 0.6, 5, 0.08), mint, 0, 1.4, 0);
  add(new THREE.CylinderGeometry(0.9, 1.3, 4.2, 48), white, 0, 1.7 + 2.1, 0);
  for (let k = 0; k < 3; k++) add(new THREE.TorusGeometry(1.0 + k * 0.1, 0.06, 8, 48), pink, 0, 2.4 + k * 0.45, 0).rotation.x = Math.PI / 2;
  const yoke = new THREE.Group(); yoke.position.set(0, 6.2, 0); scene.add(yoke);
  for (const s of [-1, 1]) add(box(0.4, 1.6, 0.9, 0.08), white, s * 1.6, -0.2, -1.4, yoke);
  add(box(3.6, 0.5, 1.0, 0.08), white, 0, -0.8, -1.2, yoke);
  const dish = new THREE.Group(); dish.position.set(0, 1.4, 0); dish.rotation.x = 0.62; yoke.add(dish);
  const pts = []; const Rr = 5.2, depth = 1.5;
  for (let i = 0; i <= 40; i++) { const r = Rr * i / 40; pts.push(new THREE.Vector2(r, depth * (r / Rr) ** 2)); }
  const geo = new THREE.LatheGeometry(pts, 96);
  const inner = new THREE.MeshStandardMaterial({ color: C.white, roughness: 0.7, side: THREE.BackSide, bumpMap: stucco, bumpScale: 0.3 });
  const outer = new THREE.MeshStandardMaterial({ color: C.flamingo, roughness: 0.85, side: THREE.FrontSide, bumpMap: stucco, bumpScale: 0.3 });
  const d1 = add(geo, GLOW ? M(0) : inner, 0, 0, 0, dish); d1.rotation.x = Math.PI / 2 * 0 ;
  const d2 = add(geo, GLOW ? M(0) : outer, 0, 0, 0, dish);
  // orient the bowl so it opens toward +y in dish space, then the dish tilts toward the sky
  d1.rotation.x = 0; d2.rotation.x = 0;
  add(new THREE.TorusGeometry(Rr, 0.12, 12, 96), white, 0, depth, 0, dish).rotation.x = Math.PI / 2;
  // feed horn on a tripod
  for (let k = 0; k < 3; k++) {
    const a = k / 3 * Math.PI * 2 + Math.PI / 2; const x = Math.cos(a) * Rr * 0.92, z = Math.sin(a) * Rr * 0.92;
    const leg = new THREE.Vector3(-x, 4.2 - depth, -z); const len = leg.length();
    const m = add(new THREE.CylinderGeometry(0.06, 0.06, len, 8), ink, x / 2, depth + (4.2 - depth) / 2, z / 2, dish);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), leg.clone().normalize());
  }
  add(new THREE.CylinderGeometry(0.25, 0.45, 0.9, 24), mint, 0, 4.4, 0, dish);
  add(new THREE.SphereGeometry(0.26, 16, 12), GLOW ? new THREE.MeshBasicMaterial({ color: new THREE.Color(0xFF9DB8).multiplyScalar(2) }) : M(0xFFE2EA, { roughness: 0.3 }), 0, 4.95, 0, dish);
  // two small symmetric huts
  for (const s of [-1, 1]) {
    add(box(3.2, 2.6, 2.8, 0.06), M(C.shell), s * 9, 1.3, 1.5);
    add(box(3.8, 0.24, 3.4, 0.06), white, s * 9, 2.72, 1.6);
    add(box(3.6, 0.22, 3.2, 0.1), M(C.snow, { roughness: 1 }), s * 9, 2.92, 1.6);
    add(box(0.9, 1.7, 0.1, 0.03), mint, s * 9, 0.85, 2.95);
    add(new THREE.PlaneGeometry(0.7, 0.5), E(C.warm, 1.2), s * 9 + s * -1.0, 1.7, 2.92);
  }
  drift(-5, 5, 4.6, 0.8);
}

async function kiosk(kind) {
  // small symmetric product buildings, each its own pastel and shape
  const white = M(C.white), snow = M(C.snow, { roughness: 1 });
  const spec = {
    'mcp-emails': { col: C.sky, trim: C.white, w: 7, h: 4.2, logo: '../../../_shared/products/mcp-emails/logo-wordmark.svg', logoBg: '#FFFFFF', logoH: 0.95, logoPad: 0.04 },
    'fun-libs': { col: C.flamingo, trim: C.white, w: 6, h: 4.6, logo: '../../../_shared/products/fun-libs/icon.png', logoH: 1.7 },
    'toolrails': { col: C.mint, trim: C.white, w: 7.4, h: 3.8, logo: '../../../_shared/products/toolrails/icon.svg', logoH: 1.5 },
    'harbor': { col: C.cream, trim: C.flamingo, w: 6.6, h: 4.0, logo: '../../../_shared/products/harbor/harbor-wordmark.svg', logoBg: '#FBF9F4', logoH: 0.8, logoPad: 0.02, inkSvg: true },
  }[kind];
  const body = M(spec.col), trim = M(spec.trim);
  const { w, h } = spec, d = 4.2;
  add(box(w + 0.5, 0.3, d + 0.5, 0.05), white, 0, 0.15, 0);
  add(box(w, h, d, 0.05), body, 0, h / 2 + 0.3, 0);
  if (kind === 'fun-libs') {
    // stepped deco parapet + striped awning
    add(box(w * 0.7, 0.8, d * 0.9, 0.06), body, 0, h + 0.3 + 0.4, 0);
    add(box(w * 0.4, 0.6, d * 0.8, 0.06), body, 0, h + 0.3 + 1.1, 0);
    for (let i = 0; i < 9; i++) add(box(w / 9 - 0.02, 0.12, 1.5, 0.02), M(i % 2 ? C.white : C.flamingo), -w / 2 + (i + 0.5) * w / 9, 2.9, d / 2 + 0.7).rotation.x = 0.35;
  } else if (kind === 'mcp-emails') {
    // rounded deco corners via cylinders + flat roof
    for (const s of [-1, 1]) add(new THREE.CylinderGeometry(0.6, 0.6, h, 32), body, s * w / 2, h / 2 + 0.3, d / 2 - 0.6);
    add(box(w + 1.2, 0.3, d + 1, 0.08), trim, 0, h + 0.45, 0.2);
    add(box(w + 1, 0.3, d + 0.8, 0.14), snow, 0, h + 0.72, 0.2);
  } else if (kind === 'toolrails') {
    // ranch-modern: long low flat roof with deep overhang + clerestory
    add(box(w + 2.4, 0.26, d + 2.2, 0.08), trim, 0, h + 0.43, 0.6);
    add(box(w + 2.2, 0.28, d + 2, 0.14), snow, 0, h + 0.7, 0.6);
    for (const s of [-1, 1]) add(box(0.22, h, 0.22, 0.04), trim, s * (w / 2 + 1), h / 2 + 0.3, d / 2 + 1.5);
  } else if (kind === 'harbor') {
    // simple gable (ranch house) with pink trim
    const roof = new THREE.Shape(); roof.moveTo(-w / 2 - 0.5, 0); roof.lineTo(0, 1.9); roof.lineTo(w / 2 + 0.5, 0); roof.lineTo(-w / 2 - 0.5, 0);
    const rg = new THREE.ExtrudeGeometry(roof, { depth: d + 0.6, bevelEnabled: false }); rg.translate(0, 0, -(d + 0.6) / 2);
    add(rg, trim, 0, h + 0.3, 0);
    const rs = new THREE.Shape(); rs.moveTo(-w / 2 - 0.45, 0.15); rs.lineTo(0, 2.0); rs.lineTo(w / 2 + 0.45, 0.15); rs.lineTo(w / 2 + 0.3, 0.05); rs.lineTo(0, 1.82); rs.lineTo(-w / 2 - 0.3, 0.05);
    const sg = new THREE.ExtrudeGeometry(rs, { depth: d + 0.4, bevelEnabled: false }); sg.translate(0, 0, -(d + 0.4) / 2);
    add(sg, snow, 0, h + 0.3 + 0.04, 0);
  }
  // door
  add(box(1.3, 2.3, 0.14, 0.03), M(kind === 'fun-libs' ? C.mint : C.white), 0, 0.3 + 1.15, d / 2 + 0.04);
  for (const s of [-1, 1]) windowAt(s * (w / 2 - 1.35), 1.85, d / 2 + 0.02, 1.0, 1.4, kind === 'toolrails' ? C.white : (kind === 'harbor' ? C.sky : C.white));
  // the real product logo on a sign
  const tex = await imageTexture(spec.logo, 1024, spec.logoBg || null, spec.logoPad || 0);
  const sy = kind === 'harbor' ? h - 0.35 : (kind === 'fun-libs' ? h + 0.3 + 0.45 + 0.4 : h - 0.35);
  const sw = spec.logoH * tex.aspect;
  if (kind === 'harbor' || kind === 'mcp-emails') add(box(sw + 0.3, spec.logoH + 0.3, 0.12, 0.05), M(kind === 'harbor' ? C.ink : C.white), 0, sy, d / 2 + 0.12);
  const signMat = GLOW ? new THREE.MeshBasicMaterial({ map: tex.tex, transparent: true, color: new THREE.Color(0xffffff).multiplyScalar(0.42) })
                       : new THREE.MeshStandardMaterial({ map: tex.tex, transparent: true, roughness: 0.5 });
  const sign = add(new THREE.PlaneGeometry(sw, spec.logoH), signMat, 0, sy, d / 2 + 0.2);
  sign.castShadow = false;
  if (kind === 'harbor') { // harbor svg uses currentColor (black) -> sits on a cream panel
    sign.position.z = d / 2 + 0.2;
  }
  // two potted cones
  for (const s of [-1, 1]) {
    add(new THREE.CylinderGeometry(0.35, 0.28, 0.5, 24), white, s * (w / 2 + 0.2), 0.25, d / 2 + 1.4);
    add(new THREE.ConeGeometry(0.42, 1.5, 24), M(0x2F5D4E, { roughness: 1 }), s * (w / 2 + 0.2), 1.2, d / 2 + 1.4);
  }
  drift(-w / 2 - 0.4, w / 2 + 0.4, d / 2 + 0.4, 0.8);
}

(async () => {
  if (B === 'main') await buildMain(); else if (B === 'dish') await buildDish(); else await kiosk(B);
  if (GLOW) renderer.render(scene, camera);
  else {
    const composer = new EffectComposer(renderer);
    composer.setPixelRatio(1); composer.setSize(W, H);
    composer.addPass(new RenderPass(scene, camera));
    const ao = new GTAOPass(scene, camera, W, H);
    ao.updateGtaoMaterial({ radius: 1.2, distanceExponent: 1.4, thickness: 1.5, scale: 1.2, samples: 24 });
    ao.blendIntensity = 0.85;
    composer.addPass(ao);
    composer.addPass(new OutputPass());
    composer.render();
  }
  document.title = 'done';
  window.__done = true;
})();
</script>
