  <defs>
    <clipPath id="hd-above"><rect x="0" y="0" width="960" height="32"/></clipPath>
  </defs>
  <path d="M0 32 H404 M556 32 H960" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
