  <path d="M260 43.5 H404 M556 43.5 H700" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".3"/>
  <circle cx="480" cy="32" r="22" fill="#f6b48f" clip-path="url(#hd-above)"/>
  <path d="M424 32 H536" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M440 38 H520 M456 43.5 H504" stroke="#f6b48f" stroke-width="2" stroke-linecap="round"/>
