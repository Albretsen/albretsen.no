<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peach Hour diorama</title>
<link rel="icon" href="identity/favicon.svg">
<style>
  @font-face { font-family: Nunito; src: url(fonts/nunito-latin-var.woff2) format("woff2"); font-weight: 200 1000; font-display: swap; }
  html, body { margin: 0; height: 100%; background: #F9DCC4; font-family: Nunito, ui-rounded, system-ui, sans-serif; color: #4E3A57; }
  .stage { position: fixed; inset: 0; }
  .poster, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  canvas { opacity: 0; transition: opacity 900ms cubic-bezier(.22,.61,.25,1); outline: none; }
  canvas.ready { opacity: 1; }
  .ui { position: fixed; left: 16px; right: 16px; bottom: 20px; display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .pill { background: rgb(255 248 239 / .78); backdrop-filter: blur(10px); border-radius: 999px; padding: 10px 18px; display: flex; gap: 12px; align-items: center; font-weight: 650; font-size: 14px; }
  input[type=range] { accent-color: #D9805C; width: min(320px, 50vw); }
  select { font: inherit; border: 0; background: transparent; color: inherit; }
  .hint { position: fixed; top: 18px; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
</style>
</head><body>
<div class="stage">
  <picture>
    <source type="image/avif" srcset="img/hero-dawn-960.avif 960w, img/hero-dawn-1600.avif 1600w, img/hero-dawn-2560.avif 2560w">
    <img class="poster" src="img/hero-dawn-1600.jpg" width="2560" height="1440" alt="">
  </picture>
  <canvas id="c" aria-label="Miniature hill village. Drag to turn it, drag the sun to change the time of day." tabindex="0"></canvas>
</div>
<p class="hint">Drag to turn &middot; drag the sun</p>
<div class="ui">
  <label class="pill">Sunrise <input id="t" type="range" min="0" max="1" step="0.001" value="0.12"> Sunset</label>
  <label class="pill">Scene
    <select id="scene">
      <option value="village">Village</option>
      <option value="vignette:mcp-emails">MCP Emails</option>
      <option value="vignette:fun-libs">Fun Libs</option>
      <option value="vignette:toolrails">Toolrails</option>
      <option value="vignette:harbor">Harbor</option>
    </select></label>
</div>
<script type="module">
  import { createDiorama } from './diorama.js'
  let canvas = document.getElementById('c'); const slider = document.getElementById('t'), sel = document.getElementById('scene')
  let d
  async function boot(scene) {
    if (d) d.dispose()
    const fresh = canvas.cloneNode(); canvas.replaceWith(fresh); canvas = fresh
    const id = scene.startsWith('vignette:') ? scene.slice(9) : null
    d = await createDiorama({ canvas: fresh, scene, view: id ? 'v:' + id : (innerWidth < innerHeight ? 'portrait' : 'hero'),
      time: +slider.value, autoTurn: 0.035, onTime: (t) => { slider.value = t } })
    requestAnimationFrame(() => fresh.classList.add('ready'))
    onresize = () => d.resize(innerWidth, innerHeight)
    d.resize(innerWidth, innerHeight)
    window.diorama = d
  }
  slider.addEventListener('input', () => d && d.setTime(+slider.value))
  sel.addEventListener('change', () => boot(sel.value))
  // canvas fills the stage: give createDiorama the layout size
  canvas.style.width = '100%'; canvas.style.height = '100%'
  // defer 3D until after first paint
  'requestIdleCallback' in window ? requestIdleCallback(() => boot('village')) : setTimeout(() => boot('village'), 200)
</script>
</body></html>
