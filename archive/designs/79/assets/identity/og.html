<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Graph source</title>
<!-- Source for identity/og.jpg (1200x630). Baked with scripts/shot.sh at 1200x630. -->
<style>
  @font-face { font-family: 'Instrument Serif'; src: url(../fonts/instrument-serif-regular.woff2) format('woff2'); }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url(../fonts/instrument-serif-italic.woff2) format('woff2'); }
  @font-face { font-family: 'Schibsted Grotesk'; src: url(../fonts/schibsted-grotesk-vf.woff2) format('woff2'); font-weight: 400 900; }
  html, body { margin: 0; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #0C1A2B; color: #F4EBDD; }
  .og img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 66%; }
  .og::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,26,43,.25), rgba(12,26,43,0) 45%); }
  .name { position: absolute; left: 0; right: 0; top: 70px; text-align: center; font: 400 168px/.9 'Instrument Serif', serif; letter-spacing: -.015em; z-index: 1; }
  .line { position: absolute; left: 0; right: 0; top: 262px; text-align: center; font: italic 400 38px/1 'Instrument Serif', serif; opacity: .92; z-index: 1; }
  .foot { position: absolute; left: 48px; right: 48px; bottom: 34px; display: flex; justify-content: space-between; align-items: center; font: 500 15px/1 'Schibsted Grotesk', sans-serif; letter-spacing: .22em; text-transform: uppercase; z-index: 1; }
  .foot img { width: 44px; height: 44px; }
</style>
</head>
<body>
<div class="og">
  <img class="bg" src="../hero/first-light-sunrise-1920.webp" alt="">
  <div class="name">Albretsen</div>
  <div class="line">software that pays for itself</div>
  <div class="foot"><img src="mark.svg" alt=""><span>albretsen.no</span></div>
</div>
</body>
</html>
