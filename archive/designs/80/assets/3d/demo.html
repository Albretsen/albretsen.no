<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pavilion, live</title>
<link rel="icon" href="../identity/favicon.svg">
<link rel="stylesheet" href="../tokens.css">
<style>
  html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font-family:var(--font-text)}
  .stage{position:fixed;inset:0}
  .stage img,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .stage canvas{opacity:0;transition:opacity 1.2s var(--ease-settle)}
  .stage.live canvas{opacity:1}
  .ui{position:fixed;left:50%;bottom:24px;translate:-50% 0;display:flex;gap:6px;align-items:center;background:color-mix(in oklch,var(--cream) 88%,transparent);
      backdrop-filter:blur(8px);padding:8px 10px;border:1px solid color-mix(in oklch,var(--zinc) 50%,transparent);border-radius:2px;max-width:calc(100% - 32px);box-sizing:border-box;flex-wrap:wrap;justify-content:center}
  .ui button{font:600 11px var(--font-poster);letter-spacing:.22em;text-transform:uppercase;background:none;border:0;color:var(--zinc-deep);padding:8px 10px;cursor:pointer}
  .ui button[aria-pressed=true]{color:var(--cafe)}
  .ui input{width:180px;accent-color:var(--cafe)}
  .hint{position:fixed;top:20px;left:20px;font:600 11px var(--font-poster);letter-spacing:.28em;text-transform:uppercase;color:var(--zinc-deep)}
</style></head>
<body>
<div class="stage" id="stage">
  <picture>
    <source type="image/avif" srcset="../hero/hero-morning-960.avif 960w, ../hero/hero-morning-1600.avif 1600w, ../hero/hero-morning-2400.avif 2400w">
    <img src="../hero/hero-morning-1600.jpg" width="1600" height="900" alt="A cream deco pavilion with a stepped tower on a golden bluff above the sea, pastel morning light">
  </picture>
  <canvas id="c" aria-label="Live 3D pavilion. Click the sun three times, or press N."></canvas>
</div>
<div class="hint">Pavilion Light / live three.js scene</div>
<div class="ui" role="group" aria-label="Time of day">
  <input id="t" type="range" min="0" max="1" step="0.001" value="0.3" aria-label="Time of day">
  <button data-t="0.03">First light</button><button data-t="0.3" aria-pressed="true">Morning</button><button data-t="0.5">Noon</button>
  <button data-t="0.76">Golden</button><button data-t="0.95">Sunset</button>
  <button data-view="front">Front</button><button data-view="terrace">Terrace</button>
</div>
<script type="module">
  // The still paints first; the live scene fades in over it once ready (zero layout shift).
  const stage = document.getElementById('stage'), c = document.getElementById('c'), r = document.getElementById('t')
  const { createPavilion } = await import('./pavilion.js')
  const p = await createPavilion(c, { time: +r.value, width: innerWidth, height: innerHeight })
  stage.classList.add('live')
  addEventListener('resize', () => p.resize(innerWidth, innerHeight))
  let target = +r.value, cur = target
  const ease = () => { cur += (target - cur) * 0.08; p.setTime(cur); if (Math.abs(target - cur) > 1e-4) requestAnimationFrame(ease) }
  r.addEventListener('input', () => { target = +r.value; ease() })
  document.querySelectorAll('[data-t]').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('[data-t]').forEach((x) => x.setAttribute('aria-pressed', x === b)); target = +b.dataset.t; r.value = target; ease()
  }))
  document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => p.setView(b.dataset.view)))
  if (new URLSearchParams(location.search).get('night')) p.setNight(true)
</script>
</body></html>
