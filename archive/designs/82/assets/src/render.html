<!doctype html>
<!--
  Q.E.D. offline renderer (design 82).
  A single GLSL ray-marcher that bakes the hero stills and product plates.
  Rendered in headless Chrome (SwiftShader) strip by strip, then screenshotted.
  Params: ?scene=fracture|gravity|tile&w=2400&h=1350&ss=2&logo=../products/_tex/x.png&hour=0..3
-->
<html><head><meta charset="utf-8"><title>render</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
const P = new URLSearchParams(location.search);
const W = +(P.get('w')||1440), H = +(P.get('h')||810), SS = +(P.get('ss')||1);
const SCENE = {fracture:0, gravity:1, tile:2}[P.get('scene')||'fracture'];
const HOUR = +(P.get('hour')||0);
const cv = document.getElementById('c'); cv.width=W; cv.height=H; cv.style.width=W+'px'; cv.style.height=H+'px';
const gl = cv.getContext('webgl2',{preserveDrawingBuffer:true,antialias:false});

const VS = `#version 300 es
in vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }`;

const FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform int uScene; uniform int uSS; uniform sampler2D uLogo; uniform float uHasLogo; uniform float uHour;
out vec4 o;
#define PI 3.14159265

float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float h31(vec3 p){ p=fract(p*0.3183099+.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vn(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
  return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=.5,s=0.; for(int i=0;i<5;i++){ s+=a*vn(p); p*=2.03; a*=.5;} return s; }
mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
float sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.); }
float sdRBox(vec3 p, vec3 b, float r){ vec3 q=abs(p)-b+r; return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r; }

// =================================================================== FRACTURE
const vec3 SUNF = normalize(vec3(0.0, 0.085, 1.0));
float crackX(float y){
  float x = 0.11*sin(y*1.7+0.4) + 0.05*sin(y*4.9+1.3) + 0.018*sin(y*12.7+.2);
  x += 0.16*(abs(fract(y*0.62+0.18)*2.0-1.0)-0.5);
  return x - 0.05;
}
float crackW(float y){ return 0.010 + 0.075*pow(smoothstep(2.2,0.0,y),1.6) + 0.006*smoothstep(3.2,4.4,y); }
float monoD(vec3 p){
  vec3 c=vec3(0.0,2.25,1.6);
  float box = sdRBox(p-c, vec3(1.45,2.25,0.24), 0.012);
  float cr = (abs(p.x - crackX(p.y)) - crackW(p.y))*0.6;
  return max(box, -cr);
}
float shardD(vec3 p){
  float d=1e9;
  for(int i=0;i<4;i++){
    float fi=float(i);
    vec3 c = vec3(crackX(2.6+fi*0.5)+0.18*sin(fi*2.3+1.), 2.15+fi*0.62, 0.95-0.32*fi);
    vec3 q=p-c; q.xy*=rot(fi*1.7+.4); q.yz*=rot(fi*0.9+.2); q.xz*=rot(fi*2.1);
    float s=0.035+0.022*mod(fi*1.618,1.0);
    float b=sdBox(q, vec3(s*1.6,s*0.35,s));
    b=max(b, dot(q,normalize(vec3(1,1,0.3)))-s*0.6);
    d=min(d,b);
  }
  return d;
}
float mapF(vec3 p, out int m){
  float a=monoD(p), b=shardD(p); m=1; float d=a;
  if(b<d){d=b;m=2;}
  return d;
}
float mapF0(vec3 p){ int m; return mapF(p,m); }
vec3 nrmF(vec3 p){ vec2 e=vec2(0.0007,0); return normalize(vec3(mapF0(p+e.xyy)-mapF0(p-e.xyy),mapF0(p+e.yxy)-mapF0(p-e.yxy),mapF0(p+e.yyx)-mapF0(p-e.yyx))); }
float shadowF(vec3 ro, vec3 rd, float k){
  float res=1., t=0.01;
  for(int i=0;i<64;i++){ float h=mapF0(ro+rd*t); res=min(res,k*h/t); t+=clamp(h,0.004,0.25); if(res<0.002||t>8.) break; }
  return clamp(res,0.,1.);
}
float hardShadowF(vec3 ro){ // cheap visibility for volumetrics
  float t=0.02;
  for(int i=0;i<44;i++){ float h=mapF0(ro+SUNF*t); if(h<0.002) return 0.; t+=max(h,0.03); if(t>16.) break; }
  return 1.;
}
vec3 skyF(vec3 d){
  float h=d.y;
  float side=smoothstep(-0.2,0.6,d.z);
  vec3 top=vec3(0.006,0.006,0.007);
  vec3 band=vec3(1.0,0.36,0.045);
  float g=exp(-max(h,0.)*16.);
  vec3 c=mix(top, band*0.9, g*side);
  c=mix(c, vec3(1.0,0.62,0.22)*1.7, exp(-max(h,0.)*70.)*0.85*side);
  float sd=max(dot(d,SUNF),0.);
  c+=vec3(1.0,0.48,0.10)*pow(sd,36.)*1.3*side + vec3(1.0,0.72,0.38)*pow(sd,180.)*5. + vec3(1.0,0.93,0.8)*pow(sd,3000.)*60.;
  // faint high cloud bands
  float cl=fbm(vec3(d.x*3.,d.y*28.,1.7));
  c+=vec3(1.0,0.5,0.15)*smoothstep(0.55,0.8,cl)*exp(-max(h,0.)*12.)*0.25;
  return c;
}
vec3 shadeObjF(vec3 p, vec3 rd, int m){
  vec3 n=nrmF(p);
  float sh=shadowF(p+n*0.003, SUNF, 24.);
  float dif=max(dot(n,SUNF),0.);
  vec3 sunC=vec3(1.0,0.56,0.2)*9.0;
  vec3 alb = (m==2)? vec3(0.06): vec3(0.018);
  // fine stone grain on the monolith
  float gr=fbm(p*vec3(9.,40.,9.));
  alb*=0.75+0.5*gr;
  vec3 col = alb*sunC*dif*sh;
  // inside of the fracture: the dawn pours in, light bounces between the walls
  float inCrack = smoothstep(0.03,0.0, abs(p.x-crackX(p.y))-crackW(p.y)-0.002);
  col += vec3(1.0,0.45,0.08)*inCrack*0.9*smoothstep(1.85,1.35,p.z)*(0.35+0.65*sh);
  float dc=abs(p.x-crackX(p.y))-crackW(p.y);
  if(m==1 && p.z<1.40) col += vec3(1.0,0.42,0.06)*exp(-max(dc,0.)*55.)*0.35*(0.4+0.6*smoothstep(4.4,0.0,p.y));
  // sky fill + fresnel reflection of the dawn
  vec3 r=reflect(rd,n);
  float fr=0.04+0.96*pow(1.-max(dot(n,-rd),0.),5.);
  col += skyF(r)*fr*0.55*(m==2?1.6:1.0);
  col += alb*vec3(0.5,0.45,0.4)*0.04*(0.5+0.5*n.y);
  // edge catch-light on the shards
  if(m==2) col += vec3(1.0,0.6,0.25)*pow(max(dot(r,SUNF),0.),30.)*8.*sh;
  return col;
}
vec3 traceF(vec3 ro, vec3 rd, float pix){
  // objects
  float t=0.; int m=0; bool hit=false;
  for(int i=0;i<180;i++){ vec3 p=ro+rd*t; float d=mapF(p,m); if(d<0.0004*t){hit=true;break;} t+=d; if(t>40.) break; }
  float tg = rd.y<0. ? -ro.y/rd.y : 1e9;
  vec3 col; float tEnd;
  if(hit && t<tg){ col=shadeObjF(ro+rd*t,rd,m); tEnd=t; }
  else if(tg<1e8){
    vec3 p=ro+rd*tg; tEnd=tg;
    // wet black ground: blurred reflection
    float rough=0.004+0.006*fbm(vec3(p.xz*0.7,3.));
    vec3 n=normalize(vec3((h21(p.xz*911.)-.5)*rough,1.,(h21(p.xz*733.+3.)-.5)*rough));
    vec3 r=reflect(rd,n);
    float t2=0.02; int m2=0; bool h2=false;
    for(int i=0;i<110;i++){ vec3 q=p+r*t2; float d=mapF(q,m2); if(d<0.001*t2){h2=true;break;} t2+=d; if(t2>30.) break; }
    vec3 rc = h2? shadeObjF(p+r*t2,r,m2) : skyF(r);
    float fr=0.03+0.97*pow(1.-max(dot(n,-rd),0.),5.);
    float sh=shadowF(p+vec3(0,0.002,0), SUNF, 40.);
    float dif=max(dot(n,SUNF),0.);
    float stone=0.6+0.4*fbm(vec3(p.xz*2.2,5.));
    col = rc*fr*0.75*stone + vec3(0.03)*vec3(1.0,0.56,0.2)*9.*dif*sh + vec3(1.0,0.62,0.3)*pow(max(dot(r,SUNF),0.),60.)*sh*2.;
    // distance haze toward the horizon
    col = mix(col, skyF(vec3(rd.x,0.0015,rd.z))*0.9, 1.-exp(-tg*0.025));
  } else { col=skyF(rd); tEnd=40.; }
  // volumetric light: beams through the fracture
  float vt=min(tEnd,9.5); const int NV=48; float dt=vt/float(NV);
  float jit=h21(gl_FragCoord.xy+fract(uRes*0.13));
  float cosT=dot(rd,SUNF); float g=0.72;
  float phase=(1.-g*g)/pow(1.+g*g-2.*g*cosT,1.5)/(4.*PI);
  vec3 acc=vec3(0.); float trans=1.;
  for(int i=0;i<NV;i++){
    vec3 p=ro+rd*(dt*(float(i)+jit));
    float dens=0.0065*exp(-p.y*0.9);
    float vis=hardShadowF(p);
    acc+=trans*dens*vis*dt;
    trans*=exp(-dens*dt);
  }
  col = col*trans + acc*phase*vec3(1.0,0.5,0.14)*7.;
  return col;
}

// =================================================================== GRAVITY / TILE
vec2 WC = vec2(1.25,0.9);
float wellH(vec2 p, vec2 c, float m, float s){ float r=length(p-c); return -m/sqrt(r*r+s*s); }
float Hm(vec2 p){
  if(uScene==2) return wellH(p, vec2(0.0,0.35), 0.85, 0.95);
  return wellH(p, WC, 1.05, 0.62);
}
vec3 SUNG; vec3 gFace; float gFaceA;
vec3 sunCol(){ return mix(vec3(1.0,0.66,0.34), vec3(1.0,0.88,0.72), uHour/3.)*3.0; }
// small amber bodies on orbits
vec4 body(int i){
  float r = i==0?1.85: i==1?2.75: 3.9;
  float a = i==0?2.55: i==1?-0.55: 3.75;
  float rad = i==0?0.13: i==1?0.085: 0.06;
  vec2 xz=WC+r*vec2(cos(a),sin(a));
  return vec4(xz.x, Hm(xz)+rad*0.98, xz.y, rad);
}
float sphY(){ return Hm(WC)+0.72*1.18; }
// tile
vec3 TC; mat3 TB; // tile centre + basis (columns = u, v, normal)
float sdRR(vec2 p, vec2 b, float r){ vec2 q=abs(p)-b+r; return length(max(q,0.))+min(max(q.x,q.y),0.)-r; }
float tileD(vec3 p){ vec3 q=transpose(TB)*(p-TC); float d2=sdRR(q.xy, vec2(0.92-0.025), 0.24-0.025); vec2 w=vec2(d2, abs(q.z)-0.06); return min(max(w.x,w.y),0.)+length(max(w,0.))-0.025; }
float mapG(vec3 p, out int m){
  float dm=(p.y-Hm(p.xz))*0.55; m=0; float d=dm;
  if(uScene==1){
    float ds=length(p-vec3(WC.x,sphY(),WC.y))-0.72; if(ds<d){d=ds;m=1;}
    for(int i=0;i<3;i++){ vec4 b=body(i); float db=length(p-b.xyz)-b.w; if(db<d){d=db;m=2;} }
  } else {
    float dtl=tileD(p); if(dtl<d){d=dtl;m=3;}
  }
  return d;
}
float mapG0(vec3 p){ int m; return mapG(p,m); }
vec3 nrmG(vec3 p){ vec2 e=vec2(0.0008,0); return normalize(vec3(mapG0(p+e.xyy)-mapG0(p-e.xyy),mapG0(p+e.yxy)-mapG0(p-e.yxy),mapG0(p+e.yyx)-mapG0(p-e.yyx))); }
float shadowG(vec3 ro, vec3 rd, float k){
  float res=1., t=0.01;
  for(int i=0;i<80;i++){ vec3 p=ro+rd*t; if(p.y>2.6) break; float h=mapG0(p); res=min(res,k*h/t); t+=clamp(h,0.006,0.3); if(res<0.002||t>14.) break; }
  return clamp(res,0.,1.);
}
float aoG(vec3 p, vec3 n){ float o=0.,s=1.; for(int i=1;i<6;i++){ float h=0.06*float(i); o+=(h-mapG0(p+n*h))*s; s*=0.6; } return clamp(1.-2.2*o,0.,1.); }
vec3 skyG(vec3 d){
  float h=max(d.y,0.);
  vec3 c=mix(vec3(0.96,0.93,0.89), vec3(0.82,0.84,0.87), pow(h,0.6));
  float sd=max(dot(normalize(vec3(d.x,0.,d.z)),normalize(vec3(SUNG.x,0.,SUNG.z))),0.);
  c+=vec3(1.0,0.62,0.25)*pow(sd,6.)*exp(-h*10.)*0.55;
  c+=vec3(1.0,0.8,0.55)*pow(max(dot(d,SUNG),0.),400.)*6.;
  return c;
}
float gridLines(vec2 q, float spacing, float lw, float fw){
  vec2 g=abs(fract(q/spacing+0.5)-0.5)*spacing;
  float l=min(g.x,g.y);
  return 1.-smoothstep(lw-fw, lw+fw, l);
}
float ring(vec2 q, vec2 c, float r, float lw, float fw){ return 1.-smoothstep(lw-fw,lw+fw,abs(length(q-c)-r)); }
vec3 shadeG(vec3 p, vec3 rd, int m, float t, float pix, int depth){
  vec3 n=nrmG(p);
  float sh=shadowG(p+n*0.004, SUNG, 18.);
  float ao=aoG(p,n);
  float dif=max(dot(n,SUNG),0.);
  vec3 sc=sunCol();
  vec3 fill=vec3(0.76,0.80,0.88)*0.40;
  vec3 col;
  float fw=max(t*pix*1.2,0.0015);
  if(m==0){
    vec3 alb=vec3(0.90,0.885,0.865);
    float gl=gridLines(p.xz, 0.42, 0.0055, fw);
    float fade=exp(-t*0.06);
    alb=mix(alb, vec3(0.10,0.095,0.09), gl*0.72*fade);
    if(uScene==1){
      // Byrne-style orbit diagram drawn on the sheet: one solid, one dotted, in the single primary
      float r1=ring(p.xz,WC,1.85,0.007,fw);
      float r2=ring(p.xz,WC,2.75,0.006,fw);
      float ang=atan(p.z-WC.y,p.x-WC.x);
      float dots=step(0.5,fract(ang*2.75*9./PI));
      float r3=ring(p.xz,WC,3.9,0.009,fw)*dots;
      vec3 amber=vec3(0.98,0.48,0.03);
      alb=mix(alb, amber, clamp(r1+r3,0.,1.)*0.95);
      alb=mix(alb, vec3(0.1), r2*0.8);
    } else {
      float ang=atan(p.z-0.35,p.x);
      float dots=step(0.5,fract(ang*14./PI));
      float r1=ring(p.xz,vec2(0.,0.35),1.55,0.008,fw)*dots;
      alb=mix(alb, vec3(0.98,0.48,0.03), r1*0.95);
    }
    col = alb*(sc*dif*sh + fill*ao*(0.6+0.4*n.y));
    // satin sheen
    vec3 hv=normalize(SUNG-rd);
    col += sc*0.06*pow(max(dot(n,hv),0.),24.)*sh;
  } else if(m==2){
    vec3 alb=vec3(0.98,0.45,0.03);
    vec3 hv=normalize(SUNG-rd);
    col = alb*(sc*dif*sh + fill*ao*0.8) + sc*0.5*pow(max(dot(n,hv),0.),60.)*sh;
  } else { // tile: black glass body, porcelain face carrying the real logo
    vec3 q=transpose(TB)*(p-TC);
    float face=smoothstep(0.80,0.97, dot(n, TB[2]));
    vec3 hv=normalize(SUNG-rd);
    float fr=0.04+0.96*pow(1.-max(dot(n,-rd),0.),5.);
    vec3 body=vec3(0.012)*(sc*dif*sh+fill*ao) + skyG(reflect(rd,n))*fr*0.7 + sc*0.6*pow(max(dot(n,hv),0.),120.)*sh;
    col=body;
    if(depth==0 && face>0.){
      vec2 uv=q.xy/0.92*0.5+0.5; uv.y=1.-uv.y;
      vec4 lg = uHasLogo>0.5 ? texture(uLogo, uv) : vec4(0.);
      vec3 paper=vec3(0.976,0.965,0.949);
      vec3 fc=mix(paper, lg.rgb, lg.a);
      float inset=smoothstep(0.0,-0.035, sdRR(q.xy, vec2(0.92-0.06), 0.24-0.06));
      // gentle light falloff across the face, keeps logo colours true
      float shade=0.95+0.06*clamp(dot(n,SUNG)*1.2,0.,1.)*sh - 0.045*length(q.xy);
      gFace=fc*shade; gFaceA=face*inset;
    }
  }
  return col;
}
vec3 traceG(vec3 ro, vec3 rd, float pix){
  float t=0.; int m=0; bool hit=false;
  for(int i=0;i<260;i++){ vec3 p=ro+rd*t; float d=mapG(p,m); if(abs(d)<0.0003*t){hit=true;break;} t+=d; if(t>60.) break; }
  vec3 col;
  if(!hit) return skyG(rd);
  vec3 p=ro+rd*t;
  if(m==1){
    // obsidian sphere: mirror the sheet, the sky and the dawn
    vec3 n=normalize(p-vec3(WC.x,sphY(),WC.y));
    vec3 r=reflect(rd,n);
    float t2=0.01; int m2; bool h2=false;
    for(int i=0;i<140;i++){ vec3 q=p+r*t2; float d=mapG(q,m2); if(abs(d)<0.0005*t2){h2=true;break;} t2+=d; if(t2>40.) break; }
    vec3 rc = (h2 ? shadeG(p+r*t2, r, m2, t+t2, pix, 1) : skyG(r))*0.32;
    float fr=0.015+0.98*pow(1.-max(dot(n,-rd),0.),5.);
    col = rc*fr + vec3(0.012)*sunCol()*max(dot(n,SUNG),0.);
    col += sunCol()*1.8*pow(max(dot(r,SUNG),0.),900.);
  } else col=shadeG(p,rd,m,t,pix,0);
  col = mix(col, skyG(rd), 1.-exp(-max(t-7.,0.)*0.05));
  return col;
}

vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.); }

void main(){
  vec3 acc=vec3(0.); vec3 faceAcc=vec3(0.); float faceA=0.;
  float hour=uHour;
  SUNG = (uScene==2) ? normalize(vec3(-0.75+0.12*hour, 0.30+0.12*hour, -0.40+0.05*hour)) : normalize(vec3(0.82,0.115,0.56));
  // tile pose
  vec3 cro, cta; float fov;
  if(uScene==0){ cro=vec3(0.0,0.42,-6.4); cta=vec3(0.0,1.9,1.6); fov=0.62; }
  else if(uScene==1){ cro=vec3(-1.2,2.5,-4.4); cta=vec3(0.7,-0.75,1.5); fov=0.52; }
  else { cro=vec3(-0.25,2.55,-4.1); cta=vec3(0.05,0.62,0.35); fov=0.5; }
  if(uScene==1 && uRes.x<uRes.y){ cro=vec3(0.35,2.9,-4.7); cta=vec3(1.2,-0.75,1.4); fov=0.5; }
  if(uScene==0 && uRes.x<uRes.y){ cro=vec3(0.0,0.5,-7.4); cta=vec3(0.0,1.75,1.6); fov=0.62; }
  if(uScene==2){
    TC=vec3(0.0, 1.05, 0.35);
    vec3 nn=normalize(cro-TC); nn=normalize(mix(nn, vec3(0,1,0), 0.30)); nn.xz*=rot(0.30-0.2*uHour); nn=normalize(nn);
    vec3 uu=normalize(cross(vec3(0,1,0),nn));
    vec3 vv=cross(nn,uu);
    TB=mat3(-uu,vv,nn);
  }
  vec3 fw=normalize(cta-cro), rt=normalize(cross(vec3(0,1,0),fw)), up=cross(fw,rt);
  float pix = fov*2./uRes.y;
  for(int sy=0; sy<4; sy++){ if(sy>=uSS) break;
    for(int sx=0; sx<4; sx++){ if(sx>=uSS) break;
      vec2 off=(vec2(float(sx),float(sy))+0.5)/float(uSS)-0.5;
      vec2 uv=(gl_FragCoord.xy+off-0.5*uRes)/uRes.y;
      vec3 rd=normalize(fw + (uv.x*rt + uv.y*up)*fov*2.);
      gFaceA=0.; gFace=vec3(0.);
      vec3 c = uScene==0 ? traceF(cro,rd,pix) : traceG(cro,rd,pix);
      acc+=c; faceAcc+=gFace*gFaceA; faceA+=gFaceA;
    }
  }
  vec3 col=acc/float(uSS*uSS);
  if(uScene==0){
    col=aces(col*1.15);
    col=pow(col, vec3(1.0,1.02,1.06));
  } else {
    col=aces(col*0.95);
    col=pow(col,vec3(1.08,1.09,1.11));
  }
  // vignette
  vec2 q=gl_FragCoord.xy/uRes; col*=mix(1.0, 0.86, pow(length(q-0.5)*1.25, 2.5));
  col=pow(col, vec3(1./2.2));
  if(faceA>0.){ float n=float(uSS*uSS); vec3 fcol=faceAcc/max(faceA,1e-4); col=mix(col, fcol, faceA/n); }
  o=vec4(col,1.);
}`;

function sh(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ document.title='ERR'; document.body.insertAdjacentHTML('beforeend','<pre style="color:#fff">'+gl.getShaderInfoLog(s)+'</pre>'); throw gl.getShaderInfoLog(s);} return s; }
const pr=gl.createProgram(); gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS)); gl.linkProgram(pr); gl.useProgram(pr);
const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const lp=gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(lp); gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
gl.uniform2f(gl.getUniformLocation(pr,'uRes'),W,H);
gl.uniform1i(gl.getUniformLocation(pr,'uScene'),SCENE);
gl.uniform1i(gl.getUniformLocation(pr,'uSS'),SS);
gl.uniform1f(gl.getUniformLocation(pr,'uHour'),HOUR);
gl.viewport(0,0,W,H);

async function go(){
  const logo=P.get('logo');
  gl.uniform1f(gl.getUniformLocation(pr,'uHasLogo'), logo?1:0);
  const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,0]));
  if(logo){
    const img=new Image(); img.src=logo; await img.decode();
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  }
  gl.uniform1i(gl.getUniformLocation(pr,'uLogo'),0);
  gl.enable(gl.SCISSOR_TEST);
  const strip=+(P.get('strip')||24);
  const t0=performance.now();
  for(let y=0;y<H;y+=strip){
    gl.scissor(0,y,W,Math.min(strip,H-y));
    gl.drawArrays(gl.TRIANGLES,0,3);
    gl.finish();
    await new Promise(r=>setTimeout(r,0));
  }
  document.title='done '+Math.round(performance.now()-t0);
  console.log(document.title);
}
go();
</script></body></html>
