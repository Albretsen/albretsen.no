<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corona shader demo</title>
<style>
  :root { --umbra: #0d040e; --paper: #f8ebf9; --muted: #908091; }
  html, body { margin: 0; height: 100%; background: var(--umbra); color: var(--paper); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    background: #0d040e url(../hero/totality-960.jpg) center / cover; }
  .ui { position: fixed; left: 24px; bottom: 22px; font: 11px/1.4 ui-monospace, "Geist Mono", monospace;
    letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; gap: 18px; align-items: center; }
  button { all: unset; cursor: pointer; color: var(--paper); border-bottom: 1px solid currentColor; }
  input { accent-color: #ca6fd3; }
</style>
</head>
<body>
<canvas id="c" aria-label="Animated eclipse corona"></canvas>
<div class="ui">
  <button id="replay">Replay totality</button>
  <label>Develop <input id="k" type="range" min="0" max="1" step="0.01" value="1"></label>
  <label>Fracture <input id="f" type="range" min="0" max="1" step="0.01" value="0"></label>
  <span>Move the pointer: the moon drifts, fast moves split the light</span>
</div>
<script type="module">
  import { mountCorona } from './corona.js';
  const q = new URLSearchParams(location.search);
  const c = await mountCorona(document.getElementById('c'), {
    plate: '../hero/totality-1600.webp',
    intro: q.has('intro') ? +q.get('intro') : 0,
    fracture: q.has('fracture') ? +q.get('fracture') : undefined,
    preserve: true,
  });
  if (q.has("clean")) document.querySelector(".ui").style.display = "none";
  if (!q.has("intro")) c.play();
  document.getElementById('replay').onclick = () => c.play();
  document.getElementById('k').oninput = (e) => c.set({ intro: +e.target.value });
  let fr; document.getElementById('f').oninput = (e) => { fr = +e.target.value; c.set({ tx: fr, ty: fr * .4, px: 0, py: 0 }); };
</script>
</body>
</html>
