<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Catalogue demo</title>
<style>
  @font-face { font-family: "Martian Mono"; src: url(../fonts/martian-mono-var.woff2) format("woff2"); font-weight: 100 800; font-stretch: 75% 112.5%; }
  @font-face { font-family: "Archivo"; src: url(../fonts/archivo-var.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  :root { --cream:#F9F2E2; --forest:#1A4A32; --night:#05170F; --brass:#C2964D; --brass-l:#E8CB84; }
  html, body { margin: 0; height: 100%; background: var(--night) url(../extras/plate-night-512.webp); color: var(--cream); font-family: "Martian Mono", ui-monospace, monospace; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  nav { position: fixed; left: 16px; right: 16px; bottom: 24px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  button { font: 600 12px/1 "Martian Mono", monospace; letter-spacing: .06em; text-transform: uppercase; padding: 11px 14px;
    background: var(--cream); color: var(--forest); border: 2px solid var(--forest); border-radius: 999px; box-shadow: 4px 4px 0 var(--brass); cursor: pointer;
    transition: transform .15s, box-shadow .15s; }
  button:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--brass); }
  button[aria-pressed="true"] { background: var(--brass-l); }
  h1 { position: fixed; top: 20px; left: 20px; margin: 0; font: 800 clamp(20px,3vw,34px)/1 "Archivo", sans-serif; font-stretch: 125%; letter-spacing: -.01em; }
  p { position: fixed; top: 60px; left: 20px; margin: 0; max-width: 46ch; font-size: 11px; line-height: 1.6; opacity: .7; }
</style>
</head>
<body>
<canvas id="sky" aria-label="A field of 2,188 real stars measured from an 1885 photograph; buttons rearrange them into product constellations"></canvas>
<h1>Star Catalogue</h1>
<p>2,188 stars measured from a glass plate of Cygnus, 13 August 1885. Hover a star for its entry. Pick a product to pull its constellation out of the plate. Press F to fracture.</p>
<nav>
  <button data-id="mcp-emails">MCP Emails</button>
  <button data-id="fun-libs">Fun Libs</button>
  <button data-id="toolrails">Toolrails</button>
  <button data-id="harbor">Harbor</button>
  <button data-id="albretsen">Albretsen AS</button>
  <button data-act="fracture">Fracture</button>
</nav>
<script type="module">
  import { mountStarCatalogue } from './star-catalogue.js'
  const sky = await mountStarCatalogue(document.getElementById('sky'), { centerY: 0.45 })
  const btns = [...document.querySelectorAll('button[data-id]')]
  const pick = id => { const next = sky.current === id ? null : id; sky.show(next); btns.forEach(b => b.setAttribute('aria-pressed', b.dataset.id === next)) }
  btns.forEach(b => b.addEventListener('click', () => pick(b.dataset.id)))
  document.querySelector('[data-act=fracture]').addEventListener('click', () => sky.fracture())
  addEventListener('keydown', e => { if (e.key === 'f') sky.fracture() })
  const q = new URLSearchParams(location.search).get('show'); if (q) pick(q)
</script>
</body>
</html>
