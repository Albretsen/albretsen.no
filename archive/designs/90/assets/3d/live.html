<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Die Live</title>
<link rel="icon" href="../favicon.svg">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"}}</script>
<style>
  html,body{margin:0;height:100%;background:radial-gradient(70% 55% at 60% 30%,rgb(82 169 254 / .5),transparent 70%),linear-gradient(#0159d4 0 36%,#00226c 74%);color:#f1f8ff;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase}
  canvas{position:fixed;inset:0;width:100%;height:100%;cursor:grab}
  nav{position:fixed;left:16px;bottom:16px;display:flex;gap:8px;flex-wrap:wrap;z-index:2}
  button{font:inherit;color:inherit;background:rgb(0 10 42 / .35);border:1px solid rgb(211 231 254 / .3);border-radius:999px;padding:.6em 1em;cursor:pointer}
  button[aria-pressed=true]{background:#f1f8ff;color:#00226c}
</style>
</head>
<body>
<canvas id="c" aria-label="A live three.js die carrying one product. Drag to turn it."></canvas>
<nav id="nav"></nav>
<script type="module">
import { mountDie, PRODUCTS } from './die-scene.js'
const nav = document.getElementById('nav')
let die = null
async function show(id) {
  die?.dispose()
  const old = document.querySelector('canvas'), fresh = old.cloneNode(); old.replaceWith(fresh)
  die = await mountDie(fresh, { product: id, live: true, camera: [4.4, 2.8, 7.2], fov: 30, lookY: 0.95, pose: { x: 0, y: -0.2, z: 0 } })
  nav.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === id)))
}
for (const id of Object.keys(PRODUCTS)) { const b = document.createElement('button'); b.textContent = PRODUCTS[id].name; b.dataset.id = id; b.onclick = () => show(id); nav.append(b) }
show('mcp-emails')
</script>
</body>
</html>
