<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Townsfolk contact sheet</title>
<style>
  :root { --ink:#232c57; --plaster:#f4eadb; --mustard:#d9a42b; }
  html,body { margin:0; height:100%; background:#1d2547; color:var(--plaster); font:14px/1.4 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif; overflow:hidden; }
  canvas { display:block; }
  .ui { position:fixed; left:16px; right:16px; bottom:16px; display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center;
        background:rgba(20,26,56,.62); backdrop-filter:blur(8px); padding:12px 16px; border-radius:14px; max-width:880px; }
  .ui label { display:flex; gap:8px; align-items:center; white-space:nowrap; }
  .ui input[type=range] { width:220px; accent-color:var(--mustard); }
  select, button { font:inherit; background:#2c3a6b; color:var(--plaster); border:1px solid #4a5a8f; border-radius:8px; padding:4px 8px; }
  h1 { position:fixed; left:20px; top:14px; margin:0; font-weight:600; font-size:15px; letter-spacing:.06em; text-transform:uppercase; opacity:.85; }
  .tags { position:fixed; inset:0; pointer-events:none; }
  .tag { position:absolute; transform:translate(-50%,0); font-size:11px; letter-spacing:.04em; opacity:.8; white-space:nowrap; text-shadow:0 1px 2px #0008; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<h1>Heure Bleue · townsfolk</h1>
<div class="tags" id="tags"></div>
<div class="ui">
  <label>Time <input id="time" type="range" min="0" max="1" step="0.001" value="0.55"> <span id="tlabel"></span></label>
  <label>Everyone plays <select id="clip"><option value="">their own clip</option><option value="__routine">their routine at this hour</option></select></label>
  <label><input id="spin" type="checkbox" checked> orbit</label>
</div>
<script type="module">
import * as THREE from 'three';
import { Townsfolk, PEOPLE, CLIPS, routine, applyRoutine } from './people.js';

const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 200);

// sky dome with a three-stop gradient that follows the time slider
const skyU = { top: { value: new THREE.Color() }, mid: { value: new THREE.Color() }, hor: { value: new THREE.Color() } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(90, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, uniforms: skyU,
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'uniform vec3 top,mid,hor; varying vec3 vP; void main(){ float h=clamp(vP.y,-.2,1.); vec3 c = h<.18? mix(hor,mid,smoothstep(-.05,.18,h)) : mix(mid,top,smoothstep(.18,.75,h)); gl_FragColor=vec4(c,1.); }'
}));
scene.add(sky);

// stage: a plaster terrace with zinc paving rings and a low parapet
const stage = new THREE.Group(); scene.add(stage);
const plaster = new THREE.MeshStandardMaterial({ color: 0xf4eadb, roughness: .95 });
const zinc = new THREE.MeshStandardMaterial({ color: 0x8d9bb4, roughness: .9 });
const terr = new THREE.MeshStandardMaterial({ color: 0xc96f4a, roughness: .9 });
const floor = new THREE.Mesh(new THREE.CylinderGeometry(9, 9.3, 0.3, 64), plaster); floor.position.y = -0.15; floor.receiveShadow = true; stage.add(floor);
for (let i = 0; i < 3; i++) { const r = new THREE.Mesh(new THREE.RingGeometry(2.4 + i * 2.1, 2.48 + i * 2.1, 96), zinc); r.rotation.x = -Math.PI / 2; r.position.y = 0.002; r.receiveShadow = true; stage.add(r); }
const tiles = new THREE.Mesh(new THREE.CircleGeometry(1.2, 48), terr); tiles.rotation.x = -Math.PI / 2; tiles.position.y = 0.003; tiles.receiveShadow = true; stage.add(tiles);
const sea = new THREE.Mesh(new THREE.CircleGeometry(80, 64), new THREE.MeshStandardMaterial({ color: 0x2c3a6b, roughness: .4, metalness: .1 }));
sea.rotation.x = -Math.PI / 2; sea.position.y = -2.5; scene.add(sea);

// lamps on the stage edge (emissive_ demo + point lights)
const lampHeads = [];
for (let i = 0; i < 6; i++) {
  const a = Math.PI * (1.12 + i * 0.152), g = new THREE.Group();
  g.position.set(Math.cos(a) * 8.2, 0, Math.sin(a) * 8.2);
  const post = new THREE.Mesh(new THREE.CylinderGeometry(.04, .06, 3, 8), new THREE.MeshStandardMaterial({ color: 0x232c57 })); post.position.y = 1.5; post.castShadow = true;
  const headM = new THREE.MeshStandardMaterial({ color: 0x3a3424, emissive: 0xffc979, emissiveIntensity: 0, name: 'emissive_lamp' });
  const head = new THREE.Mesh(new THREE.SphereGeometry(.16, 12, 8), headM); head.position.y = 3.05;
  const pl = new THREE.PointLight(0xffc979, 0, 9, 1.6); pl.position.y = 2.9;
  g.add(post, head, pl); stage.add(g); lampHeads.push({ headM, pl, at: 0.45 + i * 0.05 });
}

const hemi = new THREE.HemisphereLight(0xa9c6e0, 0x6e1f33, 1.0); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffb27a, 2.0); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 60 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

const town = new Townsfolk();
const cast = [];
// signature activity per character
const ROLE = {
  player: { clip: 'wave' }, jogger: { clip: 'jog' }, waiter: { clip: 'walk_carry', prop: 'tray' },
  older_woman: { clip: 'walk_formal' }, older_man: { clip: 'walk_formal', prop: 'cane' },
  dog_walker: { clip: 'walk' }, cyclist: { clip: 'cycle' }, child: { clip: 'dance' },
  stroller_dress: { clip: 'drink', prop: 'wine_glass' }, stroller_linen: { clip: 'phone', prop: 'phone' },
  asgeir: { clip: 'talk' },
};
// ?roles=waiter:walk_carry:tray,older_man:walk_formal:cane  (overrides the cast for close-ups)
let only = q.get('only');
if (q.get('roles')) {
  const names = [];
  for (const r of q.get('roles').split(',')) { const [nm, clip, prop] = r.split(':'); names.push(nm); ROLE[nm] = { clip, prop }; }
  only = names.join(',');
}
const list = only ? only.split(',') : PEOPLE;
const extras = [];

const clipSel = document.getElementById('clip');
for (const c of CLIPS) clipSel.add(new Option(c, c));

const tagsEl = document.getElementById('tags');
await town.library();
const n = list.length;
for (let i = 0; i < n; i++) {
  const name = list[i];
  const a = await town.spawn(name);
  const role = ROLE[name] || { clip: 'idle' };
  const ang = n === 1 ? 0 : (-0.5 + i / (n - 1)) * Math.PI * 0.95;
  const R = n === 1 ? 0 : 4.2;
  if (only) { a.object.position.set((i - (n - 1) / 2) * (+q.get('gap') || 1.15), 0, 0); a.object.rotation.y = +(q.get('ry') || 0); }
  else { a.object.position.set(Math.sin(ang) * R, 0, -Math.cos(ang) * R + 2.2); a.object.lookAt(0, 0, 9); }
  if (name === 'cyclist' && role.clip === 'cycle') {
    const bike = await town.spawn('bicycle').catch(() => null);
    if (bike) { bike.object.position.copy(a.object.position); bike.object.quaternion.copy(a.object.quaternion); scene.add(bike.object); a.mount(bike); extras.push(bike); }
    else { scene.add(a.object); a.play(role.clip, 0); }
  } else {
    scene.add(a.object);
    a.play(q.get('clip') || role.clip, 0);
    if (q.get('roles')) a.current.time = 0.4;
  }
  if (role.prop) await a.attach(role.prop).catch(() => {});
  if (name === 'dog_walker') {
    const dog = await town.spawn('dog', { clip: 'walk' }).catch(() => null);
    if (dog) {
      a.object.add(dog.object); dog.object.position.set(-0.75, 0, 0.55); extras.push(dog);
      scene.add(town.leash(a, dog));
    }
  }
  if (name === 'older_woman' && !only) a.object.position.x += 0.1;
  a.current.time = (i * 0.37) % a.current.getClip().duration;
  const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = name.replace('_', ' '); tagsEl.append(tag);
  cast.push({ a, tag, name, role });
}
if (q.get('mode') === 'routine') { clipSel.value = '__routine'; }
if (q.get('debug')) {
  for (const c of cast) for (const b of ['hand_r', 'hand_l']) c.a.bone(b).add(new THREE.AxesHelper(0.25));
}

const hourOf = (t) => 16 + t * 7.5;
let lastKey = '', firstApply = true;
function applyClips() {
  const t = +timeEl.value, routineMode = clipSel.value === '__routine';
  const key = clipSel.value + (routineMode ? Math.floor(hourOf(t) * 2) : '');
  if (key === lastKey) return; lastKey = key;
  for (const c of cast) {
    if (c.name === 'cyclist' && c.role.clip === 'cycle' && !routineMode) { c.a.play('cycle', 0.35); continue; }
    if (routineMode) applyRoutine(c.a, hourOf(t), firstApply ? 0 : 0.5);
    else { for (const p of Object.keys(c.a.props)) if (p !== c.role.prop) c.a.detach(p); if (c.role.prop) c.a.attach(c.role.prop); c.a.play(clipSel.value || c.role.clip, 0.35); }
  }
}
clipSel.onchange = applyClips;

const timeEl = document.getElementById('time'), tl = document.getElementById('tlabel');
if (q.get('t')) timeEl.value = q.get('t');
const C = (h) => new THREE.Color(h);
const keys = [ // t, sky top, mid, horizon, sun colour, sun intensity, hemi intensity, sun elevation
  [0.0, C(0x6f8fc0), C(0xf2b5b8), C(0xffd39a), C(0xffd8a8), 2.6, 1.3, 0.55],
  [0.35, C(0x3d4f8a), C(0xc8336e), C(0xff9a5a), C(0xff9c63), 2.0, 1.0, 0.22],
  [0.6, C(0x232c57), C(0x6e4a7a), C(0xd9776a), C(0xe07a6a), 0.9, 0.75, 0.06],
  [1.0, C(0x0f1433), C(0x232c57), C(0x3b3f6e), C(0x6d7fb8), 0.35, 0.45, 0.35],
];
function setTime(t) {
  let k = 0; while (k < keys.length - 2 && t > keys[k + 1][0]) k++;
  const A = keys[k], B = keys[k + 1], u = THREE.MathUtils.clamp((t - A[0]) / (B[0] - A[0]), 0, 1);
  skyU.top.value.copy(A[1]).lerp(B[1], u); skyU.mid.value.copy(A[2]).lerp(B[2], u); skyU.hor.value.copy(A[3]).lerp(B[3], u);
  sun.color.copy(A[4]).lerp(B[4], u); sun.intensity = A[5] + (B[5] - A[5]) * u; hemi.intensity = A[6] + (B[6] - A[6]) * u;
  const el = A[7] + (B[7] - A[7]) * u;
  sun.position.set(-12 * Math.cos(el), 30 * Math.sin(el) + 3, 9);
  hemi.color.copy(skyU.mid.value).lerp(C(0xa9c6e0), .5);
  scene.fog = new THREE.Fog(skyU.hor.value.clone(), 30, 90);
  for (const l of lampHeads) { const on = THREE.MathUtils.smoothstep(t, l.at, l.at + 0.04); l.headM.emissiveIntensity = on * 2.2; l.pl.intensity = on * 6; }
  const glow = THREE.MathUtils.smoothstep(t, 0.5, 0.62);
  for (const c of cast) c.a.setLights(glow * 2.0);
  for (const e of extras) e.setLights(glow * 2.0);
  const hr = 16 + t * 7.5; tl.textContent = `${String(Math.floor(hr)).padStart(2, '0')}:${String(Math.floor(hr % 1 * 60)).padStart(2, '0')} · ` + (t < .3 ? 'golden' : t < .55 ? 'sunset' : t < .8 ? 'blue hour' : 'night');
}
timeEl.oninput = () => { setTime(+timeEl.value); if (clipSel.value === '__routine') applyClips(); };
setTime(+timeEl.value);
if (clipSel.value === '__routine') applyClips();
firstApply = false;

const spin = document.getElementById('spin');
const cam = q.get('cam') || 'wide';
const clock = new THREE.Clock();
let orbit = +(q.get('orbit') || 0);
if (q.get('still')) spin.checked = false;
const v = new THREE.Vector3();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  town.update(dt);
  if (spin.checked) orbit += dt * 0.05;
  const dist = cam === 'close' ? (+q.get('dist') || 4.6) : 13.5, h = +q.get('h') || (cam === 'close' ? 1.25 : 3.6);
  camera.position.set(Math.sin(orbit) * dist, h, Math.cos(orbit) * dist + (cam === 'close' ? 0 : 1));
  camera.lookAt(+q.get('lx') || 0, +q.get('ly') || (cam === 'close' ? 0.85 : 0.9), cam === 'close' ? 0 : 1.6);
  renderer.render(scene, camera);
  for (const c of cast) {
    c.a.object.getWorldPosition(v); v.y -= 0.12; v.project(camera);
    c.tag.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; c.tag.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
    c.tag.style.display = v.z < 1 ? '' : 'none';
  }
  requestAnimationFrame(frame);
}
frame();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
window.__ready = true;
</script>
</body>
</html>
