<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heure Bleue Vehicles</title>
<style>
  :root { --ink:#232c57; --plaster:#f4eadb; --mustard:#d9a42b; }
  html, body { margin:0; height:100%; background:#2c3b74; overflow:hidden; font:14px/1.4 ui-sans-serif, system-ui, sans-serif; color:var(--plaster); }
  canvas { display:block; width:100%; height:100%; }
  .ui { position:absolute; left:16px; right:16px; bottom:16px; display:flex; gap:14px; align-items:center; flex-wrap:wrap;
        background:rgba(35,44,87,.55); backdrop-filter:blur(8px); padding:10px 14px; border-radius:12px; max-width:860px; margin:0 auto; }
  .ui label { display:flex; gap:8px; align-items:center; }
  .ui input[type=range] { width:200px; accent-color:var(--mustard); }
  .ui button { background:var(--plaster); color:var(--ink); border:0; border-radius:8px; padding:6px 10px; font:600 13px system-ui; cursor:pointer; }
  h1 { position:absolute; left:20px; top:14px; margin:0; font:600 15px system-ui; letter-spacing:.04em; opacity:.9 }
  .help { position:absolute; right:20px; top:14px; font-size:12px; opacity:.8; text-align:right }
  .tag { position:absolute; transform:translate(-50%,0); font:600 11px system-ui; letter-spacing:.06em; text-transform:uppercase; color:var(--plaster); text-shadow:0 1px 4px rgba(35,44,87,.8); pointer-events:none; white-space:nowrap }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<h1>Heure Bleue / vehicles</h1>
<div class="help" id="help">Drag to orbit. Drive: W A S D / arrows, Space brakes, C switches camera, E opens the door.</div>
<div class="ui">
  <label>Time <input id="t" type="range" min="0" max="1" step="0.001" value="0.25"></label>
  <span id="tl"></span>
  <button id="drive">Drive the hero car</button>
  <button id="doors">Doors</button>
  <button id="traffic">Traffic</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { loadVehicle, ArcadeCar, CarInput, ChaseCamera, PathFollower } from './vehicles.js';

const Q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.05, 600);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, 0); controls.enableDamping = true; controls.maxPolarAngle = 1.52;

// ---- blue-hour stage (ramps borrowed from design 64)
const C = (a) => a.map((h) => new THREE.Color(h));
const RAMP = {
  zenith: C(['#1b2450', '#2c3b74', '#566fae', '#86a8d4', '#a8c8e6']),
  horizon: C(['#7d6a9c', '#df98a3', '#f0ad62', '#f4cf8c', '#f3dfb8']),
  key: C(['#2a2440', '#6a4a5e', '#e09a70', '#f4d3ac', '#fff0d8']),
  amb: C(['#3d4782', '#6a6aa3', '#9a8bb6', '#b9c7dc', '#c6d5e5']),
  ground: C(['#5b5a86', '#a5869c', '#d8a99a', '#e6cdb6', '#eadccb']),
};
const ramp = (n, t) => { const r = RAMP[n], x = t * (r.length - 1), i = Math.min(r.length - 2, Math.floor(x)); return r[i].clone().lerp(r[i + 1], x - i); };

const skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false,
  uniforms: { uTop: { value: new THREE.Color() }, uBot: { value: new THREE.Color() } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: `uniform vec3 uTop; uniform vec3 uBot; varying vec3 vP;
    void main(){ float h = smoothstep(-0.02, 0.5, vP.y); gl_FragColor = vec4(mix(uBot, uTop, h), 1.);
    #include <colorspace_fragment>
    }` });
scene.add(new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), skyMat));
const hemi = new THREE.HemisphereLight(0xffffff, 0xffffff, 1.6); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 80 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
const groundMat = new THREE.MeshStandardMaterial({ roughness: 1 });
const ground = new THREE.Mesh(new THREE.CircleGeometry(120, 64), groundMat);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// a coast road with a dashed centre line
const road = new THREE.Mesh(new THREE.PlaneGeometry(9, 240), new THREE.MeshStandardMaterial({ color: '#4a4f72', roughness: 0.95 }));
road.rotation.x = -Math.PI / 2; road.position.set(0, 0.005, 0); road.receiveShadow = true; scene.add(road);
const dashM = new THREE.MeshStandardMaterial({ color: '#f4eadb', roughness: 1 });
for (let z = -118; z < 118; z += 4) { const d = new THREE.Mesh(new THREE.PlaneGeometry(0.14, 1.8), dashM); d.rotation.x = -Math.PI / 2; d.position.set(0, 0.01, z); d.receiveShadow = true; scene.add(d); }
// a few street lamps so the light switch is legible
const lampHeads = [];
for (const [x, z] of [[-10, -12], [11, -4], [-10, 12], [11, -20]]) {
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 3.6, 8), new THREE.MeshStandardMaterial({ color: '#2b2f4a' }));
  p.position.set(x, 1.8, z); p.castShadow = true; scene.add(p);
  const h = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 10), new THREE.MeshStandardMaterial({ color: '#3b3a50', emissive: '#ffc979', emissiveIntensity: 0 }));
  h.position.set(x, 3.7, z); scene.add(h); lampHeads.push(h);
  const pl = new THREE.PointLight('#ffc979', 0, 14, 1.6); pl.position.set(x, 3.5, z); scene.add(pl); lampHeads.push(pl);
}
scene.fog = new THREE.Fog(0xffffff, 30, 140);

// ---- vehicles
const only = Q.get('only');
const layout = [
  ['hero', 'hero_car.glb', 0.6, 1.2, 0.75, 'Hero spider'],
  ['heroMustard', 'hero_car_mustard.glb', -5.6, -3.2, 0.75, 'Hero, mustard'],
  ['citycar', 'city_car.glb', 5.6, -4.6, 0.75, 'City car'],
  ['van', 'van.glb', -1.2, -7.2, 0.75, 'Van'],
  ['scooter', 'scooter.glb', 5.4, 2.8, 0.75, 'Scooter'],
  ['bicycle', 'bicycle.glb', -4.6, 3.4, 0.75, 'Bicycle'],
];
const V = {};
await Promise.all(layout.filter((l) => !only || l[0] === only).map(async ([k, f, x, z, ry, label]) => {
  try {
    const v = await loadVehicle(f);
    v.root.position.set(only ? 0 : x, 0, only ? 0 : z); v.root.rotation.y = ry; v.label = label;
    scene.add(v.root); V[k] = v;
  } catch (e) { console.warn('missing', f, e.message); }
}));
const hero = V.hero;
if (hero) hero.addBeams();

// ---- time of day
const tIn = document.getElementById('t'), tl = document.getElementById('tl');
function setTime(t) {
  skyMat.uniforms.uTop.value.copy(ramp('zenith', t)); skyMat.uniforms.uBot.value.copy(ramp('horizon', t));
  hemi.color.copy(ramp('amb', t)); hemi.groundColor.copy(ramp('ground', t)).multiplyScalar(0.6);
  hemi.intensity = 1.1 + t * 0.9;
  sun.color.copy(ramp('key', t)); sun.intensity = 0.4 + t * 2.6;
  const el = -0.08 + t * 0.5;
  sun.position.set(-30 * Math.cos(el) , 4 + 40 * Math.max(0.05, Math.sin(el)), 18);
  groundMat.color.copy(ramp('ground', t));
  scene.fog.color.copy(ramp('horizon', t));
  const night = THREE.MathUtils.smoothstep(0.55 - t, 0, 0.45);
  for (const v of Object.values(V)) v.setLights(night);
  lampHeads.forEach((h) => { if (h.isLight) h.intensity = night * 9; else h.material.emissiveIntensity = night * 1.8; });
  tl.textContent = t < 0.2 ? 'blue hour' : t < 0.45 ? 'dusk' : t < 0.7 ? 'sunset' : 'golden afternoon';
}
tIn.value = Q.get('t') ?? 0.25; setTime(+tIn.value);
tIn.oninput = () => setTime(+tIn.value);

// ---- poses / cameras for screenshots
const door = +(Q.get('door') || 0), steer = +(Q.get('steer') || 0);
for (const v of Object.values(V)) { v.setDoor('l', door); }
if (hero && steer) { const c = new ArcadeCar(hero); c.steer = steer; c.update(0.016, {}); c.steer = steer; for (const k of ['fl', 'fr']) hero.wheels[k].rotation.y = steer; hero.steering.quaternion.copy(hero.steering.userData.rest).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -steer * 2.6)); }
const CAMS = {
  sheet: [[10, 4.8, 13.5], [0, 0.5, -1.8]], hero: [[4.6, 1.7, 6.2], [0, 0.55, 0]], side: [[7.5, 1.2, 0], [0, 0.6, 0]],
  rear: [[-4, 1.8, -6], [0, 0.6, 0]], top: [[0.01, 9, 0], [0, 0, 0]], cockpit: [[0.6, 1.9, -1.6], [0.2, 0.7, 0.6]], front: [[0, 1.0, 7.5], [0, 0.55, 0]],
};
const cv = CAMS[Q.get('cam') || (only ? 'hero' : 'sheet')] || CAMS.sheet;
camera.position.set(...cv[0]); controls.target.set(...cv[1]);
if (only && hero) { const ry = +(Q.get('ry') || 0); hero.root.rotation.y = ry; }
if (only && !hero) { const v = Object.values(V)[0]; if (v) { const b = new THREE.Box3().setFromObject(v.root), s = b.getSize(new THREE.Vector3()).length(); camera.position.multiplyScalar(Math.max(0.35, s / 4.6)); controls.target.y = s * 0.12; v.root.rotation.y = +(Q.get('ry') || 0); } }

// labels
const tags = [];
if (!only) for (const v of Object.values(V)) { const d = document.createElement('div'); d.className = 'tag'; d.textContent = v.label; document.body.appendChild(d); tags.push([d, v]); }

// ---- drive mode
let driving = Q.get('drive') === '1', car, input, chase;
function startDrive() {
  if (!hero) return;
  driving = true; controls.enabled = false;
  car = car || new ArcadeCar(hero); input = input || new CarInput({ touch: document.body });
  chase = chase || new ChaseCamera(camera, hero);
  tags.forEach(([d]) => d.remove()); tags.length = 0;
}
document.getElementById('drive').onclick = startDrive;
let doorOpen = door;
document.getElementById('doors').onclick = () => { doorOpen = doorOpen ? 0 : 1; };
addEventListener('keydown', (e) => { if (e.code === 'KeyC' && chase) chase.mode = chase.mode === 'chase' ? 'cockpit' : 'chase'; if (e.code === 'KeyE') doorOpen = doorOpen ? 0 : 1; });
if (driving) startDrive();
if (Q.get('mode') === 'cockpit') { startDrive(); chase.mode = 'cockpit'; }

// ---- ambient traffic demo (PathFollower)
let traffic = [];
function startTraffic() {
  if (traffic.length) { traffic = []; return; }
  tags.forEach(([d]) => d.remove()); tags.length = 0;
  ['citycar', 'van', 'scooter', 'bicycle', 'heroMustard'].forEach((k, i) => {
    if (V[k]) traffic.push(new PathFollower(V[k], [[2.2, -40], [2.2, 40], [-2.2, 40], [-2.2, -40]],
      { speed: k === 'bicycle' ? 4 : k === 'scooter' ? 7 : 9, offset: i * 0.19 }));
  });
}
document.getElementById('traffic').onclick = startTraffic;
if (Q.get('traffic') === '1') startTraffic();

const clock = new THREE.Clock();
let doorNow = door;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  doorNow += (doorOpen - doorNow) * Math.min(1, dt * 5);
  for (const v of Object.values(V)) { v.setDoor('l', doorNow); }
  for (const tr of traffic) tr.update(dt);
  if (driving) { car.update(dt, input.state()); chase.update(dt); sun.target.position.copy(hero.root.position); sun.position.add(new THREE.Vector3().subVectors(hero.root.position, sun.target.position)); }
  else controls.update();
  for (const [d, v] of tags) {
    const p = v.root.position.clone(); p.y -= 0.35; p.project(camera);
    d.style.left = (p.x * 0.5 + 0.5) * innerWidth + 'px'; d.style.top = (-p.y * 0.5 + 0.5) * innerHeight + 'px';
  }
  renderer.render(scene, camera);
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
