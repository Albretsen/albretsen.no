<style>:root{color-scheme:light dark}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:#f4f4f2;color:#151515;padding:20px}@media(prefers-color-scheme:dark){body{background:#111;color:#eee}}

<body><h1>Archive: rounds 1–2 (60 designs) · <a href="../">back to gallery</a></h1>
<p>Screenshots only, to keep the gallery light. ★ = kept in the gallery. The full designs are in git tag <code>brand-rounds-1-2</code>; restore one with <code>git checkout brand-rounds-1-2 -- designs/NN</code>.</p>
<main><figure><img src="01.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>01</b> Bloom Edition<br><span>A loud long-form magazine that never goes to print: every live event blooms into a star.</span></figcaption></figure><figure><img src="02.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>02</b> Continue.<br><span>A title screen at first light: one dot, two colours, one size, products that talk.</span></figcaption></figure><figure><img src="03.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>03</b> Gravity Issue<br><span>A sideways magazine printed in two inks, where every real event lands on the cover.</span></figcaption></figure><figure><img src="04.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>04</b> Carrier<br><span>A 1990s personal homepage rebuilt as tomorrow&#x27;s interface: one pixel face, one hue, one character grid.</span></figcaption></figure><figure><img src="05.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>05</b> Stille<br><span>A quiet terminal that keeps score: every product playing in one six-minute piano roll.</span></figcaption></figure><figure><img src="06.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>06</b> Current<br><span>The name, drawn only by lines that shift half a step. Live events pass through it as pulses.</span></figcaption></figure><figure><img src="07.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>07</b> Blue Hour<br><span>A festival bill set as a quiet document, in nine depths of one blue.</span></figcaption></figure><figure><img src="08.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>08</b> Threshold<br><span>The page is a heat grid of product by minute; the name is set on top of the silence.</span></figcaption></figure><figure><img src="09.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>09</b> Afterimage<br><span>A letter set on a pixel grid, with the software&#x27;s activity in orbit around the name.</span></figcaption></figure><figure><img src="10.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>10</b> Pust<br><span>A front page set in a terminal: two greens, one monospace grid, events orbiting the name.</span></figcaption></figure><figure><img src="11.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>11</b> Low Sun<br><span>A vermilion broadsheet whose masthead casts the real shadow of the sun over Oslo.</span></figcaption></figure><figure><img src="12.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>12</b> Afterimage<br><span>Op Art restraint: one silent half, one half under tension, and one blue line.</span></figcaption></figure><figure><img src="13.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>13</b> Bloom Index<br><span>Paper, ink and one magenta signal: an Are.na-style index of everything built, with a live log typing beside it.</span></figcaption></figure><figure><img src="14.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>14</b> Bitspark<br><span>A 1-bit desktop where every product sings its own note.</span></figcaption></figure><figure><img src="15.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>15</b> Surface Tension<br><span>Every product is a surface; every real event lands on it as a chrome drop.</span></figcaption></figure><figure><img src="16.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>16</b> Full Stop<br><span>Ink, paper and one dot that takes the colour of whatever just happened.</span></figcaption></figure><figure><img src="17.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>17</b> Albedo<br><span>A pale instrument that reports what happened, and very little else.</span></figcaption></figure><figure><img src="18.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>18</b> Preprint<br><span>The company as a working paper: greys, margins and figures, with colour only when something happens.</span></figcaption></figure><figure><img src="19.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>19</b> One Spot<br><span>A printed document with one ink, one paper and one spot of signal green.</span></figcaption></figure><figure><img src="20.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>20</b> Brev<br><span>A letter written in a code editor, signed by a constellation of live data.</span></figcaption></figure><figure><img src="21.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>21</b> Dot Plot<br><span>A data-journalism graphic about one company, set entirely in monospace, with a full stop for a logo.</span></figcaption></figure><figure><img src="22.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>22</b> Hjemmeside<br><span>A 1996 personal homepage, rebuilt by someone with 2026 taste.</span></figcaption></figure><figure><img src="23.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>23</b> Exhale<br><span>The name takes the shape of your screen; the page breathes from paper to ink as you scroll.</span></figcaption></figure><figure><img src="24.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>24</b> Daylight Lattice<br><span>A title card in daylight: one grotesk at cinema scale over a living lattice of minutes.</span></figcaption></figure><figure><img src="25.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>25</b> fullt hus<br><span>a full-house data front page where the live feed sets every colour, weight and width</span></figcaption></figure><figure><img src="26.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>26</b> Widescreen<br><span>A name drawn in pixels on a Crouwel lattice, two screens wide, run sideways like film.</span></figcaption></figure><figure><img src="27.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>27</b> Full Stop<br><span>One violet field, one Garamond voice, and a full stop for every thing that happens.</span></figcaption></figure><figure><img src="28.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>28</b> Colophon<br><span>A Swiss grid set in book type, where the only colour on the page is something happening right now.</span></figcaption></figure><figure><img src="29.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>29</b> room 24<br><span>a one-man exhibition on a red wall, labelled in pixels, lowercase, with the failures still hanging</span></figcaption></figure><figure><img src="30.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>30</b> Uncut<br><span>Opening titles for a company that shows the whole reel, outtakes included.</span></figcaption></figure><figure><img src="31.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>31</b> Honest Deck<br><span>Every bet, face up: a self-dealing deck of candy cards under an airbrushed sunset.</span></figcaption></figure><figure><img src="32.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>32</b> Night Shift Paper ★<br><span>A paper-cut desktop on a Norwegian night, where you can drag the sun up.</span></figcaption></figure><figure><img src="33.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>33</b> Uranographia<br><span>A star atlas of working software: every product is a constellation drawn from its own number.</span></figcaption></figure><figure><img src="34.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>34</b> Tension Prism<br><span>The name is the prism: a glass lattice that every live event passes through as light.</span></figcaption></figure><figure><img src="35.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>35</b> Kiln Light ★<br><span>A quiet sunlit room, one day of light, and the products fired as glazed tiles.</span></figcaption></figure><figure><img src="36.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>36</b> Infrared Fable ★<br><span>A real landscape photographed in light you can&#x27;t see, with a storybook living inside it.</span></figcaption></figure><figure><img src="37.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>37</b> Cloud Chamber<br><span>A calm rose lab where chrome letters fall, collide and leave particle tracks</span></figcaption></figure><figure><img src="38.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>38</b> Salon Refusé<br><span>A museum wall after hours where every frame is a program and a UV torch shows the maths underneath.</span></figcaption></figure><figure><img src="39.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>39</b> Cold Boot<br><span>The site boots like a machine and lands like light through glass.</span></figcaption></figure><figure><img src="40.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>40</b> Specimen Atlas<br><span>A natural-history atlas of things that were built, lit by the sun over Oslo.</span></figcaption></figure><figure><img src="41.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>41</b> Key Frame ★<br><span>A one-person animation studio for software: cel-shaded, duotone, drawn on twos.</span></figcaption></figure><figure><img src="42.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>42</b> Same Room<br><span>One voxel room, 2019 and today, with a time scrubber as the split edge</span></figcaption></figure><figure><img src="43.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>43</b> The Albretsen Dawn<br><span>A morning paper from the future, printed by a press that only knows triangles.</span></figcaption></figure><figure><img src="44.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>44</b> Darkfield<br><span>One glass slide you pan and zoom, with every product lit from the side.</span></figcaption></figure><figure><img src="45.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>45</b> Drift<br><span>A river of time in soft plastic, from a first Android app in 2016 to today.</span></figcaption></figure><figure><img src="46.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>46</b> Say Cheese<br><span>A loud candy-clay camera world where the visitor holds the camera: pull focus, set exposure, keep the print.</span></figcaption></figure><figure><img src="47.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>47</b> Stille<br><span>A quiet archive of working things: an app store, art-directed by a museum.</span></figcaption></figure><figure><img src="48.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>48</b> Nocturne Select ★<br><span>A character-select screen where the products are the characters, in glossy plastic lit like a studio at night.</span></figcaption></figure><figure><img src="49.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>49</b> Habit<br><span>A quiet conversation at a pen-drawn desk, with a crystal you can turn.</span></figcaption></figure><figure><img src="50.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>50</b> IR//PEEL<br><span>Pixel stickers on glossy vinyl. Peel one and an infrared underdrawing is underneath.</span></figcaption></figure><figure><img src="51.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>51</b> Sodium Orbit<br><span>Earth at night from the ISS: a playable spark lights four lamps, and the lamps light the introduction.</span></figcaption></figure><figure><img src="52.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>52</b> Violet Cabinet<br><span>A museum archive plugged into the mains: five electrified plates, one crystal that changes habit, a bust digitised live.</span></figcaption></figure><figure><img src="53.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>53</b> Halflight<br><span>A title sequence that resolves into a page, printed in two inks and lit by the real sun over Oslo.</span></figcaption></figure><figure><img src="54.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>54</b> The Vivarium<br><span>Small software, kept alive under glass.</span></figcaption></figure><figure><img src="55.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>55</b> Plate Nocturne<br><span>A light table at night: 19th-century glass negatives under loose panes that bend the light.</span></figcaption></figure><figure><img src="56.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>56</b> Honest Pixels<br><span>Real photographs, rounded down by code, captioned with exactly what was done to them.</span></figcaption></figure><figure><img src="57.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>57</b> Escape Vector<br><span>Public-domain spaceflight pushed to hard black and white, with one re-entry red for everything alive.</span></figcaption></figure><figure><img src="58.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>58</b> Specimen Drop<br><span>A product-drop page for a whole company: every product is a crystal on a live lapis geode.</span></figcaption></figure><figure><img src="59.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>59</b> Cover Story<br><span>The current issue of a magazine about one company, with stickers you can peel off and slap anywhere.</span></figcaption></figure><figure><img src="60.jpg" alt="" loading="lazy" width="720" height="450"><figcaption><b>60</b> Pocket Planet<br><span>A pocket-sized voxel world that never stops working, and a cursor that keeps prying it apart.</span></figcaption></figure></main></body></html>
