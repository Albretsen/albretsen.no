<!doctype html>
<html><head><meta charset="utf-8"><title>og</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist+Mono:wght@400..700&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#050d1c}
.bg{position:absolute;inset:0;background:url(../hero/wallpaper@2x.webp) 50% 38%/1300px auto no-repeat}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,13,28,0) 45%,rgba(5,13,28,.75) 100%)}
.win{position:absolute;left:64px;bottom:58px;width:640px;background:#f5eede url(../extras/paper-cream.webp);border-radius:14px;
  box-shadow:3px 5px 0 rgba(2,6,15,.5),14px 24px 40px rgba(2,6,15,.5);transform:rotate(-1.2deg);padding:0 0 26px}
.bar{height:38px;margin:8px 8px 18px;border-radius:9px;background:#f68c26 url(../extras/paper-sodium.webp);display:flex;align-items:center;gap:8px;padding:0 14px;
  font:600 14px "Geist Mono";color:#050d1c}
.bar i{width:11px;height:11px;border-radius:50%;background:#050d1c;opacity:.85}.bar span{margin-left:auto;margin-right:auto;transform:translateX(-30px)}
.wm{display:block;height:74px;margin:6px 30px 12px}
p{margin:0 32px;font:500 21px/1.35 "Geist Mono";color:#122a52}
.tape{position:absolute;width:120px;height:34px;background:url(../extras/tape.svg) center/100% 100%}
.t1{left:-30px;top:-8px;transform:rotate(-28deg)}.t2{right:-34px;bottom:-6px;transform:rotate(-24deg)}
.sticker{position:absolute;right:72px;bottom:70px;width:170px;transform:rotate(9deg);filter:drop-shadow(2px 4px 2px rgba(2,6,15,.5))}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="win"><div class="tape t1"></div><div class="tape t2"></div>
  <div class="bar"><i></i><i></i><i></i><span>albretsen.no</span></div>
  <img class="wm" src="../identity/wordmark-on-paper.svg" alt="">
  <p>I build software that pays for itself.</p>
</div>
<img class="sticker" src="../extras/sticker-shipped.svg" alt="">
</body></html>
