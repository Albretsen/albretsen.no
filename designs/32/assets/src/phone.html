<!doctype html>
<html><head><meta charset="utf-8"><title>phone QA</title>
<style>body{margin:0;display:flex;gap:10px;background:#000}iframe{width:390px;height:1400px;border:0;background:#fff}</style></head>
<body><script>
// QA helper: renders preview.html (or ?src=...) in 390px iframes, since headless Chrome has a 500px minimum window.
const q = new URLSearchParams(location.search), src = q.get('src') || '../preview.html';
(q.get('v') || ',').split(',').forEach((v) => { const f = document.createElement('iframe'); f.src = src + (v ? '?only=' + v : ''); document.body.appendChild(f); });
</script></body></html>
