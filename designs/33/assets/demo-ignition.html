<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ignition loader demo</title>
<link rel="icon" href="identity/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="motion.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--u-night); color: var(--u-vellum); font-family: var(--u-sans); }
  .page { height: 100%; display: grid; place-items: center; background: url(hero/orion-wide-2400.webp) 60% 50% / cover; }
  .page h1 { font: 400 clamp(48px, 8vw, 120px)/.9 var(--u-serif); margin: 0; text-align: center; padding: 0 16px; text-shadow: 0 2px 40px #000; }
  .page h1 i { color: var(--u-haze); }
  button { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); all: unset; }
  .replay { position: fixed; bottom: 24px; left: 50%; translate: -50% 0; cursor: pointer; font: 500 11px/1 var(--u-mono); letter-spacing: .2em; text-transform: uppercase; color: var(--u-haze); padding: 12px 18px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--u-rule); background: var(--u-deep); }
</style>
</head>
<body>
<div class="page"><h1>Software that<br><i>pays for itself.</i></h1></div>
<span class="replay" role="button" tabindex="0">Replay ignition</span>
<script type="module">
  import { ignite } from './js/motion.js';
  const q = new URLSearchParams(location.search);
  const at = q.get('t'); // inspection: ?t=1400 freezes the choreography at 1400 ms
  const run = () => ignite(at ? { until: new Promise(() => {}), maximum: 1e9, minimum: 1e9 } : { until: document.fonts.ready });
  await document.fonts.ready;
  run();
  if (at) requestAnimationFrame(() => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = +at; }));
  document.querySelector('.replay').addEventListener('click', run);
</script>
</body>
</html>
