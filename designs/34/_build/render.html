<!doctype html>
<meta charset="utf-8">
<title>render</title>
<style>html,body{margin:0;background:#060807;overflow:hidden}canvas{display:block;width:100vw!important;height:auto!important}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<body>
<script>addEventListener('unhandledrejection',e=>{const t=document.createElement('textarea');t.id='out';t.textContent='ERR '+(e.reason&&e.reason.stack||e.reason);document.body.append(t)});addEventListener('error',e=>{const t=document.createElement('textarea');t.id='out';t.textContent='ERR '+e.message;document.body.append(t)})</script>
<script type="module">
// Offline still renderer for design 34 "Tension Prism".
// ?scene=crystal-a | lattice-field | product&p=<id> | og   &w=&h=
import * as THREE from 'three';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

const q = new URLSearchParams(location.search);
const scene_ = q.get('scene') || 'crystal-a';
const W = +(q.get('w') || 2880), H = +(q.get('h') || 1600);
const MINT = new THREE.Color('#39FD9E');
const S3 = Math.sqrt(3) / 2;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = +(q.get('exp') || 1.0);
document.body.append(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#060807');
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);

const hdr = await new RGBELoader().loadAsync('src/studio_1k.hdr');
hdr.mapping = THREE.EquirectangularReflectionMapping;
scene.environment = hdr;
scene.environmentIntensity = +(q.get('env') || 1.0);

// seeded random (salt 6c586a)
let seed = 0x6c586a;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

function triShape(s, up = true) {
  const sh = new THREE.Shape();
  const h = s * S3;
  if (up) { sh.moveTo(0, h * 2 / 3); sh.lineTo(s / 2, -h / 3); sh.lineTo(-s / 2, -h / 3); }
  else { sh.moveTo(0, -h * 2 / 3); sh.lineTo(-s / 2, h / 3); sh.lineTo(s / 2, h / 3); }
  sh.closePath();
  return sh;
}
function prismGeo(s, depth, up = true, bevel = 0.04) {
  const g = new THREE.ExtrudeGeometry(triShape(s, up), { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 4, curveSegments: 1 });
  g.translate(0, 0, -depth / 2);
  g.computeVertexNormals();
  return g;
}
const glass = (o = {}) => new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0, roughness: 0.03, transmission: 1, thickness: 1.0, ior: 1.52,
  dispersion: 4, specularIntensity: 1, envMapIntensity: 1.2, clearcoat: 1, clearcoatRoughness: 0.02, ...o,
});

// a long glowing bar (the beam), emissive, picked up by bloom
function beam(len, thick, color = MINT, intensity = 6) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(thick, thick, len, 16, 1, true),
    new THREE.MeshBasicMaterial({ color: color.clone().multiplyScalar(intensity), toneMapped: false }));
  return m;
}
// soft gradient backdrop (radial mint glow)
function glowPlane(w, h, color, strength = 1, falloff = 2.2) {
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false,
    uniforms: { c: { value: color }, s: { value: strength }, f: { value: falloff } },
    vertexShader: 'varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader: 'uniform vec3 c; uniform float s; uniform float f; varying vec2 vUv; void main(){ float d=length((vUv-.5)*vec2(1.,1.)); float a=pow(clamp(1.-d*2.,0.,1.),f)*s; gl_FragColor=vec4(c*a,a);}',
  });
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
}
// fan of dispersed light (a wedge with mint→white gradient)
function fan(len, spread, color) {
  const g = new THREE.BufferGeometry();
  const N = 24, pos = [], uv = [];
  for (let i = 0; i < N; i++) {
    const a0 = -spread / 2 + spread * i / N, a1 = -spread / 2 + spread * (i + 1) / N;
    pos.push(0, 0, 0, Math.cos(a0) * len, Math.sin(a0) * len, 0, Math.cos(a1) * len, Math.sin(a1) * len, 0);
    uv.push(0, (i + .5) / N, 1, i / N, 1, (i + 1) / N);
  }
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, toneMapped: false,
    uniforms: { c: { value: color } },
    vertexShader: 'varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader: `uniform vec3 c; varying vec2 vUv; void main(){
      float across = vUv.y; float along = vUv.x;
      vec3 col = mix(vec3(1.0), c, smoothstep(0.15, 0.85, across));
      col = mix(col, c*0.35, smoothstep(0.85,1.0,across));
      float a = (1.0-along*0.85) * smoothstep(0.0,0.08,along) * (0.35 + 0.65*sin(across*3.14159));
      a *= 0.55 + 0.45*sin(across*60.0 + along*4.0)*0.5+0.25;
      gl_FragColor = vec4(col*a*1.6, a);
    }`,
  });
  return new THREE.Mesh(g, mat);
}
function slatBox(w, h, x, y, z, n = 40) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = q.get('slatbg') || '#000'; g.fillRect(0, 0, 1024, 1024);
  const grd = g.createRadialGradient(512, 512, 40, 512, 512, 512);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(0.3, 'rgba(170,255,215,0.7)'); grd.addColorStop(0.7, 'rgba(57,253,158,0.12)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  for (let i = 0; i < n; i++) {
    const yy = i * 1024 / n;
    g.fillStyle = grd; g.fillRect(0, yy, 1024, 1024 / n * (i % 3 === 0 ? 0.42 : 0.18));
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: t, color: new THREE.Color(1.1, 1.1, 1.1) }));
  m.position.set(x, y, z); m.rotation.z = 0.12; return m;
}
function backdrop(w, h, z) {
  const mat = new THREE.ShaderMaterial({
    uniforms: { c: { value: MINT } },
    vertexShader: 'varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader: 'uniform vec3 c; varying vec2 vUv; void main(){ vec2 p=(vUv-vec2(.47,.5))*vec2(1.6,1.0); float d=length(p); float band=exp(-pow((vUv.y-.49)*9.,2.)); vec3 col=vec3(.0015,.002,.0018)+c*(.018*exp(-d*d*9.)+.012*band);'+
      ' vec2 r=vUv-vec2(.47,.5); float a=-0.25; vec2 rr=vec2(cos(a)*r.x-sin(a)*r.y, sin(a)*r.x+cos(a)*r.y);'+
      ' float slat=step(.6,fract(rr.x*260.)); float win=exp(-pow(rr.x*22.,2.)-pow(rr.y*9.,2.));'+
      ' col+= mix(vec3(1.),c,.5)*slat*win*0.9; gl_FragColor=vec4(col,1.);}',
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.z = z; return m;
}
function floor(y, rough = 0.18) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshPhysicalMaterial({ color: 0x050605, roughness: rough, metalness: 0.0, clearcoat: 1, clearcoatRoughness: 0.08, envMapIntensity: 0.25 }));
  m.rotation.x = -Math.PI / 2; m.position.y = y; return m;
}

async function loadImage(url, px = 1024) {
  const img = new Image(); img.crossOrigin = 'anonymous'; img.src = url; await img.decode();
  const c = document.createElement('canvas'); c.width = c.height = px;
  const ctx = c.getContext('2d');
  return { img, c, ctx };
}

// ───────────────────────── scenes ─────────────────────────
const scenes = {
  // Hero 1: the Prism A mark as 21 real glass prisms, a mint ray through it.
  async 'crystal-a'() {
    camera.position.set(-1.2, 0.4, 13.5); camera.lookAt(0.9, 0.1, 0); camera.fov = 24;
    const s = 1.0, h = s * S3, ROWS = 5;
    const remove = new Set(['2,2', '4,3', '4,4', '4,5']);
    const mint = new Set(['0,0', '3,5', '4,7']);
    const group = new THREE.Group();
    for (let r = 0; r < ROWS; r++) for (let i = 0; i <= 2 * r; i++) {
      if (remove.has(`${r},${i}`)) continue;
      const up = i % 2 === 0;
      const x = -r * s / 2 + Math.floor(i / 2) * s + (up ? 0 : s / 2);
      const y = -(r * h + (up ? h * 2 / 3 : h / 3)) + ROWS * h / 2;
      const isMint = mint.has(`${r},${i}`);
      const d = 0.8 + rnd() * 0.7;
      const m = new THREE.Mesh(prismGeo(s * 0.9, d, up, 0.035), glass(isMint ? { color: MINT, attenuationColor: MINT, attenuationDistance: 0.5, thickness: 1.4, emissive: MINT, emissiveIntensity: 0.18 } : { thickness: 1.1 }));
      m.position.set(x, y, (rnd() - 0.5) * 0.7);
      m.rotation.set((rnd() - 0.5) * 0.7, (rnd() - 0.5) * 1.0, (rnd() - 0.5) * 0.1);
      group.add(m);
    }
    group.rotation.y = -0.32; group.rotation.x = 0.06;
    scene.add(group);
    // the ray: enters at the apex from upper-left, exits through the mint facets, fans out right
    const inRay = beam(16, 0.022, new THREE.Color('#ffffff'), 6);
    inRay.rotation.z = 0.927; inRay.position.set(-6.4, 1.6 + 6.4, 0); scene.add(inRay);
    const f = fan(14, 0.42, MINT); f.position.set(1.4, -0.9, -1.5); f.rotation.z = -0.5; scene.add(f);
    const g1 = glowPlane(14, 14, MINT.clone().multiplyScalar(0.55), 0.9, 2.6); g1.position.set(2.5, -1.2, -4); scene.add(g1);
    const g2 = glowPlane(10, 10, new THREE.Color('#ffffff').multiplyScalar(0.05), 1, 3); g2.position.set(-2, 1.5, -5); scene.add(g2);
    // a backplate grid of thin lines refracted through the glass
    const lines = new THREE.Group();
    for (let k = -14; k <= 14; k++) {
      const l = new THREE.Mesh(new THREE.PlaneGeometry(0.012, 30), new THREE.MeshBasicMaterial({ color: new THREE.Color('#ffffff').multiplyScalar(k % 5 === 0 ? 0.16 : 0.05) }));
      l.position.set(k * 0.45, 0, -2.6); l.rotation.z = -0.4; lines.add(l);
    }
    // scene.add(lines);
    // slatted light box behind the A: gives the glass something to bend
    scene.add(slatBox(11, 9, 0.2, 0.0, -2.6, 36));
    scene.environmentIntensity = 0.55;
    return { bloom: [0.6, 0.5, 0.55] };
  },

  // Hero 2: "Burst" — the lattice blown apart: glass triangles hang in black
  // space at many depths, a mint slit light behind them bends through each one.
  async 'shards'() {
    camera.position.set(0, 0, 16); camera.lookAt(0, 0, 0); camera.fov = 32;
    scene.environmentIntensity = 0.32;
    const N = 46;
    for (let i = 0; i < N; i++) {
      const up = rnd() > 0.5;
      const size = 0.3 + Math.pow(rnd(), 2.6) * 3.2;
      const t = rnd();
      // spiral burst outward from a point left of centre
      const ang = rnd() * Math.PI * 2;
      const rad = 0.8 + Math.pow(rnd(), 0.8) * 9.5;
      const x = -1.5 + Math.cos(ang) * rad * 1.35, y = Math.sin(ang) * rad * 0.62, z = -6 + rnd() * 12 - rad * 0.25;
      const isMint = rnd() < 0.16;
      const m = new THREE.Mesh(prismGeo(size, size * (0.18 + rnd() * 0.3), up, Math.min(0.06, size * 0.03)),
        glass(isMint ? { color: MINT, attenuationColor: MINT, attenuationDistance: 0.6, thickness: size * 0.6, emissive: MINT, emissiveIntensity: 0.12 } : { thickness: size * 0.5, dispersion: 6 }));
      m.position.set(x, y, z);
      m.rotation.set(rnd() * Math.PI, rnd() * Math.PI, rnd() * Math.PI);
      scene.add(m);
    }
    // vertical slat lightbox + a horizontal mint slit, behind everything
    scene.add(backdrop(80, 50, -14));
    const slit = beam(60, 0.025, new THREE.Color('#d9ffe9'), 9); slit.rotation.z = Math.PI / 2 + 0.06; slit.position.set(0, -0.4, -10); scene.add(slit);
    const g = glowPlane(30, 6, MINT.clone().multiplyScalar(0.35), 1, 3.0); g.position.set(-1.5, -0.4, -10.5); scene.add(g);
    return { bloom: [0.5, 0.4, 0.88] };
  },

  // Product: the REAL app icon as a tile standing on black glass, a glass prism
  // beside it refracting the icon; mint rim light from behind.
  async product() {
    const p = q.get('p');
    const src = {
      'mcp-emails': { url: '../../_shared/products/mcp-emails/icon.png', kind: 'img' },
      'fun-libs': { url: '../../_shared/products/fun-libs/icon.png', kind: 'img' },
      'toolrails': { url: '../../_shared/products/toolrails/icon.svg', kind: 'img' },
      'harbor': { url: '../../_shared/products/harbor/harbor-mark.svg', kind: 'harbor' },
    }[p];
    const { img, c, ctx } = await loadImage(src.url, 1024);
    if (src.kind === 'harbor') {
      // Harbor's own banner treatment: cream mark on #1b1b1b
      ctx.fillStyle = '#1B1B1B'; ctx.fillRect(0, 0, 1024, 1024);
      const svgTxt = await (await fetch(src.url)).text();
      const colored = svgTxt.replace(/currentColor/g, '#F2EEE6');
      const im2 = new Image(); im2.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(colored); await im2.decode();
      ctx.drawImage(im2, 192, 192, 640, 640);
    } else {
      ctx.drawImage(img, 0, 0, 1024, 1024);
    }
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
    // rounded tile
    const R = 0.42, S = 2.4;
    const sh = new THREE.Shape();
    const a = S / 2;
    sh.moveTo(-a + R, -a); sh.lineTo(a - R, -a); sh.quadraticCurveTo(a, -a, a, -a + R); sh.lineTo(a, a - R); sh.quadraticCurveTo(a, a, a - R, a);
    sh.lineTo(-a + R, a); sh.quadraticCurveTo(-a, a, -a, a - R); sh.lineTo(-a, -a + R); sh.quadraticCurveTo(-a, -a, -a + R, -a);
    const tileGeo = new THREE.ExtrudeGeometry(sh, { depth: 0.16, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04, bevelSegments: 6, curveSegments: 24 });
    // planar UVs on the front face from x/y
    const pos = tileGeo.attributes.position, uv = tileGeo.attributes.uv;
    for (let i = 0; i < pos.count; i++) uv.setXY(i, (pos.getX(i) + a) / S, (pos.getY(i) + a) / S);
    // the logo face stays colour-true: unlit, not tone-mapped
    const faceMat = new THREE.MeshBasicMaterial({ map: tex, toneMapped: false });
    const sideMat = new THREE.MeshPhysicalMaterial({ color: 0x111312, roughness: 0.2, clearcoat: 1, envMapIntensity: 0.6 });
    const tile = new THREE.Mesh(tileGeo, [faceMat, sideMat]);
    // ExtrudeGeometry groups: 0 = caps (front/back), 1 = sides
    const tileY = -1.2 + a + 0.05;
    tile.position.set(-1.0, tileY, 0.0);
    tile.rotation.y = 0.5;
    scene.add(tile);
    // glossy clear coat over the face, for a real reflection
    const coat = new THREE.Mesh(new THREE.ShapeGeometry(sh, 24), new THREE.MeshPhysicalMaterial({ color: 0x000000, transparent: true, opacity: 0.0, roughness: 0.05, metalness: 0, clearcoat: 1, envMapIntensity: 0.9, transmission: 0 }));
    // glass prism to the right, lying on its side: it bends the icon AND the slats
    const pr = new THREE.Mesh(prismGeo(2.9, 1.1, true, 0.07), glass({ thickness: 1.6, dispersion: 8, roughness: 0.01, envMapIntensity: 0.9 }));
    pr.rotation.set(0, -0.42, 0); pr.position.set(1.25, -1.2 + 2.9 * S3 / 3 + 0.08, 0.7);
    scene.add(pr);
    // small mint crystal in front, a brand accent
    scene.add(backdrop(60, 36, -9));
    const mirror = new Reflector(new THREE.PlaneGeometry(60, 60), { textureWidth: W, textureHeight: H, color: 0x151816 });
    mirror.rotation.x = -Math.PI / 2; mirror.position.y = -1.2; scene.add(mirror);
    // fade the reflection into black with distance
    const fade = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShaderMaterial({ transparent: true, depthWrite: false,
      vertexShader: 'varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }',
      fragmentShader: 'varying vec3 vW; void main(){ float a=smoothstep(1.2,-3.5,vW.z)*0.0 + smoothstep(2.6, 6.5, abs(vW.z - 0.5)+abs(vW.x)*0.35); gl_FragColor=vec4(0.004,0.005,0.0045, clamp(0.35+a,0.,1.)); }' }));
    fade.rotation.x = -Math.PI / 2; fade.position.y = -1.195; scene.add(fade);
    const slit = beam(40, 0.018, new THREE.Color('#d9ffe9'), 7); slit.rotation.z = Math.PI / 2; slit.position.set(0, -1.15, -5); scene.add(slit);
    scene.environmentIntensity = 0.4;
    camera.position.set(0.5, 0.9, 10.5); camera.lookAt(0.3, -0.05, 0); camera.fov = 26;
    renderer.toneMapping = THREE.NoToneMapping;
    return { bloom: [0.4, 0.4, 0.92] };
  },
};

let opts;
try { opts = await scenes[scene_ in scenes ? scene_ : 'crystal-a'](); } catch (e) { await fetch('http://127.0.0.1:6135/save?name=error', { method: 'POST', body: String(e.stack), headers: { 'Content-Type': 'text/plain' } }); throw e; }
// portrait / custom framing overrides: &fov=40&look=x,y,z&cam=x,y,z
if (q.get('cam')) camera.position.set(...q.get('cam').split(',').map(Number));
if (q.get('look')) camera.lookAt(...q.get('look').split(',').map(Number));
if (q.get('fov')) camera.fov = +q.get('fov');
camera.aspect = W / H; camera.updateProjectionMatrix();
const composer = new EffectComposer(renderer);
composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const [st, ra, th] = opts.bloom;
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), st, ra, th));
composer.addPass(new OutputPass());
composer.render(); composer.render();
const data = renderer.domElement.toDataURL('image/png');
const name = q.get('out') || (scene_ + (q.get('p') ? '-' + q.get('p') : '') + '.png');
await fetch('http://127.0.0.1:6135/save?name=' + name, { method: 'POST', body: data, headers: { 'Content-Type': 'text/plain' } });
document.title = 'done';
</script>
