<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prism Wordmark Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Geist+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
  :root{--ink:#060807;--mint:#39fd9e;--paper:#f4fff8}
  html,body{margin:0;background:var(--ink);color:var(--paper);font:14px/1.4 'Geist Mono',monospace}
  main{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:24px;padding:24px 16px;box-sizing:border-box}
  #wm{width:min(1400px,100%);margin:auto}
  nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  button{font:inherit;color:var(--paper);background:transparent;border:1px solid rgb(255 255 255/.2);padding:8px 12px;border-radius:999px}
  button:hover{border-color:var(--mint);color:var(--mint)}
  #three{height:60vh;min-height:320px;border-top:1px solid rgb(255 255 255/.1)}
  p{text-align:center;opacity:.6;margin:0}
</style>
<main>
  <p>Move over the word (tension) · click to burst · pick a word to morph</p>
  <div>
    <div id="wm"></div>
    <nav id="nav"></nav>
  </div>
  <div id="three"></div>
</main>
<script type="module">
  import { PrismWordmark } from './prism-wordmark.js';
  import { initPrismCursor } from './prism-cursor.js';
  import { mountPrismScene } from './prism-scene.js';
  const words = ['ALBRETSEN', 'MCP EMAILS', 'FUN LIBS', 'TOOLRAILS', 'HARBOR'];
  const pw = await PrismWordmark.mount(document.getElementById('wm'), { words });
  for (const w of words) {
    const b = document.createElement('button'); b.textContent = w; b.dataset.cursor = 'Morph';
    b.onclick = () => pw.morphTo(w); document.getElementById('nav').append(b);
  }
  const qw = new URLSearchParams(location.search).get('w'); if (qw) setTimeout(() => pw.morphTo(qw), 2600);
  initPrismCursor();
  const io = new IntersectionObserver(async ([e]) => { if (e.isIntersecting) { io.disconnect(); await mountPrismScene(document.getElementById('three')); } });
  io.observe(document.getElementById('three'));
</script>
</html>
