<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Joke Central (retired)">
  <defs>
    <radialGradient id="c" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2a1d" stop-opacity=".35"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="12"/>
      <feColorMatrix values="0 0 0 0 .2  0 0 0 0 .14  0 0 0 0 .09  0 0 0 .22 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="press" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="1.2" in="SourceAlpha" result="o"/>
      <feGaussianBlur in="o" stdDeviation=".6" result="b"/>
      <feFlood flood-color="#fff" flood-opacity=".55"/><feComposite in2="b" operator="in" result="hl"/>
      <feMerge><feMergeNode in="hl"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="80" cy="146" rx="52" ry="7" fill="#3a2a1d" opacity=".16"/>
  <circle cx="80" cy="78" r="64" fill="#d39e74"/>
  <circle cx="80" cy="78" r="64" fill="url(#c)"/>
  <circle cx="80" cy="78" r="64" fill="#d39e74" filter="url(#grain)"/>
  <circle cx="80" cy="78" r="52" fill="none" stroke="#3a2a1d" stroke-opacity=".18" stroke-width="1"/>
  <g transform="translate(45.2 43.2) scale(2.9)" fill="none" stroke="#3b2c20" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#press)"><circle cx="12" cy="12" r="8.5"/><path d="M8 14c1 1.6 2.4 2.4 4 2.4s3-.8 4-2.4"/><path d="M8.6 9.6h.01M15.4 9.6h.01"/><circle class="g" fill="#2f6f8a" stroke="none" cx="15.4" cy="9.6" r="1.4"/></g>
</svg>
