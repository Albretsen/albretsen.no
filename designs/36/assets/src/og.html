<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card (source)</title>
<!-- Source page used to bake identity/og.png. Render at 1200x630. -->
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Bricolage+Grotesque:opsz,wght@12..96,500&family=Martian+Mono:wdth,wght@87.5,500&display=block" rel="stylesheet">
<style>
  * { margin:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; background:#170733; }
  .layer { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 62%; }
  .word { position:absolute; left:0; right:0; top:34px; text-align:center; font:400 270px/1 'Gloock', serif; letter-spacing:-.02em; color:#fff1e2; text-shadow:0 0 60px rgba(255,90,140,.35); }
  .bf { position:absolute; width:210px; left:950px; top:318px; transform:rotate(-12deg); filter:drop-shadow(0 18px 18px rgba(23,7,51,.55)); }
  .bar { position:absolute; left:44px; right:44px; bottom:36px; display:flex; align-items:center; justify-content:space-between; color:#fff1e2; }
  .bar img { width:64px; height:64px; }
  .line { font:500 30px/1.1 'Bricolage Grotesque'; margin-left:18px; }
  .url { font:500 20px/1 'Martian Mono'; letter-spacing:.12em; text-transform:uppercase; padding:12px 18px; border-radius:99px; background:#e8287f; }
  .l { display:flex; align-items:center; }
</style>
</head>
<body>
  <img class="layer" src="../hero/horizon-1440.webp" alt="">
  <div class="word">Albretsen</div>
  <img class="layer" src="../hero/horizon-front-1440.webp" alt="">
  <img class="bf" src="../illustrations/butterfly-black-and-gold.webp" alt="">
  <div class="bar"><div class="l"><img src="../identity/mark.svg" alt=""><div class="line">I build software that pays for itself.</div></div><div class="url">albretsen.no</div></div>
</body>
</html>
