<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chamber demo</title>
<link rel="icon" href="../identity/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  :root{--paper:#fff8fb;--ink:#1e0915;--rose:#d64d9d;--line:#f4b0d2}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Geist Mono",ui-monospace,monospace}
  .wrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;padding:16px;min-height:100vh;box-sizing:border-box}
  .panel{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#fff8fb,#f9d3e5)}
  .panel.dark{background:radial-gradient(ellipse at 50% 40%,#5e1942,#0e0409)}
  canvas#chamber{width:100%;height:100%;display:block;min-height:70vh}
  #specimen{position:absolute;inset:0}
  .cap{position:absolute;left:14px;bottom:12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#892361;pointer-events:none}
  .dark .cap{color:#e781b7}
  @media (max-width:760px){.wrap{grid-template-columns:1fr}.panel.dark{min-height:60vh}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel"><canvas id="chamber" aria-label="Physics chamber: chrome letters you can grab and throw"></canvas><div class="cap">chamber.js · drag a letter and throw it · click empty space</div></div>
  <div class="panel dark"><div id="specimen"></div><div class="cap">specimen.js · drag to turn · hover to close the fracture</div></div>
</div>
<script type="module">
  import { mountChamber } from './chamber.js';
  import { mountSpecimen } from './specimen.js';
  mountChamber(document.getElementById('chamber'), { theme: 'light', settled: new URLSearchParams(location.search).has('settled') });
  mountSpecimen(document.getElementById('specimen'));
</script>
</body>
</html>
