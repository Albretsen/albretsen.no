<!doctype html>
<!-- Renders one generative work flat, for export. print.html?series=&seed=&hue=&w=&h=&pass= -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<script type="module">
import { compose, paint } from '../js/art.js'
const q = new URLSearchParams(location.search)
await document.fonts.load('20px "JetBrains Mono"')
const w = +q.get('w') || 1200, h = +q.get('h') || 1500
const c = document.createElement('canvas'); c.width = w; c.height = h; document.body.append(c)
paint(c.getContext('2d'), compose({ series: q.get('series') || 'filaments', seed: parseInt(q.get('seed') || '500a48', 16), hue: +(q.get('hue') || 168), w, h }), { pass: q.get('pass') || 'lit' })
</script></body></html>
