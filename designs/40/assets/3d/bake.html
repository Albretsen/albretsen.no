<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Specimen bake</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#f6f0e0;overflow:hidden}canvas{display:block}#gl{position:absolute;left:-99999px}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="out"></canvas>
<script type="module">
// Offline "photograph" of Specimen No. 1. Renders N jittered frames (soft area
// light, lens aperture, sub-pixel AA) and averages them, then applies the
// editorial grade (split tone, vignette, film grain). Screenshot to bake.
// ?w=&h=&mode=day|dusk|dawn|macro&frames=&x=&y=&dist=&fov=&rot=
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { buildSpecimen, studioEnvironment } from './specimen-core.js';

const q = new URLSearchParams(location.search);
const W = +q.get('w') || innerWidth, H = +q.get('h') || innerHeight;
const N = +q.get('frames') || 40;
const mode = q.get('mode') || 'day';
const MODES = {
  day:  { bg: 0xf3ead6, floor: 0xf1e7d1, sun: 0xfff1da, sunI: 3.4, sunPos: [-4.5, 9, 2.2], fill: 0xfff6e6, ground: 0xb8a37a, hemiI: 1.1, env: 1.0, glow: 0, fog: [16, 44], radius: 1.1, rim: 0x9fd0b4, rimI: 1.2, exposure: 1.0 },
  dawn: { bg: 0xf2dfd6, floor: 0xf0dccf, sun: 0xffc9a0, sunI: 3.6, sunPos: [-9, 2.6, 3], fill: 0xffe7ea, ground: 0xa38a7a, hemiI: 0.9, env: 0.9, glow: 0.2, fog: [16, 44], radius: 0.8, rim: 0xffd0e8, rimI: 1.6, exposure: 1.0 },
  dusk: { bg: 0x1f3a31, floor: 0x3a5e50, fl: 0.5, sun: 0xffb768, sunI: 5, sunPos: [-9, 2.4, 1], fill: 0x4a6896, ground: 0x0c1712, hemiI: 0.7, env: 0.45, glow: 0.75, fog: [15, 40], radius: 0.6, rim: 0x7f9fe0, rimI: 2.4, exposure: 1.08, bloom: 0.32, bloomT: 0.5 },
  gold: { bg: 0xf4e4cc, floor: 0xf4e6d6, fl: 0.44, sun: 0xffcf96, sunI: 4.6, sunPos: [-6, 5.5, 3.5], fill: 0xffeedd, ground: 0x9a8064, hemiI: 0.8, env: 0.8, glow: 0.12, fog: [14, 30], radius: 0.7, rim: 0xffcf9a, rimI: 1.6, exposure: 1.0, bloom: 0.25 },
  macro:{ bg: 0xeee3cb, floor: 0xece0c7, sun: 0xfff1da, sunI: 3.4, sunPos: [5, 9, 1.5], fill: 0xfff6e6, ground: 0xb8a37a, hemiI: 1.0, env: 1.0, glow: 0.05, fog: [14, 40], radius: 1.4, rim: 0x9fd0b4, rimI: 1.4, exposure: 1.0 },
}[mode];

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, canvas: Object.assign(document.createElement('canvas'), { id: 'gl' }) });
document.body.appendChild(renderer.domElement);
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = MODES.exposure;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(MODES.bg);
scene.fog = new THREE.Fog(MODES.bg, MODES.fog[0], MODES.fog[1]);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(studioEnvironment(THREE, mode === 'dusk' ? { tint: 0x0a1712, warm: 0xffb060, key: 4 } : {}), 0.02).texture;
scene.environmentIntensity = MODES.env;

const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: new THREE.Color(MODES.floor).multiplyScalar(+(q.get('fl') || MODES.fl || 0.62)), roughness: 1, envMapIntensity: 0.25 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -2.05; floor.receiveShadow = true;
scene.add(floor);

const spec = buildSpecimen(THREE, mergeGeometries, { quality: 2, glow: MODES.glow });
spec.rotation.set(+(q.get('rx') || 0.42), +(q.get('rot') || 0.6), +(q.get('rz') || 0.18));
scene.add(spec);

scene.add(new THREE.HemisphereLight(MODES.fill, MODES.ground, MODES.hemiI));
const sun = new THREE.DirectionalLight(MODES.sun, MODES.sunI);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 30 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; sun.shadow.camera.updateProjectionMatrix();
if (q.has('sr')) MODES.radius = +q.get('sr');
scene.add(sun, sun.target);
const rim = new THREE.DirectionalLight(MODES.rim, MODES.rimI); rim.position.set(5, 3, -6); scene.add(rim);
if (MODES.glow) { const p = new THREE.PointLight(0xe060c0, 6 * MODES.glow, 6, 2); scene.add(p); }

const fov = +q.get('fov') || 26, dist = +q.get('dist') || 10;
const cam = new THREE.PerspectiveCamera(fov, W / H, 0.1, 100);
const target = new THREE.Vector3(+(q.get('x') || 0), +(q.get('y') || -0.35), 0);
const camBase = new THREE.Vector3(target.x + +(q.get('cx') || 0), 3.4 + +(q.get('cy') || 0), dist);
const aperture = +(q.get('ap') || 0.05);

const acc = new Float32Array(W * H * 4), px = new Uint8Array(W * H * 4);
const right = new THREE.Vector3(), upv = new THREE.Vector3();
function disk(i, n) { const r = Math.sqrt((i + 0.5) / n), a = i * 2.39996323; return [r * Math.cos(a), r * Math.sin(a)]; }
for (let i = 0; i < N; i++) {
  const [lx, ly] = disk(i, N);
  sun.position.set(MODES.sunPos[0] + lx * MODES.radius, MODES.sunPos[1] + ly * MODES.radius, MODES.sunPos[2] + lx * ly * MODES.radius);
  const [ax, ay] = disk((i * 7) % N, N);
  cam.position.copy(camBase); cam.lookAt(target);
  right.setFromMatrixColumn(cam.matrixWorld, 0); upv.setFromMatrixColumn(cam.matrixWorld, 1);
  cam.position.addScaledVector(right, ax * aperture).addScaledVector(upv, ay * aperture);
  cam.lookAt(target);
  cam.setViewOffset(W, H, (Math.random() - 0.5), (Math.random() - 0.5), W, H);
  renderer.render(scene, cam);
  const gl = renderer.getContext();
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
  for (let k = 0; k < px.length; k++) acc[k] += px[k];
}

// Editorial grade
const out = document.getElementById('out'); out.width = W; out.height = H;
out.style.width = W + 'px'; out.style.height = H + 'px';
const ctx = out.getContext('2d');
const img = ctx.createImageData(W, H);
const dark = mode === 'dusk';
const shadowTint = dark ? [8, 22, 22] : [18, 40, 28];   // forest into the shadows
const hiTint = dark ? [255, 214, 160] : [255, 246, 228]; // brass into the highlights
let seed = 1234567;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
// Halation / bloom: threshold, downsample x4, three box-blur passes.
const BS = 4, bw = Math.ceil(W / BS), bh = Math.ceil(H / BS);
let bl = new Float32Array(bw * bh * 3);
const thr = MODES.bloomT ?? 0.94, bAmt = MODES.bloom ?? 0.12;
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = (y * W + x) * 4; const r = acc[i] / N / 255, g = acc[i + 1] / N / 255, b = acc[i + 2] / N / 255;
  const l = Math.max(r, g, b); if (l <= thr) continue;
  const k = (l - thr) / (1 - thr) / (BS * BS), j = ((y / BS | 0) * bw + (x / BS | 0)) * 3;
  bl[j] += r * k; bl[j + 1] += g * k; bl[j + 2] += b * k;
}
function blur(src, rad) {
  const tmp = new Float32Array(src.length), dst = new Float32Array(src.length);
  for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) for (let c = 0; c < 3; c++) {
    let s = 0, n = 0; for (let d = -rad; d <= rad; d++) { const xx = x + d; if (xx >= 0 && xx < bw) { s += src[(y * bw + xx) * 3 + c]; n++; } } tmp[(y * bw + x) * 3 + c] = s / n; }
  for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) for (let c = 0; c < 3; c++) {
    let s = 0, n = 0; for (let d = -rad; d <= rad; d++) { const yy = y + d; if (yy >= 0 && yy < bh) { s += tmp[(yy * bw + x) * 3 + c]; n++; } } dst[(y * bw + x) * 3 + c] = s / n; }
  return dst;
}
const rad = Math.max(2, Math.round(W / 220));
bl = blur(blur(blur(bl, rad), rad), rad);
for (let y = 0; y < H; y++) {
  const sy = H - 1 - y; // readPixels is bottom-up
  for (let x = 0; x < W; x++) {
    const i = (sy * W + x) * 4, o = (y * W + x) * 4;
    const j = ((sy / BS | 0) * bw + (x / BS | 0)) * 3;
    let r = acc[i] / N / 255 + bl[j] * bAmt * 6, g = acc[i + 1] / N / 255 + bl[j + 1] * bAmt * 6, b = acc[i + 2] / N / 255 + bl[j + 2] * bAmt * 6;
    r = Math.min(r, 1); g = Math.min(g, 1); b = Math.min(b, 1);
    const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    // split tone
    const s = Math.pow(1 - lum, 2.2) * 0.22, h = Math.pow(lum, 3) * 0.12;
    r = r * (1 - s - h) + shadowTint[0] / 255 * s + hiTint[0] / 255 * h;
    g = g * (1 - s - h) + shadowTint[1] / 255 * s + hiTint[1] / 255 * h;
    b = b * (1 - s - h) + shadowTint[2] / 255 * s + hiTint[2] / 255 * h;
    // soft s-curve
    const c = v => v + 0.06 * Math.sin((v - 0.5) * Math.PI * 2) * -0.5 * (dark ? 0.6 : 1);
    r = c(r); g = c(g); b = c(b);
    // vignette
    const dx = (x / W - 0.5) * 1.15, dy = (y / H - 0.5);
    const v = 1 - (dark ? 0.42 : 0.24) * Math.pow(Math.min(1, (dx * dx + dy * dy) * 2.2), 1.3);
    // grain (luminance weighted, finer in highlights)
    const n = (rnd() + rnd() - 1) * (dark ? 0.035 : 0.022) * (1 - lum * 0.5);
    img.data[o] = Math.max(0, Math.min(255, (r * v + n) * 255));
    img.data[o + 1] = Math.max(0, Math.min(255, (g * v + n) * 255));
    img.data[o + 2] = Math.max(0, Math.min(255, (b * v + n) * 255));
    img.data[o + 3] = 255;
  }
}
ctx.putImageData(img, 0, 0);
renderer.domElement.remove();
document.title = 'done';
</script>
</body>
</html>
