<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voxel CSS demo</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fefaed;--ink:#2b3116;--muted:#6d744f;--butter:#fee891}
  body{margin:0;background:var(--bg) url(../patterns/iso-dots.svg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif}
  main{max-width:1100px;margin:0 auto;padding:40px 16px;display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  section{background:#fff;border-radius:20px;padding:20px;box-shadow:0 1px 0 rgba(43,49,22,.06),0 12px 30px -18px rgba(43,49,22,.25)}
  h1{grid-column:1/-1;margin:0;font-size:32px;letter-spacing:-.03em}
  h2{margin:0 0 4px;font-size:18px}
  p{margin:0;color:var(--muted);font:500 13px/1.5 'Geist Mono',monospace}
  .stage{height:300px;margin-top:8px}
  button{font:500 13px 'Geist Mono',monospace;border:0;border-radius:99px;padding:8px 14px;background:var(--butter);color:var(--ink);cursor:pointer;margin-right:6px}
</style></head><body>
<main>
  <h1>Voxels from CSS 3D transforms</h1>
  <section><h2>The mark</h2><p>Drag to orbit. Springs back to the iso angle.</p><div class="stage" id="a"></div>
    <button id="ba">Stack drop</button><button id="bd">Edge drift</button></section>
  <section><h2>The shelf</h2><p>Real product logos on cube faces. Hover a cube.</p><div class="stage" id="b"></div></section>
</main>
<script src="../vendor/motion-12.23.12.js"></script>
<script type="module">
  import { VoxelStage, MODELS } from './voxel-css.js';
  const a = new VoxelStage(document.getElementById('a'), { model: MODELS.mark, unit: 64 });
  a.assemble();
  document.getElementById('ba').onclick = () => a.assemble();
  document.getElementById('bd').onclick = () => a.drift();
  const b = new VoxelStage(document.getElementById('b'), { model: MODELS.shelf('../../../_shared/products/'), unit: 34, rest: { x: -20, y: -24 } });
  b.assemble({ height: 4 });
  // hover: lift the cube under the pointer
  let drop = null;
  document.getElementById('b').addEventListener('pointerover', e => {
    const vox = e.target.closest('.vx-vox'); if (!vox) return;
    const it = b.items.find(i => i.el === vox); if (!it || it.v.id === undefined) return;
    drop && drop(); drop = b.lift(i => i === it, 0.45);
  });
  document.getElementById('b').addEventListener('pointerleave', () => { drop && drop(); drop = null; });
</script>
</body></html>
