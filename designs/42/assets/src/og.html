<!doctype html>
<html><head><meta charset="utf-8"><title>og</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#fefaed url(../patterns/iso-dots.svg);font-family:'Bricolage Grotesque',sans-serif;color:#2b3116;position:relative}
  .room{position:absolute;right:16px;top:-6px;width:560px;height:648px}
  .room img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .room .now{clip-path:polygon(50% 0,100% 0,100% 100%,50% 100%)}
  .room .then{clip-path:polygon(0 0,50% 0,50% 100%,0 100%)}
  .seam{position:absolute;left:50%;top:60px;bottom:40px;width:2px;background:repeating-linear-gradient(#2b3116 0 6px,transparent 6px 12px);opacity:.25}
  .yr{position:absolute;top:96px;font:500 15px 'Geist Mono',monospace;letter-spacing:.04em;padding:6px 10px;border-radius:99px;background:#fff;box-shadow:0 2px 0 rgba(43,49,22,.08)}
  .yr.a{left:120px}.yr.b{right:120px;background:#fee891}
  .lock{position:absolute;left:64px;top:64px;height:46px}
  h1{position:absolute;left:64px;top:190px;width:520px;margin:0;font-weight:700;font-size:68px;line-height:.98;letter-spacing:-.035em}
  h1 em{font-style:normal;background:linear-gradient(transparent 62%,#fee891 62%)}
  p{position:absolute;left:64px;bottom:64px;margin:0;font:500 17px 'Geist Mono',monospace;color:#6d744f}
</style></head><body>
  <img class="lock" src="../identity/lockup.svg" alt="">
  <h1>Same room.<br><em>Bigger builds.</em></h1>
  <p>albretsen.no &nbsp;/&nbsp; software that pays for itself</p>
  <div class="room">
    <img class="then" src="../hero/room-2019.webp" alt="">
    <img class="now" src="../hero/room-today.webp" alt="">
    <div class="seam"></div>
    <span class="yr a">17</span><span class="yr b">today</span>
  </div>
</body></html>
