<!doctype html>
<meta charset="utf-8">
<title>press bake</title>
<style>html,body{margin:0;height:100%;background:#f6fbfc;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
<canvas id="c"></canvas>
<script type="module">
import { dawnPress } from '../assets/interactive/dawn-press.js';
const q = new URLSearchParams(location.search);
dawnPress(document.getElementById('c'), {
  image: q.get('img') || null,
  seed: +(q.get('seed') || 7),
  density: +(q.get('density') || 1),
  duration: 10,
  shimmer: false,
  orbits: q.get('orbits') === '1',
  grade: q.get('grade') || 'air', gamma: +(q.get('gamma') || 0.62), memory: +(q.get('memory') || 0.85), relief: +(q.get('relief') || 46),
});
</script>
