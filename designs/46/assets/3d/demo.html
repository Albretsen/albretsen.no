<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blink 3D demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--cream:#FFF6E4;--ink:#381A13;--butter:#FFE97E;--gum:#FF99C2;--mint:#8DEFC5;--lilac:#B6ADF3;--apricot:#FC9E47}
  body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.4 'DM Mono',monospace}
  .wrap{display:grid;grid-template-columns:1fr;gap:16px;padding:16px;max-width:1200px;margin:auto}
  @media(min-width:900px){.wrap{grid-template-columns:1.4fr 1fr}}
  .card{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:16/10;background:#fbe8ce}
  .card canvas{width:100%;height:100%;display:block}
  .toy{background:radial-gradient(circle at 50% 70%,#fff 0,#ffe97e 70%)}
  .ui{position:absolute;left:16px;right:16px;bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px}
  .ui label{background:#fff8;backdrop-filter:blur(8px);padding:6px 12px;border-radius:99px;display:flex;gap:8px;align-items:center}
  h1{font-family:'Bricolage Grotesque';font-weight:800;font-stretch:80%;font-size:clamp(32px,6vw,64px);margin:16px;line-height:.9}
</style></head>
<body>
<h1>Blink, live.</h1>
<div class="wrap">
  <div class="card"><canvas id="blink"></canvas>
    <div class="ui"><label>focus <input id="f" type="range" min="0" max="1" step="0.01" value="0.9"></label>
    <label>exposure <input id="e" type="range" min="-1.5" max="1.5" step="0.01" value="0"></label><span>click Blink = shutter</span></div></div>
  <div class="card toy" id="toy"><div class="ui"><span>drag to spin · double-click = shutter</span></div></div>
</div>
<script type="module">
  import { mountBlink } from './blink-live.js';
  import { mountClayCamera } from './clay-camera.js';
  const b = await mountBlink(document.getElementById('blink'), { scene: 'viewfinder', scale: 0.75 });
  f.oninput = () => b.focus(+f.value); e.oninput = () => b.exposure(+e.value);
  mountClayCamera(document.getElementById('toy'));
</script>
</body></html>
