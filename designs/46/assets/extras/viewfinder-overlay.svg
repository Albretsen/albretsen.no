<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="none" fill="none" aria-hidden="true">
  <!-- Viewfinder HUD to lay over the hero (stretch to fill; corner brackets use non-scaling strokes).
       Text uses the page font (DM Mono) when inlined; ids let a builder animate pieces:
       #vf-focus (focus box), #vf-meter-needle (exposure needle, translate X), #vf-rec (blinking dot). -->
  <defs><filter id="vfS"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#381A13" flood-opacity=".35"/></filter></defs>
  <g stroke="#FFFDF7" stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke" filter="url(#vfS)">
    <path d="M60 150 V60 H150" vector-effect="non-scaling-stroke"/><path d="M1450 60 H1540 V150" vector-effect="non-scaling-stroke"/>
    <path d="M60 850 V940 H150" vector-effect="non-scaling-stroke"/><path d="M1450 940 H1540 V850" vector-effect="non-scaling-stroke"/>
  </g>
  <g id="vf-focus" stroke="#FFE97E" stroke-width="4" vector-effect="non-scaling-stroke" filter="url(#vfS)">
    <path d="M700 390 V360 H740 M860 360 H900 V390 M900 610 V640 H860 M740 640 H700 V610" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
    <circle cx="800" cy="500" r="6" fill="#FFE97E" stroke="none"/>
  </g>
  <g fill="#FFFDF7" font-family="'DM Mono', ui-monospace, monospace" font-size="26" letter-spacing="2" filter="url(#vfS)">
    <circle id="vf-rec" cx="110" cy="110" r="11" fill="#ED3F4B"/>
    <text x="134" y="119">REC</text>
    <text x="1490" y="119" text-anchor="end">ISO 100</text>
    <text x="110" y="905">f/1.8</text><text x="250" y="905">1/250</text>
    <text x="1490" y="905" text-anchor="end">ALBRETSEN.NO</text>
  </g>
  <g transform="translate(800 905)" filter="url(#vfS)">
    <g stroke="#FFFDF7" stroke-width="3" stroke-linecap="round">
      <path d="M-200 0 v-18 M-150 0 v-10 M-100 0 v-18 M-50 0 v-10 M0 0 v-26 M50 0 v-10 M100 0 v-18 M150 0 v-10 M200 0 v-18"/>
    </g>
    <g fill="#FFFDF7" font-family="'DM Mono', ui-monospace, monospace" font-size="18" text-anchor="middle"><text x="-200" y="26">-2</text><text x="-100" y="26">-1</text><text x="0" y="26">0</text><text x="100" y="26">+1</text><text x="200" y="26">+2</text></g>
    <path id="vf-meter-needle" d="M0 -40 l-9 -14 h18 z" fill="#FFE97E"/>
  </g>
</svg>
