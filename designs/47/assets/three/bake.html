<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Shelf bake</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#cfccd4;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<!-- Offline still renderer. Usage: bake.html?view=hero&w=2880&h=1620&spp=40, screenshot at w x h.
     Accumulates N renders with jittered lights and sub-pixel camera offsets: soft daylight, contact shadows, clean edges. -->
<canvas id="out"></canvas>
<script type="module">
import * as THREE from 'three';
import { buildScene } from './shelf-scene.js';
const q = new URLSearchParams(location.search);
const view = q.get('view') || 'hero', W = +q.get('w') || innerWidth, H = +q.get('h') || innerHeight, N = +q.get('spp') || 32;
const exposure = +(q.get('exp') || 1);
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = exposure;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const { scene, camera, jitter } = await buildScene({ renderer, view, aspect: W / H, background: q.get('bg') ? '#' + q.get('bg') : null });
const gl = renderer.getContext();
const sum = new Float32Array(W * H * 4), buf = new Uint8Array(W * H * 4);
for (let i = 0; i < N; i++) {
  jitter(i + 1, N); if (q.has('nofill')) scene.traverse(o => { if (o.isDirectionalLight && o.intensity < 1) o.visible = false; }); if (q.has('nokey')) scene.traverse(o => { if (o.isDirectionalLight && o.intensity > 1) o.visible = false; });
  const jx = ((i * 0.5698403) % 1) - 0.5, jy = ((i * 0.7548776) % 1) - 0.5;
  camera.setViewOffset(W, H, jx, jy, W, H);
  renderer.render(scene, camera);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  for (let k = 0; k < buf.length; k++) sum[k] += buf[k];
}
const out = document.getElementById('out'); out.width = W; out.height = H;
const g = out.getContext('2d'), img = g.createImageData(W, H);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const s = ((H - 1 - y) * W + x) * 4, d = (y * W + x) * 4;
  img.data[d] = sum[s] / N; img.data[d + 1] = sum[s + 1] / N; img.data[d + 2] = sum[s + 2] / N; img.data[d + 3] = 255;
}
g.putImageData(img, 0, 0);
renderer.domElement.remove();
document.title = 'done';
</script>
</body></html>
