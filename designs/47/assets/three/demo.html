<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Live shelf</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
  @font-face{font-family:"Geist Mono";src:url(../fonts/geist-mono-var.woff2) format("woff2");font-weight:100 900}
  html,body{margin:0;height:100%;background:#c9c6cb;color:#19161f;font:12px/1.4 "Geist Mono",ui-monospace,monospace}
  #shelf{position:fixed;inset:0}
  p{position:fixed;left:16px;bottom:14px;margin:0;letter-spacing:.06em;text-transform:uppercase;color:#56535d}
  output{color:#19161f}
</style></head><body>
<div id="shelf"></div>
<p>Drag a tile along the shelf. Order: <output id="o"></output></p>
<script type="module">
  import { mountShelf } from './shelf-live.js';
  const o = document.getElementById('o');
  const s = await mountShelf(document.getElementById('shelf'), { onReorder: (ids) => (o.textContent = ids.join(' · ')) });
  o.textContent = s.order.join(' · ');
</script>
</body></html>
