<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voxel Sprites</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
:root{--void:#0d031e;--v900:#230445;--violet:#4b1788;--magenta:#f315a2;--orange:#fa8233;--vinyl:#f6f3fc;--phosphor:#f2ed2b}
html,body{margin:0;height:100%;background:var(--void);color:var(--vinyl);font:14px/1.5 'JetBrains Mono',monospace}
#stage{position:fixed;inset:0}
nav{position:fixed;left:16px;bottom:16px;display:flex;gap:8px;flex-wrap:wrap}
button{font:12px Silkscreen,monospace;letter-spacing:.04em;background:var(--v900);color:var(--vinyl);border:2px solid var(--violet);padding:8px 12px;cursor:pointer}
button[aria-pressed=true]{background:var(--magenta);border-color:var(--magenta);color:var(--void)}
p{position:fixed;left:16px;top:12px;margin:0;font:12px Silkscreen,monospace;color:#b7a6dc}
</style></head><body>
<div id="stage"></div>
<p>VOXEL SPRITES / DRAG TO SPIN</p>
<nav>
  <button data-src="voxel-mark.glb" aria-pressed="true">MARK</button>
  <button data-src="voxel-bolt.glb">BOLT</button>
  <button data-src="voxel-cursor.glb">CURSOR</button>
  <button id="px" aria-pressed="true">PIXEL RENDER</button>
</nav>
<script type="module">
import { mountVoxel } from './voxel.js';
const v = mountVoxel(document.getElementById('stage'), { src: 'voxel-mark.glb', pixel: 0.4 });
document.querySelectorAll('[data-src]').forEach((b) => b.onclick = () => {
  document.querySelectorAll('[data-src]').forEach((x) => x.setAttribute('aria-pressed', x === b)); v.setSrc(b.dataset.src);
});
const px = document.getElementById('px');
px.onclick = () => { const on = px.getAttribute('aria-pressed') !== 'true'; px.setAttribute('aria-pressed', on); v.setPixel(on ? 0.4 : 1); };
</script></body></html>
