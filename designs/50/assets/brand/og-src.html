<!doctype html>
<html><head><meta charset="utf-8"><title>OG source</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;650&family=Geist+Mono:wght@400&family=Silkscreen&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0d031e}
.og{position:relative;width:1200px;height:630px;overflow:hidden;color:#f6f3fc;font-family:Geist,sans-serif}
.shot{position:absolute;right:-150px;top:-40px;width:900px;transform:rotate(-4deg);border-radius:6px;box-shadow:0 40px 80px rgb(0 0 0 / .5)}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,#0d031e 34%,rgb(13 3 30 / .75) 52%,rgb(13 3 30 / 0) 75%)}
.copy{position:absolute;left:64px;top:64px;width:560px}
.lock{height:64px;image-rendering:pixelated;display:block}
h1{font-weight:650;font-size:58px;line-height:1.02;letter-spacing:-.035em;margin:72px 0 22px}
h1 em{font-style:normal;color:#fa8233}
.meta{font:15px/1.6 'Geist Mono',monospace;color:#b7a6dc}
.tag{position:absolute;left:64px;bottom:52px;font:13px Silkscreen,monospace;letter-spacing:.06em;color:#f2ed2b}
.strip{position:absolute;left:0;right:0;bottom:0;height:16px;background:url(../extras/ir-gradient-strip.png) 0 0/100% 64px;image-rendering:pixelated}
</style></head><body>
<div class="og">
  <img class="shot" src="../hero/sheet@2x.webp" alt="">
  <div class="fade"></div>
  <div class="copy">
    <img class="lock" src="lockup.svg" alt="Albretsen AS">
    <h1>I build software that <em>pays for itself.</em></h1>
    <div class="meta">Apps, SaaS and AI-agent infrastructure.<br>albretsen.no · Norway · on Google Play since 2016</div>
  </div>
  <div class="tag">SHEET 01 / IR SERIES</div>
  <div class="strip"></div>
</div>
</body></html>
