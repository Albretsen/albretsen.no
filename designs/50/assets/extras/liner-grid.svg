<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- Sticker-liner print: faint 24px grid with a pixel tick at every crossing. Tile it. -->
  <rect width="48" height="48" fill="#ece6f4"/>
  <rect x="0" y="0" width="48" height="1" fill="#8038d1" fill-opacity=".12"/>
  <rect x="0" y="24" width="48" height="1" fill="#8038d1" fill-opacity=".08"/>
  <rect x="0" y="0" width="1" height="48" fill="#8038d1" fill-opacity=".12"/>
  <rect x="24" y="0" width="1" height="48" fill="#8038d1" fill-opacity=".08"/>
  <rect x="0" y="0" width="3" height="1" fill="#4b1788" fill-opacity=".5"/>
  <rect x="0" y="0" width="1" height="3" fill="#4b1788" fill-opacity=".5"/>
</svg>
