<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scan Bust</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--violet:#462eeb;--deep:#170a62;--night:#090731;--ink:#f3f6ff;--spark:#ddf93c;--lilac:#a3a9ff}
  html,body{margin:0;height:100%;background:var(--violet);color:var(--ink);font-family:'Geist Mono',monospace}
  #bust{position:fixed;inset:0}
  .hud{position:fixed;left:16px;right:16px;bottom:16px;display:flex;gap:16px;align-items:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .hud h1{font:italic 500 22px 'Bodoni Moda',serif;letter-spacing:0;text-transform:none;margin:0 auto 0 0}
  input[type=range]{accent-color:var(--spark);width:min(320px,40vw)}
  label{display:flex;gap:10px;align-items:center}
</style></head>
<body>
<div id="bust"></div>
<div class="hud">
  <h1>Tab. IV. <span style="color:var(--spark)">Scan bust</span></h1>
  <label>scan <input id="p" type="range" min="0" max="1" step="0.001" value="0.55"></label>
  <label><input id="auto" type="checkbox" checked> loop</label>
</div>
<script type="module">
  import { mountScanBust } from './scan-bust.js';
  const params = new URLSearchParams(location.search);
  const bust = await mountScanBust(document.getElementById('bust'), { src: './marble-bust.glb' });
  const p = document.getElementById('p'), auto = document.getElementById('auto');
  const sync = () => bust.setProgress(auto.checked ? null : +p.value);
  p.oninput = () => { auto.checked = false; sync(); };
  auto.onchange = sync;
  if (params.has('p')) { auto.checked = false; p.value = params.get('p'); sync(); }
  if (params.has('r')) bust.setRotation(+params.get('r'));
  if (params.has('still')) document.querySelector('.hud').style.display = 'none';
</script>
</body></html>
