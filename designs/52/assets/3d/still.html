<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Scan Bust still</title>
<!-- Bakes hero/hero-scan-bust-*.webp. Open at 1440x900 (scale 2) and screenshot. ?p=scan progress, ?r=rotation -->
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:100vw;height:100vh;overflow:hidden;font-family:'Geist Mono',monospace;color:#f3f6ff}
  body{background:radial-gradient(55% 75% at 66% 52%,#5a45f5 0%,rgba(90,69,245,0) 70%),radial-gradient(90% 70% at 10% 105%,#170a62 0%,rgba(23,10,98,0) 60%),#462eeb}
  #bust{position:absolute;inset:0}
  .frame{position:absolute;inset:36px;border:1px solid rgba(243,246,255,.38);pointer-events:none}
  .frame:after{content:"";position:absolute;inset:6px;border:1px solid rgba(243,246,255,.14)}
  .tab{position:absolute;right:56px;top:12px;font:italic 500 30px 'Bodoni Moda',serif;background:#4f39f0;padding:0 10px}
  .cap{position:absolute;left:56px;bottom:14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;background:#2f1cb8;padding:4px 10px;color:#a3a9ff}
  .cap b{color:#ddf93c;font-weight:500}
  .lab{position:absolute;right:120px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#d9dcff;text-align:right}
  .lab i{font:italic 500 17px 'Bodoni Moda',serif;letter-spacing:0;text-transform:none;color:#ddf93c;display:block;margin-bottom:4px}
</style></head><body>
<div id="bust"></div>
<div class="frame"></div>
<div class="tab">Tab. III.</div>
<div class="lab" style="top:300px"><i>fig. 1.</i>scanned · engraved</div>
<div class="lab" style="top:560px"><i>fig. 2.</i>marble · untouched</div>
<div class="cap">Marble bust · Poly Haven <b>CC0</b> · rendered live, three.js</div>
<script type="module">
  import { mountScanBust } from './scan-bust.js';
  const q = new URLSearchParams(location.search);
  const b = await mountScanBust(document.getElementById('bust'), { src: './marble-bust.glb', offsetX: +(q.get('x') ?? 0.18) });
  b.setProgress(+(q.get('p') ?? 0.5)); b.setRotation(+(q.get('r') ?? -0.55));
</script>
</body></html>
