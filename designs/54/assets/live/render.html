<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vivarium render</title>
<!-- Bake page: ?view=hero|macro|solo|top &only=moth|beetle|ant|snail &bg=paper|none &still=1 -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: transparent; }
  body.paper { background:
      radial-gradient(60% 70% at 62% 48%, #fffdf6 0%, rgba(255,253,246,0) 70%),
      radial-gradient(120% 90% at 50% 60%, #f8f4ea 40%, #ece3d1 100%); }
  body.paper::after { content: ""; position: fixed; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .8;
    background-image: url("../extras/paper-grain.webp"); background-size: 512px; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  body.ink canvas { filter: url(#wobble); }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="wobble" x="-2%" y="-2%" width="104%" height="104%">
  <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="653" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<canvas id="c"></canvas>
<script type="module">
  import { createTerrarium } from './terrarium.js';
  const q = new URLSearchParams(location.search);
  if ((q.get('bg') || 'paper') === 'paper') document.body.classList.add('paper');
  if (/^#?[0-9a-f]{6}$/i.test(q.get('bg') || '')) document.body.style.background = '#' + q.get('bg').replace('#', '');
  if (q.get('ink') !== '0') document.body.classList.add('ink');
  const t = await createTerrarium(document.getElementById('c'), {
    view: q.get('view') || 'hero', only: q.get('only'), still: q.has('still'),
    dpr: +(q.get('dpr') || 1), time: +(q.get('t') || 0.6), noFloorShadow: q.has('noshadow'),
  });
  document.title = 'ready';
</script>
</body>
</html>
