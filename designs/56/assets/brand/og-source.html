<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>OG source</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Rendered with scripts/shot.sh at 1200x630 to produce og.png. Not part of the site. */
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#f9f2e2}
  .wrap{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:560px 1fr}
  .pic{position:relative;background:url(../img/hero/pines-bayer@1x.webp) 38% 50%/auto 140% no-repeat;image-rendering:pixelated;border-right:3px solid #052517}
  .pic .cap{position:absolute;left:18px;bottom:18px;background:#02130c;color:#efe5d0;font:400 13px/1 'IBM Plex Mono',monospace;padding:8px 10px;letter-spacing:.02em}
  .txt{padding:56px 56px 48px;display:flex;flex-direction:column;justify-content:space-between;background:#f9f2e2 url(../img/extras/paper-grain.webp) 0 0/256px}
  .wm{height:60px;width:auto;align-self:flex-start}
  h1{font:700 64px/0.98 'Bricolage Grotesque',sans-serif;font-variation-settings:'wdth' 88,'opsz' 96;letter-spacing:-.025em;color:#052517;margin:0}
  h1 em{font-style:normal;color:#966b27}
  .meta{display:flex;justify-content:space-between;font:700 15px/1 'IBM Plex Mono',monospace;color:#14422b;letter-spacing:.06em;text-transform:uppercase;border-top:2px solid #052517;padding-top:16px}
  .meta span:last-child{color:#e03c63}
</style></head>
<body><div class="wrap">
  <div class="pic"><div class="cap">misty_pines.hdr &rarr; 1-bit, Bayer 8&times;8</div></div>
  <div class="txt">
    <img class="wm" src="wordmark.svg" alt="Albretsen AS">
    <h1>I build software that pays&nbsp;for&nbsp;itself.<br><em>Most of&nbsp;it&nbsp;does.</em></h1>
    <div class="meta"><span>albretsen.no</span><span>Norway &middot; since 2016</span></div>
  </div>
</div></body></html>
