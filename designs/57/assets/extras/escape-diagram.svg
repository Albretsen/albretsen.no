<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Escape trajectory diagram">
  <!-- Hand-authored. A parking orbit, one burn, and a hyperbolic escape: the brand's whole story in one line.
       Designed for ink backgrounds. Inline it to animate: .ev-orbit on the dashed rings, stroke-dashoffset on #escape. -->
  <style>
    .t{font-family:"Martian Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.12em;fill:#fff;fill-opacity:.7;text-transform:uppercase}
    .r{fill:#F34046;fill-opacity:1}
  </style>
  <g fill="none" stroke="#fff">
    <circle cx="300" cy="300" r="46" stroke-width="1.5" fill="#070707"/>
    <circle cx="300" cy="300" r="46" stroke-opacity=".0"/>
    <ellipse class="ev-orbit" cx="300" cy="300" rx="120" ry="120" stroke-opacity=".5" stroke-width="1.4" stroke-dasharray="1 7" stroke-linecap="round"/>
    <ellipse class="ev-orbit" cx="300" cy="300" rx="190" ry="190" stroke-opacity=".25" stroke-width="1.2" stroke-dasharray="1 9" stroke-linecap="round"/>
    <path d="M300 180 A120 120 0 0 0 180 300 A120 120 0 0 0 300 420 A120 120 0 0 0 420 300" stroke-opacity=".9" stroke-width="2"/>
    <path d="M0 300 H1200" stroke-opacity=".08"/>
    <path d="M300 0 V520" stroke-opacity=".08"/>
    <g stroke-opacity=".35"><path d="M300 300 L420 300"/><path d="M420 292 V308"/></g>
  </g>
  <path id="escape" d="M420 300 C 430 210, 520 150, 680 120 S 1000 80, 1160 40" fill="none" stroke="#F34046" stroke-width="3"/>
  <path d="M1140 34 L1162 39 L1146 56" fill="none" stroke="#F34046" stroke-width="3"/>
  <circle cx="420" cy="300" r="7" fill="#F34046"/>
  <circle cx="420" cy="300" r="16" fill="none" stroke="#F34046" stroke-width="1.5"/>
  <g fill="none" stroke="#fff" stroke-opacity=".5"><path d="M420 300 L470 360 H600"/></g>
  <text class="t" x="476" y="352">Burn / t0</text>
  <text class="t" x="476" y="372" style="fill-opacity:.45">Δv applied once</text>
  <text class="t" x="232" y="214" style="fill-opacity:.45">Parking orbit</text>
  <text class="t r" x="760" y="88">Escape vector</text>
  <text class="t" x="280" y="304" style="font-size:11px">A</text>
  <g fill="#fff" fill-opacity=".6"><circle cx="980" cy="420" r="1.4"/><circle cx="860" cy="300" r="1"/><circle cx="1080" cy="230" r="1.6"/><circle cx="700" cy="460" r="1"/><circle cx="560" cy="60" r="1.2"/><circle cx="120" cy="90" r="1.4"/><circle cx="90" cy="460" r="1"/></g>
</svg>
