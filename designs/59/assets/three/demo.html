<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover Story 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  :root { --ink:#0f0b22; --paper:#f3f2fb; --violet:#6c35ec; --lime:#cefd3e; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { background:var(--paper); color:var(--ink); font:500 13px/1.4 'JetBrains Mono', monospace; overflow:hidden; }
  body.transparent { background:transparent; }
  #stage { position:fixed; inset:0; }
  .ui { position:fixed; left:16px; bottom:16px; display:flex; gap:10px; flex-wrap:wrap; }
  button { font:700 12px/1 'JetBrains Mono', monospace; letter-spacing:.14em; text-transform:uppercase; padding:12px 14px; border:3px solid var(--ink); background:var(--lime); box-shadow:4px 4px 0 var(--ink); cursor:pointer; transition:transform .12s, box-shadow .12s; }
  button:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); }
  button:active { transform:translate(4px,4px); box-shadow:0 0 0 var(--ink); }
  .note { position:fixed; left:16px; top:14px; font:italic 400 22px/1.1 'Instrument Serif', serif; max-width:300px; }
  .bare .ui, .bare .note { display:none; }
</style>
</head>
<body>
<div id="stage"></div>
<p class="note">Tilt with the pointer. Click or drag the cover to open it.</p>
<div class="ui">
  <button id="t">Open / close</button>
  <button id="g">Use device tilt</button>
</div>
<script type="module">
  import { mountCoverScene } from './cover-scene.js'
  const q = new URLSearchParams(location.search)
  if (q.has('bare')) document.body.classList.add('bare')
  if (q.has('transparent')) document.body.classList.add('transparent')
  const s = await mountCoverScene(document.getElementById('stage'), {
    open: q.has('open') ? Number(q.get('open')) : 0,
    still: q.has('still'),
    magnifier: !q.has('nolens'),
  })
  if (q.has('px')) { s.setPointer(Number(q.get('px')), Number(q.get('py') || 0), true); if (q.has('still')) s.render() }
  document.getElementById('t').onclick = () => s.toggle()
  document.getElementById('g').onclick = () => s.enableGyro()
  window.coverScene = s
</script>
</body>
</html>
