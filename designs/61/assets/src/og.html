<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG source</title>
<!-- Source for assets/identity/og-image.jpg (1200x630). Bake with a 1200x630 window at DPR 1. -->
<style>
@font-face{font-family:"EB Garamond";src:url(../fonts/EBGaramond-latin.woff2) format("woff2");font-weight:400 800}
@font-face{font-family:"EB Garamond";src:url(../fonts/EBGaramond-Italic-latin.woff2) format("woff2");font-weight:400 800;font-style:italic}
@font-face{font-family:"Jost";src:url(../fonts/Jost-latin.woff2) format("woff2");font-weight:400 600}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#FBF3E6}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.frame{position:absolute;inset:22px;border:1.5px solid #FBF3E6;box-shadow:inset 0 0 0 6px rgba(251,243,230,.35)}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:520px;padding:34px 40px 30px;background:#FBF3E6;text-align:center;color:#6E2233;
  box-shadow:0 30px 60px -20px rgba(110,34,51,.35)}
.card::before{content:"";position:absolute;inset:8px;border:1px solid #6E2233}
.card::after{content:"";position:absolute;inset:12px;border:.5px solid #6E2233;opacity:.6}
.lock{width:300px;display:block;margin:0 auto}
.line{font:italic 400 27px/1.2 "EB Garamond",serif;margin:20px 0 14px}
.dom{font:500 12px Jost,sans-serif;letter-spacing:.32em;text-transform:uppercase}
</style>
</head>
<body>
<img class="bg" src="../hero/calanque-morning-1600.jpg" alt="">
<div class="frame"></div>
<div class="card">
  <img class="lock" src="../identity/lockup-centred.svg" alt="Albretsen AS">
  <div class="line">Software that pays for itself.</div>
  <div class="dom">albretsen.no</div>
</div>
</body>
</html>
