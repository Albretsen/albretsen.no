<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrace Diorama</title>
<style>
  @font-face { font-family: 'Nunito'; src: url('../fonts/Nunito-var-latin.woff2') format('woff2'); font-weight: 200 1000; font-display: swap; }
  :root { --night: #16213D; --cream: #F5EDDF; --brass: #B8924A; --red: #B5373A; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--cream); font-family: Nunito, ui-rounded, system-ui, sans-serif; }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 100vh; overflow: hidden;
    /* the baked still paints first; WebGL fades in over it */
    background: var(--night) url('../hero/terrace-diorama-1280.webp') center / cover no-repeat; }
  .stage canvas { position: absolute; inset: 0; opacity: 0; transition: opacity 900ms steps(6, end); }
  .stage.ready canvas { opacity: 1; }
  .dial { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 14px; align-items: center;
    padding: 10px 18px; border-radius: 999px; background: rgba(22, 33, 61, .72); backdrop-filter: blur(6px);
    font-weight: 800; font-size: 12px; letter-spacing: .24em; text-transform: uppercase; }
  input[type=range] { accent-color: var(--brass); width: min(260px, 50vw); }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <label class="dial">Sunset <input id="dusk" type="range" min="0" max="1" step="0.01" value="0.65" aria-label="Dusk"> Night</label>
  </div>
<script type="module">
  import { mountDiorama } from './diorama3d.js'
  const stage = document.getElementById('stage')
  const d = await mountDiorama(stage, { base: '../layers/', dusk: 0.65 })
  stage.insertBefore(stage.querySelector('canvas'), stage.firstChild)
  requestAnimationFrame(() => stage.classList.add('ready'))
  document.getElementById('dusk').addEventListener('input', (e) => d.setDusk(+e.target.value))
</script>
</body>
</html>
