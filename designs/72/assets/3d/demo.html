<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terrace Dolly</title>
<style>
@font-face{font-family:'Albert Sans';src:url(../fonts/albert-sans-latin-var.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'DM Mono';src:url(../fonts/dm-mono-400-latin.woff2) format('woff2');font-weight:400;font-display:swap}
:root{--snow:#F6F1E7;--slate:#323A44;--falu:#8F2B20}
html,body{margin:0;background:var(--snow);color:var(--slate);font-family:'Albert Sans',system-ui,sans-serif}
.track{height:320vh}
.stage{position:sticky;top:0;height:100vh;overflow:hidden}
.stage picture,.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage img{width:100%;height:100%;object-fit:cover;display:block}
.stage canvas{opacity:0;transition:opacity 1.2s ease}
.stage canvas.on{opacity:1}
.cap{position:absolute;left:24px;bottom:22px;font:400 11px 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;background:rgba(246,241,231,.82);padding:8px 12px;border-radius:999px}
.cap b{color:var(--falu);font-weight:400}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head><body>
<div class="track">
  <div class="stage">
    <picture>
      <source type="image/avif" srcset="../hero/terrace-wide-960.avif 960w, ../hero/terrace-wide-1600.avif 1600w, ../hero/terrace-wide-2560.avif 2560w">
      <source type="image/webp" srcset="../hero/terrace-wide-960.webp 960w, ../hero/terrace-wide-1600.webp 1600w, ../hero/terrace-wide-2560.webp 2560w">
      <img src="../hero/terrace-wide-1600.jpg" width="1600" height="900" alt="A whitewashed house with falu red clapboard wings on a snowy terrace, golden hills and mountains behind, low winter sun">
    </picture>
    <canvas id="c" aria-hidden="true"></canvas>
    <div class="cap">Slow Dolly <b id="pct">0%</b> &middot; scroll</div>
  </div>
</div>
<script type="module">
// The one camera move: scroll progress (0..1) drives a lerped dolly from the
// wide spread to the lit doorway. Rendering happens only while the camera moves.
const canvas = document.getElementById('c')
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
const start = async () => {
  const { createTerrace } = await import('./terrace.js')
  const dpr = Math.min(devicePixelRatio || 1, 1.5)
  const t = await createTerrace(canvas, { width: innerWidth, height: innerHeight, dpr, ao: false, shadowSize: 2048 })
  let target = 0, cur = 0, raf = 0
  const track = document.querySelector('.track')
  const read = () => { const r = track.getBoundingClientRect(); target = Math.min(1, Math.max(0, -r.top / (r.height - innerHeight))) }
  const tick = () => {
    cur += (target - cur) * (reduce ? 1 : 0.06)
    t.setProgress(cur); t.render()
    document.getElementById('pct').textContent = Math.round(cur * 100) + '%'
    raf = Math.abs(target - cur) > 0.0005 ? requestAnimationFrame(tick) : 0
  }
  const kick = () => { read(); if (!raf) raf = requestAnimationFrame(tick) }
  addEventListener('scroll', kick, { passive: true })
  addEventListener('resize', () => { t.resize(innerWidth, innerHeight); kick() })
  read(); cur = target; t.setProgress(cur); t.render(); canvas.classList.add('on')
  if (new URLSearchParams(location.search).has('p')) { target = cur = +new URLSearchParams(location.search).get('p'); t.setProgress(cur); t.render() }
}
// Load after first paint, when the browser is idle.
;(window.requestIdleCallback || ((f) => setTimeout(f, 200)))(start)
</script>
</body></html>
