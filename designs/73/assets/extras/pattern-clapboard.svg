<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 96" width="48" height="96" role="img" aria-label="Standing board pattern">
  <title>Standing board pattern (tile)</title>
  <!-- Norwegian standing panel: wide board, narrow cover lath. Tile it as a background over a falu red or ochre fill. -->
  <rect width="48" height="96" fill="none"/>
  <rect x="0" y="0" width="2" height="96" fill="#000" opacity=".16"/>
  <rect x="2" y="0" width="1.2" height="96" fill="#fff" opacity=".18"/>
  <rect x="21" y="0" width="6" height="96" fill="#fff" opacity=".06"/>
  <rect x="26.4" y="0" width="1.2" height="96" fill="#000" opacity=".14"/>
  <rect x="24" y="0" width="1" height="96" fill="#000" opacity=".08"/>
</svg>
