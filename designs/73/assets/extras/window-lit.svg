<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 112" width="80" height="112" role="img" aria-label="A lit window">
  <title>Lit window</title>
  <!-- A two-light sash window. Inline it and target the data-glass rect to switch the glow (see motion.css, Lights On). -->
  <defs>
    <radialGradient id="wl-glow" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#ffe2ad"/>
      <stop offset="1" stop-color="#f6b48f"/>
    </radialGradient>
  </defs>
  <rect x="6" y="4" width="68" height="10" rx="2" fill="#fbf5ec"/>
  <rect x="10" y="14" width="60" height="84" fill="#fbf5ec"/>
  <rect data-glass="" x="15" y="19" width="50" height="74" fill="url(#wl-glow)"/>
  <rect x="38" y="19" width="4" height="74" fill="#fbf5ec"/>
  <rect x="15" y="46" width="50" height="4" fill="#fbf5ec"/>
  <rect x="2" y="98" width="76" height="8" rx="2" fill="#fbf5ec"/>
  <rect x="2" y="104" width="76" height="3" rx="1.5" fill="#1d1f24" opacity=".12"/>
</svg>
