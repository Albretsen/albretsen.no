<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front Light demo</title>
<link rel="icon" href="../identity/favicon.svg">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../motion.css">
<style>
  html, body { margin: 0; background: var(--linen); color: var(--umber); font-family: var(--font-sign); }
  /* Hero composite: graded sky (WebGL haze) / name / cut-out cliffs */
  .hero { position: relative; height: min(100svh, 980px); min-height: 560px; overflow: hidden; background: #b8662f; }
  .hero > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hero img, .hero canvas { object-fit: cover; display: block; width: 100%; height: 100%; }
  .hero canvas { opacity: 0; transition: opacity 1.2s; }
  .hero canvas[data-ready] { opacity: 1; }
  .hero .name { display: grid; place-items: start start; padding: 12vh 0 0 8.5vw; box-sizing: border-box; pointer-events: none; }
  @media (max-aspect-ratio: 4/5) { .hero .name { place-items: start center; padding: 24vh 0 0; } .hero .name span { font-size: 13.4vw; letter-spacing: .14em; margin-right: -.14em; } }
  .hero .name span { font: 300 clamp(2.6rem, 10.2vw, 11rem)/.9 var(--font-sign); letter-spacing: .2em; margin-right: -.2em; color: var(--linen);
    text-transform: uppercase; text-shadow: 0 0 60px rgb(255 236 200 / .35); }
  .hero .front { pointer-events: none; }
  .hero .line { inset: auto 0 6vh 0; height: auto; text-align: center; color: var(--sand); }
  .hero .line p { margin: 0; font: italic var(--step-2)/1.2 var(--font-script); }
  .hero .line small { display: block; margin-top: 14px; font: 500 12px/1 var(--font-mono); letter-spacing: .3em; text-transform: uppercase; color: var(--apricot); }
  section.rack { padding: var(--space-6) 16px; }
  section.rack h2 { text-align: center; margin: 0 0 var(--space-4); font: 450 14px/1 var(--font-sign); letter-spacing: .42em; text-transform: uppercase; color: var(--copper); }
</style>
</head>
<body>
<header class="hero" id="hero">
  <picture>
    <source type="image/avif" srcset="../hero/fjord-portrait-640.avif 640w, ../hero/fjord-portrait-1080.avif 1080w" media="(max-aspect-ratio: 4/5)">
    <source type="image/webp" srcset="../hero/fjord-portrait-640.webp 640w, ../hero/fjord-portrait-1080.webp 1080w" media="(max-aspect-ratio: 4/5)">
    <source type="image/avif" srcset="../hero/fjord-960.avif 960w, ../hero/fjord-1600.avif 1600w, ../hero/fjord-2400.avif 2400w">
    <img src="../hero/fjord-1600.jpg" srcset="../hero/fjord-960.webp 960w, ../hero/fjord-1600.webp 1600w, ../hero/fjord-2400.webp 2400w"
         sizes="100vw" width="1600" height="1116" alt="A fjord at golden hour, the low sun between two cliffs" fetchpriority="high">
  </picture>
  <canvas id="haze" aria-hidden="true"></canvas>
  <div class="name fl-first-light"><span>Albretsen</span></div>
  <picture class="front">
    <source srcset="../hero/fjord-front-right-portrait-640.webp 640w, ../hero/fjord-front-right-portrait-1080.webp 1080w" media="(max-aspect-ratio: 4/5)">
    <img src="../hero/fjord-front-right-1600.webp" srcset="../hero/fjord-front-right-960.webp 960w, ../hero/fjord-front-right-1600.webp 1600w, ../hero/fjord-front-right-2400.webp 2400w"
         sizes="100vw" width="1600" height="1116" alt="">
  </picture>
  <div class="line"><p>Quiet software that pays for itself.</p><small>Albretsen AS · since 2016</small></div>
</header>
<section class="rack">
  <h2>Four keys on the board</h2>
  <div id="rack"></div>
</section>
<script type="module">
  import { mountKeyRack } from './keyrack.js';
  mountKeyRack(document.getElementById('rack'));
  const q = new URLSearchParams(location.search);
  if (q.has('rack')) document.getElementById('hero').hidden = true;
  if (q.has('open')) document.querySelectorAll('.kr-slot')[+q.get('open') || 0]?.classList.add('is-open');
  // 3D/shader after first paint
  const go = () => import('./haze.js').then(({ mountHaze }) => {
    const portrait = matchMedia('(max-aspect-ratio: 4/5)').matches;
    mountHaze(document.getElementById('haze'), portrait
      ? { src: '../hero/fjord-portrait-1080.webp', sun: [0.52, 0.447], horizon: 0.70 }
      : { src: '../hero/fjord-1600.webp', sun: [0.466, 0.447], horizon: 0.70 });
  });
  'requestIdleCallback' in window ? requestIdleCallback(go, { timeout: 1200 }) : setTimeout(go, 300);
</script>
</body>
</html>
