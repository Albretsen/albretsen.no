<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunline demo</title>
<link rel="preload" href="../fonts/instrument-serif-regular.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: 'Instrument Serif'; src: url(../fonts/instrument-serif-regular.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url(../fonts/instrument-serif-italic.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: 'Schibsted Grotesk'; src: url(../fonts/schibsted-grotesk-vf.woff2) format('woff2'); font-weight: 400 900; font-display: swap; }
  :root { --ink: #1C1A17; --paper: #F4EBDD; --night: #0C1A2B; --gold: #F3B252; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--paper); font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
  .stage { position: relative; height: 100svh; min-height: 520px; overflow: hidden; }
  .stage picture, .stage img, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; display: block; }
  .stage canvas { opacity: 0; transition: opacity .8s ease; }
  .stage canvas.ready { opacity: 1; }
  .hit { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; }
  .hit:focus-visible { outline: 1px solid rgba(255,255,255,.7); outline-offset: 4px; }
  .hit::after { content: attr(data-label); position: absolute; left: 50%; top: 100%; transform: translate(-50%, 6px); white-space: nowrap; font: 500 11px/1 'Schibsted Grotesk', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.8); opacity: 0; transition: opacity .3s; }
  .hit:hover::after, .hit:focus-visible::after { opacity: 1; }
  .ui { position: absolute; left: 16px; right: 16px; bottom: 20px; display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: 13px; }
  .ui label { display: flex; gap: 10px; align-items: center; background: rgba(12,26,43,.45); backdrop-filter: blur(10px); padding: 10px 14px; border-radius: 999px; }
  .ui input { width: min(320px, 50vw); accent-color: var(--gold); }
  .ui button { font: inherit; color: inherit; background: rgba(12,26,43,.45); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 10px 16px; cursor: pointer; }
  h1 { position: absolute; left: 0; right: 0; top: 18%; margin: 0; text-align: center; font: 400 clamp(56px, 11vw, 168px)/.9 'Instrument Serif', serif; letter-spacing: -.01em; color: rgba(244,235,221,.92); pointer-events: none; }
  h1 em { font-style: italic; }
  body.bake .ui, body.bake .hit, body.bake h1 { display: none; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <picture>
    <source type="image/avif" srcset="../hero/first-light-1280.avif 1280w, ../hero/first-light-1920.avif 1920w, ../hero/first-light-2560.avif 2560w" sizes="100vw">
    <source type="image/webp" srcset="../hero/first-light-1280.webp 1280w, ../hero/first-light-1920.webp 1920w, ../hero/first-light-2560.webp 2560w" sizes="100vw">
    <img src="../hero/first-light-1280.jpg" width="1280" height="853" alt="A fjord at first light: deep blue sky, a crescent moon, a thin gold line on the horizon">
  </picture>
  <canvas id="c" aria-hidden="true"></canvas>
  <h1>Quiet <em>software</em></h1>
  <button class="hit" id="moon" data-label="Night" aria-label="Switch to night"></button>
  <button class="hit" id="sun" data-label="Morning" aria-label="Switch to day"></button>
  <div class="ui">
    <label>Sunrise <input id="r" type="range" min="0" max="1" step="0.001" value="0.35"></label>
    <button id="tog">Day / night</button>
  </div>
</div>
<script type="module">
  import { mountSunline } from './sunline.js';
  const q = new URLSearchParams(location.search);
  if (q.has('bake')) document.body.classList.add('bake');
  const canvas = document.getElementById('c');
  const s = await mountSunline(canvas, {
    src: 'first-light-tex.jpg', mask: 'first-light-mask.png', preserve: q.has('bake'),
    sun: +(q.get('sun') ?? 0.35), sunX: +(q.get('sunX') ?? 0.5), night: +(q.get('night') ?? 0), grain: q.has('bake') ? 0.02 : 0.035,
    dpr: q.has('bake') ? 1 : undefined,
  });
  canvas.classList.add('ready');
  const r = document.getElementById('r'); r.value = s.state.sun;
  r.addEventListener('input', () => s.set({ sun: +r.value }));
  // the reflection follows the pointer, gently
  let target = s.state.sunX;
  addEventListener('pointermove', e => { target = 0.3 + 0.4 * (e.clientX / innerWidth); });
  (function follow() { s.state.sunX += (target - s.state.sunX) * 0.04; s.set({}); place(); requestAnimationFrame(follow); })();
  const moon = document.getElementById('moon'), sun = document.getElementById('sun');
  function place() {
    const m = s.moonPoint(), p = s.sunPoint();
    moon.style.left = m.x + 'px'; moon.style.top = m.y + 'px';
    sun.style.left = p.x + 'px'; sun.style.top = p.y + 'px';
    moon.hidden = s.state.night > 0.5; sun.hidden = s.state.night < 0.5;
  }
  const toNight = async () => { await s.tween({ sun: 0 }, 900); await s.tween({ night: 1 }, 1400); r.value = 0; };
  const toDay = async () => { await s.tween({ night: 0 }, 1200); await s.tween({ sun: 0.55 }, 1800); r.value = 0.55; };
  moon.onclick = toNight; sun.onclick = toDay;
  document.getElementById('tog').onclick = () => (s.state.night > 0.5 ? toDay() : toNight());
</script>
</body>
</html>
