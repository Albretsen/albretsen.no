<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>OG source</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--cream)}
  .bg{position:absolute;inset:0;background:url(../hero/hero-terrace-1600.jpg) 58% 62%/1300px auto no-repeat}
  .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(243,235,221,.92) 0,rgba(243,235,221,.7) 30%,rgba(243,235,221,0) 52%)}
  .copy{position:absolute;left:64px;top:64px;bottom:64px;width:520px;display:flex;flex-direction:column;justify-content:space-between}
  .lock{width:330px}
  h1{font:600 92px/0.92 var(--font-poster);letter-spacing:.02em;text-transform:uppercase;color:var(--ink);margin:0}
  h1 em{font-style:normal;color:var(--cafe)}
  .meta{font:600 14px var(--font-poster);letter-spacing:.3em;text-transform:uppercase;color:var(--zinc-deep);display:flex;gap:18px;align-items:center}
  .meta i{display:block;width:44px;height:1px;background:var(--brass)}
</style></head>
<body><div class="bg"></div><div class="veil"></div>
<div class="copy">
  <img class="lock" src="lockup.svg" alt="Albretsen AS">
  <h1>Software<br>that pays<br>for <em>itself.</em></h1>
  <div class="meta"><span>albretsen.no</span><i></i><span>Since 2016</span></div>
</div>
</body></html>
