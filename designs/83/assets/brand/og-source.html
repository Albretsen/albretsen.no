<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Albretsen AS Open Graph source</title>
<!-- Source for og-image-1200x630.jpg: screenshot at exactly 1200x630. -->
<style>
  @font-face { font-family: Newsreader; src: url(../fonts/newsreader-latin.woff2) format('woff2'); font-weight: 200 800; }
  @font-face { font-family: Newsreader; font-style: italic; src: url(../fonts/newsreader-italic-latin.woff2) format('woff2'); font-weight: 200 800; }
  @font-face { font-family: 'Martian Mono'; src: url(../fonts/martian-mono-latin.woff2) format('woff2'); font-weight: 100 800; font-stretch: 75% 112.5%; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #041419; }
  .og { position: relative; width: 1200px; height: 630px; color: #eedbbd; }
  .og img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 50%; }
  .og::before { content: ""; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(90deg, rgb(4 20 25 / .78) 0%, rgb(4 20 25 / .45) 38%, rgb(4 20 25 / 0) 62%); }
  .copy { position: absolute; z-index: 2; left: 72px; top: 92px; width: 640px; }
  .wm { width: 520px; height: auto; display: block; }
  .line { font-family: Newsreader; font-style: italic; font-weight: 340; font-size: 50px; line-height: 1.08; margin: 34px 0 0; color: #f8f3e8; letter-spacing: -0.01em; font-variation-settings: 'opsz' 72; }
  .boot { position: absolute; z-index: 2; left: 72px; bottom: 56px; font: 400 15px/1 'Martian Mono'; font-stretch: 112.5%; letter-spacing: .08em; color: #7defda; text-transform: uppercase; }
  .boot b { color: #eedbbd; font-weight: 400; }
  .mark { position: absolute; z-index: 2; right: 64px; bottom: 48px; width: 64px; height: 64px; }
</style>
</head>
<body>
  <div class="og">
    <img class="bg" src="../hero/first-light-1280.jpg" width="1280" height="720" alt="">
    <div class="copy">
      <img class="wm" src="wordmark-sand.svg" width="520" height="105" alt="Albretsen AS">
      <p class="line">I build software<br>that pays for itself.</p>
    </div>
    <div class="boot"><b>albretsen.no</b> &nbsp;·&nbsp; warm boot ok_</div>
  </div>
</body>
</html>
